<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GeoMaster Atlas</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
    .app-back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 30px;
        font-family: sans-serif;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        z-index: 1000; /* Ensures it stays on top */
        transition: transform 0.2s;
        text-decoration: none; /* In case you use <a> tag */
    }
        .app-back-btn:hover {
        transform: scale(1.05);
        background-color: #0056b3;
    }
        :root {
            /* Vintage Map Theme Colors */
            --bg-map-tint: rgba(233, 214, 176, 0.85); /* Sepia overlay */
            --parchment: #f4e8d3;
            --parchment-dark: #e6d3b3;
            --border-dark: #3a2a18;
            --text-main: #2c1e0f;
            --text-sub: #5c4731;
            --success: #2d6a4f;
            --success-bg: #d8f3dc;
            --danger: #9b2226;
            --danger-bg: #f8d7da;
            --accent-blue: #1d3557;
            --accent-gold: #c29227;
            --radius: 12px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: #d4b483; /* Fallback color */
            /* Vintage World Map Background Pattern */
            background-image: url('https://www.transparenttextures.com/patterns/vintage-concrete.png'), linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(0,0,0,0.1));
            /* Note: In a real deployment, download a seamless vintage map pattern and use it here. 
               Using a texture placeholder for now that gives an old paper feel. */
            
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Vintage Vignette Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 150px rgba(58, 42, 24, 0.5);
            pointer-events: none;
            z-index: 1;
        }

        .hidden { display: none !important; }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        
        @keyframes tilt {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .anim-float { animation: float 4s ease-in-out infinite; }
        .anim-tilt { animation: tilt 5s ease-in-out infinite; }

        /* --- APP CONTAINER --- */
        .app-container {
            width: 100%;
            max-width: 900px;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .btn {
            cursor: pointer;
            border: none;
            outline: none;
            transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.98) !important; }

        /* --- PAPER SCROLL CONTAINER STYLE --- */
        .paper-container {
            background: var(--parchment);
            border: 4px solid var(--border-dark);
            border-radius: var(--radius);
            box-shadow: 
                inset 0 0 40px rgba(58, 42, 24, 0.1), /* Inner shadow for depth */
                0 10px 20px rgba(0,0,0,0.3), /* Outer drop shadow */
                0 6px 0 var(--border-dark); /* 3D border effect */
            position: relative;
            overflow: hidden;
        }
        
        /* Decorative corners */
        .paper-container::before, .paper-container::after {
            content: '✥';
            position: absolute;
            font-size: 2rem;
            color: var(--border-dark);
            opacity: 0.3;
        }
        .paper-container::before { top: 10px; left: 10px; }
        .paper-container::after { bottom: 10px; right: 10px; }


        /* --- MAIN MENU SCREEN --- */
        #menu-screen {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .compass-icon {
            font-size: 5rem;
            margin-bottom: -25px;
            z-index: 2;
            background: var(--parchment);
            border-radius: 50%;
            border: 4px solid var(--border-dark);
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            color: var(--accent-blue);
        }

        .title-scroll {
            background: var(--parchment-dark);
            border: 3px solid var(--border-dark);
            border-radius: 8px;
            padding: 15px 70px;
            box-shadow: 0 6px 0 var(--border-dark), 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            position: relative;
            transform: rotate(-1deg);
        }
        
        .title-scroll h1 {
            font-family: 'Lora', serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            width: 100%;
            padding: 10px;
        }

        .topic-card {
            background: var(--parchment);
            border: 3px solid var(--border-dark);
            border-radius: var(--radius);
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 6px 0 var(--border-dark), 0 8px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .topic-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 11px 0 var(--border-dark), 0 15px 25px rgba(0,0,0,0.2); 
            background: #fff0db;
        }
        .topic-card:active { transform: translateY(2px); box-shadow: 0 4px 0 var(--border-dark); }

        .tc-icon-wrapper {
            width: 90px; height: 90px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 3rem;
            margin-bottom: 20px;
            border: 3px solid var(--border-dark);
            background: var(--parchment-dark);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .tc-name { font-family: 'Lora', serif; font-weight: 700; font-size: 1.5rem; color: var(--text-main); margin-bottom: 5px;}
        .tc-status { font-size: 0.8rem; text-transform: uppercase; font-weight: 800; color: var(--text-sub); letter-spacing: 1px;}

        /* --- SUBMENU SCREEN (UNIVERSE TYPES) --- */
        #submenu-screen {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .submenu-title {
            font-family: 'Lora', serif;
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 40px;
            text-transform: uppercase;
            border-bottom: 3px double var(--border-dark);
            padding-bottom: 10px;
        }

        .type-grid {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 700px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .type-card {
            background: var(--parchment);
            border: 3px solid var(--border-dark);
            border-radius: var(--radius);
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 0 var(--border-dark);
            cursor: pointer;
            flex: 1 1 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .type-card:hover { transform: translateY(-5px); box-shadow: 0 13px 0 var(--border-dark); background: #fff0db;}
        
        .type-icon { font-size: 3.5rem; margin-bottom: 20px; }
        .type-name { font-family: 'Lora', serif; font-size: 1.8rem; font-weight: 700; }
        .type-desc { margin-top: 10px; color: var(--text-sub); font-weight: 600;}

        .back-btn-container { width: 100%; margin-bottom: 20px; }
        .back-btn {
            background: transparent; border: 2px solid var(--border-dark);
            padding: 8px 20px; border-radius: 30px; font-weight: 700; color: var(--text-main);
            display: flex; align-items: center; gap: 10px;
        }
        .back-btn:hover { background: var(--parchment-dark); }


        /* --- QUIZ SCREEN --- */
        .quiz-header {
            padding: 20px 35px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid var(--border-dark);
            background: rgba(58, 42, 24, 0.05);
        }

        .header-title { font-family: 'Lora', serif; font-weight: 700; font-size: 1.5rem; color: var(--text-main); display: flex; align-items: center; gap: 15px;}
        .score-badge { 
            background: var(--accent-gold); 
            color: #fff;
            padding: 8px 18px; 
            border-radius: 30px; 
            font-size: 1.1rem; 
            font-weight: 800;
            border: 2px solid var(--border-dark);
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .progress-container { height: 10px; background: rgba(58, 42, 24, 0.1); width: 100%; border-bottom: 3px solid var(--border-dark); }
        .progress-fill { height: 100%; background: var(--accent-blue); width: 0%; transition: width 0.4s ease; border-right: 2px solid var(--border-dark);}

        .quiz-body { padding: 40px; flex: 1; overflow-y: auto; }

        .question-meta {
            color: var(--accent-blue); font-size: 1rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .question-meta::before { content:''; height: 2px; width: 30px; background: var(--accent-blue); display: block;}

        .question-text {
            font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 700;
            line-height: 1.5; margin-bottom: 35px; color: var(--text-main);
        }

        .options-grid { display: flex; flex-direction: column; gap: 15px; }

        .option-card {
            padding: 18px 25px; border: 3px solid var(--border-dark);
            background: var(--parchment); border-radius: 10px; text-align: left;
            font-size: 1.1rem; font-weight: 700; color: var(--text-main); cursor: pointer;
            box-shadow: 0 4px 0 var(--border-dark);
            position: relative;
        }

        .option-card:hover:not(:disabled) {
            background: #fff;
            transform: translateY(-3px); box-shadow: 0 7px 0 var(--border-dark);
        }

        .option-card.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); }
        .option-card.wrong { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); opacity: 0.8; }

        .explanation-box {
            margin-top: 35px; background: rgba(255,255,255,0.5); border-radius: 12px; padding: 25px;
            border: 3px dashed var(--border-dark); animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .insight-title { font-family: 'Lora', serif; font-weight: 700; color: var(--accent-blue); margin-bottom: 12px; font-size: 1.3rem; display: flex; align-items: center; gap: 10px;}
        .expl-text { font-size: 1.05rem; line-height: 1.7; color: var(--text-main); font-weight: 600;}

        .action-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 40px; padding-top: 25px; border-top: 3px dotted var(--border-dark);
        }

        .exit-btn { background: transparent; color: var(--danger); font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;}
        .exit-btn:hover { text-decoration: underline; }

        .next-btn {
            background-color: var(--accent-blue); color: var(--parchment); padding: 14px 35px;
            border-radius: 30px; font-weight: 800; font-size: 1.1rem; border: 3px solid var(--border-dark);
            box-shadow: 0 6px 0 var(--border-dark); letter-spacing: 1px;
        }
        .next-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--border-dark); background-color: #2a4d7a;}

        /* --- RESULTS SCREEN --- */
        #result-screen { padding: 50px 40px; text-align: center; flex-grow: 1; overflow-y: auto; }
        .res-title { font-family: 'Lora', serif; font-size: 3rem; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .res-subtitle { color: var(--accent-blue); font-weight: 800; font-size: 1.4rem; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 3px;}

        .score-display {
            width: 180px; height: 180px; border-radius: 50%;
            background: conic-gradient(var(--accent-gold) var(--pct), var(--border-dark) 0);
            margin: 0 auto 40px; display: flex; align-items: center; justify-content: center;
            border: 5px solid var(--border-dark); box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .score-inner {
            width: 140px; height: 140px; background: var(--parchment); border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 3px dotted var(--border-dark);
        }
        .score-num { font-size: 3rem; font-weight: 800; color: var(--text-main); font-family: 'Lora', serif;}
        .score-label { font-size: 0.9rem; color: var(--text-sub); font-weight: 800; letter-spacing: 1px; text-transform: uppercase;}

        .review-section {
            background: rgba(255,255,255,0.5); border-radius: 12px; padding: 30px; text-align: left;
            margin-bottom: 30px; border: 3px solid var(--border-dark);
            max-height: 350px; overflow-y: auto;
        }

        .review-item { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px dashed var(--border-dark); }
        .review-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .rev-q { font-weight: 800; color: var(--text-main); margin-bottom: 8px; font-size: 1.1rem; font-family: 'Lora', serif;}
        .rev-a { font-size: 1rem; font-weight: 700; }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--parchment-dark); border-left: 2px solid var(--border-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 0; border: 2px solid var(--parchment); }
    </style>
</head>
<body>
    <button class="app-back-btn" onclick="history.back()">❮ Back to Menu</button>

<div class="app-container">
    <div id="menu-screen" class="paper-container">
        <div class="compass-icon anim-float">🧭</div>
        <div class="title-scroll anim-tilt">
            <h1>GeoMaster Atlas</h1>
        </div>

        <div class="topic-grid">
            <button class="btn topic-card" onclick="showUniverseSubmenu()">
                <div class="tc-icon-wrapper anim-float" style="color: var(--accent-blue);">🛸</div>
                <div class="tc-name">Universe</div>
                <div class="tc-status">2 Types Available</div>

            <button class="btn topic-card" onclick="alertVacant('Lithosphere')">

                <div class="tc-name">Lithosphere</div>
                <div class="tc-status">Vacant Sector</div>
            </button>
            <button class="btn topic-card" onclick="alertVacant('Atmosphere')">
                <div class="tc-icon-wrapper anim-float" style="color: #5b8db8; animation-delay: 1s;">☁️</div>
                <div class="tc-name">Atmosphere</div>
                <div class="tc-status">Vacant Sector</div>

            <button class="btn topic-card" onclick="alertVacant('Hydrosphere')">

                <div class="tc-name">Hydrosphere</div>
                <div class="tc-status">Vacant Sector</div>
            </button>
            <button class="btn topic-card" onclick="alertVacant('Agriculture')">
                <div class="tc-icon-wrapper anim-float" style="color: #e9c46a; animation-delay: 2s;">🌾</div>

                <div class="tc-status">Vacant Sector</div>

                <div class="tc-status">Vacant Sector</div>

    </div>

    <div id="submenu-screen" class="paper-container hidden">
        <div class="back-btn-container">

        </div>
        <h2 class="submenu-title">Universe Exploration</h2>
        
        <div class="type-grid">
            <button class="btn type-card" onclick="startQuiz('Level_1')">
                <div class="type-icon anim-float">🌌</div>
                <div class="type-name">Type 1</div>
                <div class="type-desc">Solar System Foundations</div>
            </button>
            <button class="btn type-card" onclick="startQuiz('Level_2')">
                <div class="type-icon anim-float" style="animation-delay: 0.5s;">🪐</div>
                <div class="type-name">Type 2</div>
                <div class="type-desc">Deep Space Concepts</div>
            </button>
        </div>
    </div>

    <div id="quiz-screen" class="paper-container hidden">
        <div class="quiz-header">
            <div class="header-title"><span style="font-size:1.8rem" class="anim-tilt">📜</span> <span id="topic-label">Level I</span></div>
            <div class="score-badge" id="score-badge">Score: 0</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-fill" id="progress-bar"></div>
        </div>

        <div class="quiz-body">
            <div class="question-meta">
                Progress: Question <span id="curr-q-num">1</span> / <span id="total-q-num">10</span>
            </div>

            <div class="question-text" id="q-text"></div>
            <div class="options-grid" id="opt-container"></div>

            <div id="explanation-container" class="explanation-box hidden">
                <div class="insight-title">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    Cartographer's Notes
                </div>
                <div id="expl-text" class="expl-text"></div>
            </div>
            
            <div class="action-row">
                <button class="btn exit-btn" onclick="quitQuiz()">✖ Abandon Expedition</button>
                <button class="btn next-btn hidden" id="next-btn" onclick="nextQuestion()">Chart Next Course &rarr;</button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="paper-container hidden">
        <h2 class="res-title">Expedition Complete!</h2>
        <div class="res-subtitle" id="rank-title">Explorer</div>

        <div class="score-display" id="score-circle-el">
            <div class="score-inner">
                <div class="score-num" id="final-score">0</div>
                <div class="score-label">DISCOVERIES</div>
            </div>
        </div>

        <div style="text-align: left; margin-bottom: 15px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px;">Journey Logbook</div>
        <div class="review-section" id="review-list"></div>

        <button class="btn next-btn" style="width: 100%; max-width: 350px; padding: 15px;" onclick="backToMainMenu()">Return to Atlas Map</button>
    </div>
</div>

    // ==========================================
    { level: "Level_1", q: "1. In 1905, who concluded with Thomas Chamberlain that the planets of the Solar System originated from an encounter between the Sun and another star?[SSC CPO 27/06/2024]", o: ["Forest Moulton", "Inge Lehmann", "Charles Lyell", "James Hutton"], c: 0, e: exp1 },
    { level: "Level_1", q: "2 Which dwarf planet orbits the sun in 310 years at a distance between 38.5 to 53 AU?[SSC CHSL 03/07/2024]", o: ["Ceres", "Eris", "Makemake", "Pluto"], c: 2, e: exp2 },
    { level: "Level_1", q: "3. Which of the following statement is correct?<br>[SSC CHSL 04/07/2024]", o: ["The density of Saturn is similar to that of Earth.", "The Size of Earth and Venus is almost similar.", "The size of Jupiter and Mars is similar.", "Mars is the warmest planet."], c: 1, e: "Saturn is the least dense planet while Earth is the densest planet (5.51 g/cm³).<br><br>Size of planets - Jupiter > Saturn > Uranus > Neptune > Earth > Venus > Mars > Mercury.<br>Venus(Lucifer) is the warmest planet not that Venus(Lucifer) is the warmest planet not the Mars." },
    { level: "Level_1", q: "4. Which of the following does NOT have rings?<br>[SSC CHSL 11/07/2024]", o: ["Venus", "Uranus", "Saturn", "Jupiter"], c: 0, e: "Rings are the characteristics of Jovian planets(Jupiter, Saturn, Uranus, Neptune) while Venus is a terrestrial planet(Mercury, Venus, Earth, Mars).<br>Recall the difference between Terrestrial and Jovian planets.<br>Do you know Terrestrial and Jovian planets are separated by Asteroid belt?" },
    { level: "Level_1", q: "5. ______oblong orbit overlaps the orbit of Neptune.<br>[SSC CHSL 10/07/2024]", o: ["Venus’", "Mars’", "Pluto’s", "Jupiter’s"], c: 2, e: exp5 },
    { level: "Level_1", q: "6. Which of the following rocky planets is the fastest planet in our solar system-travelling through space at 29 miles(47 Kilometers) per second?[SSC CHSL 05/07/2024]", o: ["Earth", "Mercury", "Venus", "Mars"], c: 1, e: "Mercury is the fastest planet(revolution - 88 days). It is also the smallest and the closest planet to the Sun. It has no satellite, water, and gases($\\mathrm{O}_2$, $\\mathrm{N}_2$, $\\mathrm{H}_2$, $\\mathrm{CO}_2$). Recall the characteristics of Venus, Earth and Mars." },
    { level: "Level_1", q: "7. The length of a day on____is approximately 16 hours.<br>[SSC CHSL 05/07/2024]", o: ["Mars", "Mercury", "Venus", "Neptune"], c: 3, e: "Neptune(ice giant) – discovery - Johann Galle and Urbain Le Verrier (1846) - only planet to be discovered by mathematical predictions. 14 satellites(famous - Triton). Windiest planet. Colour - Bluish(due to Methane). Atmoshphere - Hydrogen and Helium. Farthest planet.<br>Rotation - 16 hours. Revolution - 165 days(slowest)" },
    { level: "Level_1", q: "8. Which of the following planets’ atmosphere is made up of thick white and yellowish clouds of sulphuric acid?[SSC CHSL 03/10/2020]", o: ["Jupiter", "Neptune", "Venus", "Mars"], c: 2, e: exp8 },
    { level: "Level_1", q: "9. Which of the following statements about planet Saturn is true?[SSC CHSL 04/07/2024]", o: ["Saturn is the fourth planet from the Sun and the largest planet in our Solar system.", "Satellites like Enceladus and Titan of Saturn are home to internal oceans, could possibly support life.", "Saturn is a massive ball made up mostly of nitrogen.", "Saturn’s environment Is conductive to life."], c: 1, e: exp9 },
    { level: "Level_1", q: "10. Which planet is the second largest planet in our solar system and also has the biggest and brightest rings around it?<br>[SSC CHSL 10/07/2024]", o: ["Jupiter", "Earth", "Uranus", "Saturn"], c: 3, e: exp9 },
    { level: "Level_1", q: "11. Which is the most widely accepted model to explain the formation and evolution of the solar system?[SSC CPO 03/10/2023]", o: ["Cloud hypothesis", "Gas hypothesis", "Nebular hypothesis", "Solar hypotheses"], c: 2, e: exp1 },
    { level: "Level_1", q: "12. Terrestrial planets are composed of _____.<br>[SSC CPO 03/10/2023]", o: ["Metals and air", "Rocks and metals", "Metals and gas", "Rocks and gas"], c: 1, e: exp12 },
    { level: "Level_1", q: "13. Which trend is found about the distance between the galaxies?<br>[SSC CPO 04/10/2023]", o: ["Unpredictable", "Decreasing", "Constant", "Increasing"], c: 3, e: "Galaxies are moving away from each other at a constant rate. It is called Hubble’s law.<br>Nearest galaxy - Andromeda<br>Study of Universe - Cosmology" },
    { level: "Level_1", q: "14. Which scientist thought of the concept of the steady state of the universe?<br>[SSC CGL 14/07/2023]", o: ["Harold Jeffrey", "Edwin Hubble", "Fred Hoyle", "Pierre-Laplace"], c: 2, e: "Steady state theory - universe is eternal with no beginning or end and new matter is continuously formed to maintain its density.<br>" + exp1 },
    { level: "Level_1", q: "15. Which among the following is another word for universe?<br>[SSC CHSL 10/03/2023]", o: ["Blg Crunch", "Astronomy", "Cosmos", "Supernova"], c: 2, e: "Universe is also called Cosmos and its study is called Cosmology.<br>Big crunch(opposite of Big Bang) - contraction of Universe to a state of infinite density and temperature Astronomy is the study of everything in the universe beyond Earth’s atmosphere.<br><br>Supernova - explosion of stars<br>Pulsar - a neutron star<br>Black hole - a place in space with infinite density" },
    { level: "Level_1", q: "16. Which of the following is a part of celestial objects?<br>[SSC CPO 09/11/2022]<br>I. Stars II. Planets<br>III. Moon", o: ["Only I and III", "Only I and II", "I, II and III", "Only II and III"], c: 2, e: exp16 },
    { level: "Level_1", q: "17. The bodies glowing in the night sky are known as ______.<br>[SSC CGL 03/03/2020]", o: ["Celestial bodies", "Asteroids", "Planetarium", "Meteorite"], c: 0, e: "Planetarium - a building with curved ceiling built for educational and entertaining purpose<br>Meteorite - meteor hitting the Earth surface<br>Meteoroid - any solid debris of asteroid, comet or other celestial objects that floats through interplanetary space<br>Meteor(shooting/falling star) - streak of light that appears when a meteoroid enters the atmosphere(mesosphere)<br>" + exp16 },
    { level: "Level_1", q: "18. Cosmic snowballs of frozen gases, rock and dust that orbit the Sun are known as____.[SSC MTS 16/05/2023]", o: ["Meteors", "Star", "Meteorites", "Comets"], c: 3, e: exp16 + "<br>Stars - luminous bodies, their colour depends on temperature<br>Group of stars - Constellation(Largest - Hydra, Ursa Major - Sapt Rishi).<br>Do you know that Rigel is the brightest star in Orion constellation while overall Sirius(dog star) is the brightest star?<br>Closest star to Earth - Sun(150 mn km), 2nd closest - Proxima Centuri" },
    { level: "Level_1", q: "19. Which of the following constellations is also called the hunter?<br>[SSC CHSL 10/03/2023]", o: ["Cassiopeia", "Leo Major", "Ursa Major", "Orion"], c: 3, e: exp19 },
    { level: "Level_1", q: "20. Which among the following planets is also known as “Morning Star”?[SSC MTS 10/05/2023]", o: ["Jupiter", "Neptune", "Venus", "Earth"], c: 2, e: exp20 },
    { level: "Level_1", q: "21. Which among the following is the coldest planet in the solar system?[SSC MTS 16/05/2023]", o: ["Mars", "Neptune", "Saturn", "Uranus"], c: 3, e: "Uranus - Green planet(due to $\\text{CH}_4$), rolling/lopsided planet(tilted $98^\\circ$), discovered by William Herschel(1781)<br>Mars - Red planet(iron oxide), 2 moons - Phobos and Deimos, largest volcano and tallest mountain - Olympus Mons" },
    { level: "Level_1", q: "22. The Kuiper Belt is a ring of icy rocks & dust bodies just outside the orbit of____.[SSC MTS 17/05/2023]", o: ["Saturn", "Venus", "Jupiter", "Neptune"], c: 3, e: exp5 },
    { level: "Level_1", q: "23. The asteroid belt lies between which two planets?<br>[SSC CHSL 21/03/2023]", o: ["Jupiter and Saturn", "Mars and Jupiter", "Saturn and Uranus", "Mercury and Venus"], c: 1, e: "" },
    { level: "Level_1", q: "24. In approximately how much time does Mars complete one spin on its axis?<br>[SSC CHSL 15/03/2023]", o: ["16 hours", "8 hours", "1 day 18 hours", "1 day"], c: 3, e: "Martian day(sol) is of about 24.6 hours.<br>Rotation time of other planets is - Venus - 243 days(slowest), Earth - 24 hours, Jupiter - 10 hours(fastest)" },
    { level: "Level_1", q: "25. On which planet has a rotating oval of clouds, twice as wide as Earth, called the ‘Great Red Spot’ been observed for more than 300 years?<br>[SSC CHSL 08/08/2023]", o: ["Neptune", "Mercury", "Jupiter", "Venus"], c: 2, e: "Great Red Spot is a storm system on Jupiter,<br>" + exp20 + "<br>Sunspots are temporary phenomena on the photosphere of the Sun appearing as dark spots as they are 500-1500°C cooler than the surrounding chromosphere." },
    { level: "Level_1", q: "26. The distance of the Sun from the Earth is about____light minutes.<br>[SSC CHSL 20/03/2023]", o: ["6", "4.3", "12", "8"], c: 3, e: "Sun - 99% mass of the solar system, 109 time of Earth, composed of Hydrogen(73%) and Helium(25%), outer layer - Corona, visible part - Photosphere<br>Light year($9.46 \\times 10^{12}$ km) is the distance travelled by light in one year. 1 Parsec = 3.26 light year.<br>Do you know that Aditya L1 is the first solar mission of India?" },
    { level: "Level_1", q: "27. Who was the first to accurately describe the rings of Saturn as a disc around the planet in 1655?[SSC CGL 06/12/2022]", o: ["Hideki Yukawa", "Galileo Galilei", "Christiaan Huygens", "Giovanni Cassini"], c: 2, e: exp9 },
    { level: "Level_1", q: "28. From the given alternatives, identify the dwarf planet.<br>[SSC CHSL 30/06/2023]", o: ["Pluto", "Mercury", "Neptune", "Mars"], c: 0, e: exp5 + "<br>" + exp2 },
    { level: "Level_1", q: "29. The____radiation belts are giant swaths of magnetically trapped highly energetic charged particles that surround Earth.<br>[SSC CGL 13/04/2022]", o: ["Van Allen", "Aurora", "Kuiper", "Chinook"], c: 0, e: "Van Allen belts are two radiation belts of charged particles located In Earth’s magnetic field.<br>Location - inner belt - 3,000 km above Earth; outer belt - 15,000-20,000 km above Earth.<br>These belts are dangerous for humans and spacecrafts and the energetic electrons in them are called “killer” electrons as they can damage spacecrafts.<br>Aurora - It is a display of light in the sky at the poles.<br>Chinook(aka snow eater) - Local warm wind of Northern America, blows on the eastern side of Rocky mountains" },
    { level: "Level_1", q: "30. Which of the following is the windiest planet in the solar system?[SSC MTS 14/10/2021]", o: ["Neptune", "Uranus", "Saturn", "Mars"], c: 0, e: "Neptune is the windiest planet in the solar system." },
    { level: "Level_1", q: "31. Lucifer is another name for the planet____.<br>[SSC CGL 03/03/2020]", o: ["Jupiter", "Mars", "Venus", "Saturn"], c: 2, e: "Venus is also called as Lucifer, Earth’s twin, morning star, evening star." },
    { level: "Level_1", q: "32. Minal wrote an essay on the largest moon of Saturn. Which among the following moons is it?[SSC MTS 19/06/2023]", o: ["Atlas", "Titan", "Carme", "Europa"], c: 1, e: "Titan is the largest moon of Saturn." },
    { level: "Level_1", q: "33. The moon moves around the earth in about____days.<br>[SSC MTS 14/06/2023]", o: ["21", "23", "27", "25"], c: 2, e: exp33 },
    { level: "Level_1", q: "34. In early 1610, who discovered with his newly invented telescope that Jupiter has four moons?[SSC CGL 06/12/2022]", o: ["Simon Marlys", "Tycho Brahe", "Galileo Galilei", "Johannes Kepler"], c: 2, e: "Galileo discovered 4 moons(Lo, Europa, Ganymede, Calisto) of Jupiter which are called Galilean moons." },
    { level: "Level_1", q: "35. Which of the following celestial bodies has a natural satellite named ‘Charon’?[SSC MTS 05/10/2021]", o: ["Haumea", "Pluto", "Mars", "Saturn"], c: 1, e: "Charon is the satellite of Pluto.<br>" + exp5 },
    { level: "Level_1", q: "36. What is the radius of the moon?[SSC CHSL 19/03/2020]", o: ["$1.78 \\times 10^6$ m", "$1.79 \\times 10^6$ m", "$1.74 \\times 10^5$ m", "$1.74 \\times 10^6$ m"], c: 3, e: exp33 },
    { level: "Level_1", q: "37. Planetary scientists call the gaseous envelope around the Moon as the____.[SSC CGL 04/03/2020]", o: ["lunar exosphere", "lunar stratosphere", "lunar thermosphere", "lunar endosphere"], c: 0, e: "The gaseous envelope around the Moon is called Lunar Exosphere.<br>Argon 40 is an important constituent of it.<br>The gaseous envelope around the Earth is called Atmosphere.<br>Recall the layers of Earth’s atmosphere with their characteristics." },
    { level: "Level_1", q: "38. In which of the following periods is the meteor shower named Quadrantids generally visible from Earth?<br>[SSC MTS 20/10/2021]", o: ["August/September", "October/November", "May/June", "December/January"], c: 3, e: "Quadrantids are generally active between the end of December and the second week of January and peaks around 3-4 January." },
    { level: "Level_1", q: "39. In which of the following months may the meteor shower named Lyrids be seen from Earth?[SSC MTS 20/10/2021]", o: ["April", "February", "June", "August"], c: 0, e: "" },
    { level: "Level_1", q: "40. Each orbit of the International Space Station(ISS) takes____minutes.<br>[SSC CHSL 13/03/2023]", o: ["80 - 82", "85 - 87", "90 - 93", "83 - 86"], c: 2, e: "International Space Station(ISS) - partner countries - Europe, USA, Russia, Canada, Japan. The largest structure put in space by humans.<br>In 24 hours, the ISS orbits Earth 16 times. Speed - 28,000 km/hr." },
    { level: "Level_1", q: "41. The moon completes____rotation on its axis as it completes one-revolution around the Earth[SSC CPO 09/11/2022]", o: ["3", "2", "1", "4"], c: 2, e: "The time taken by Moon for 1 rotation is same as that for 1 revolution so only one side is visible to us.<br>Rotation = Revolution = 27 days.<br>More info about moon - " + exp33 },
    { level: "Level_1", q: "42. A distinctive cross-shaped constellation best seen in the northern hemisphere during the summer and fall months around September is[SSC CHSL 02/07/2024]", o: ["Cygnus", "Pegasus", "Ursa Major", "Cassiopeia"], c: 0, e: exp19 },
    { 
        level: "Level_1", 
        q: "1. Geoid is the____of the Earth.[SSC CHSL 01/07/2024]", 
        o: ["Orbit", "Shape", "Colour", "Axis"], 
        c: 1, 
        e: "The shape of Earth is Geoid/Oblate spheroid(flat from top and bottom and bulges at centre)<br><br>Reason for geoid shape - more centrifugal force at equator due to rotation.<br><br>2 types of forces act on a revolving body - Centripetal force(towards the centre) and Centrifugal force(away from centre)" 
    },
    { 
        level: "Level_1", 
        q: "2. Which of the following statements is INCORRECT regarding the Coriolis force?[SSC CHSL 02/07/2024]", 
        o: ["It deflects the wind to the right in the north and left in the south.", "It is absent at the equator.", "Deflection is less when the wind is high.", "It is directly proportional to the angle of altitude."], 
        c: 2, 
        e: "Coriolis force is the apparent force experienced due to rotation of Earth. It deflects the wind to the right in the NH and to the left in the SH. It is max at poles and absent at equator. It is directly proportional to the speed of wind. Geostrophic winds - winds which blow parallel to isobars due to balance of Coriolis force and pressure gradient" 
    },
    { 
        level: "Level_1", 
        q: "3. Which is the Standard Meridian of India?<br>[SSC CHSL 05/07/2024]", 
        o: ["$83^\\circ 30‘$ E", "$82^\\circ 30‘$ E", "$81^\\circ 30‘$ E", "$84^\\circ 40‘$ E"], 
        c: 1, 
        e: "Meridian(longitude) is the imaginary vertical lines running from North to South. It is the angular distance of a place from prime meridian. Distance between meridians - max at equator(111.32 km) and least at poles. Total meridians = 360.<br><br>Important meridians – Prime meridian/GMT(0°) - passes through Greenwich, London; International Date Line(180°)<br><br>GMT passes through 8 countries - UK, France, Spain, Algeria, Mali, Burkina Faso, Togo, Ghana{TRICK - BSF GAMe in TOGO Kingdom}.<br>Moving from W to E on IDL – day gained and date lost.<br><br>Do you know that all longitudes are great circles(largest circle which can be drawn on a sphere dividing it into two equal halves) but only 1 latitude(equator) is a great circle?<br><br>Tropic of Cancer and Indian Standard Meridian intersect each other at Koriya district in Chattisgarh." 
    },
    { 
        level: "Level_1", 
        q: "4. Which of the following statement/statements is/are true regarding the light year?[SSC CHSL 27/06/2024]<br>1. Light year is a unit of distance.<br>2. Light year is a unit of time.<br>3. A light year is the distance that light travels in one Earth year.<br>4. Light year is the measurement of light intensity.", 
        o: ["Only 1 and 3 are correct", "Only 1 and 2 are correct", "Only 1 is correct", "Only 2 is correct"], 
        c: 0, 
        e: "Light year($9.46 \\times 10^{12}$ years) is the distance travelled by light in 1 Earth year. Hence, it is a unit of distance.<br><br>1 Parsec = 3.26 light years." 
    },
    { 
        level: "Level_1", 
        q: "5. Perihelion is when Earth is ______.[SSC PHASE XII 24/07/2024]", 
        o: ["Farthest from the sun", "Under the sun", "Nearest to the sun", "Above the sun"], 
        c: 2, 
        e: "Perihelion(3 January) - Earth is nearest to the Sun(147.5 mn km)<br>Aphelion(4 July) - Earth is farthest from the Sun(152.5 mn km)<br>Distance between Sun and Earth(avg) - 150 mn km<br><br>Perigee - moon closest to Earth Apogee - moon farthest from Earth" 
    },
    { 
        level: "Level_1", 
        q: "6. What makes countries near the equator hotter than those which are away from the equator?[SSC JE 06/02/2024]", 
        o: ["The equator is near the earth’s core.", "The equator is a hot line.", "Areas near the equator have more volcanoes.", "Areas near the equator receive direct and more sunlight"], 
        c: 3, 
        e: "Equator($0^\\circ$ latitude) divides the Earth in two equal halves - NH and SH.<br><br>Latitudes - imaginary horizontal lines running East to West. It Is the angular distance of a place from equator.<br><br>$1^\\circ$. latitude = 111 km. Total latitudes = 181. Distance between each latitude is same.<br><br>Important latitudes – 0° - Equator, 23.5° N - Tropic of Cancer, 23.5° S - Tropic of Capricorn, 66.5° N - Arctic circle, 66.5° S - Antarctic circle<br><br>Do you know that the direct sunlight only falls between 23.5° N and 23.5° S. Beyond these, only slant rays fall?<br><br>The temperature in subtropical regions is more than that at equator due to factors like less cloudiness in subtropics and absence of large water bodies." 
    },
    { 
        level: "Level_1", 
        q: "7. What is the radius of the Earth?[SSC CHSL 09/03/2023]", 
        o: ["7456 km", "6371 km", "5619 km", "4728 km"], 
        c: 1, 
        e: "Equatorial radius=6378 km, Equatorial circumference=40,075 km<br>Polar radius = 6357 km, Polar circumference = 40,007 km<br>Mean radius = 6371 km, Mean circumference = 40,040 km<br><br>Equatorial speed > Polar speed, Equatorial radii > Polar radii, Equatorial circumference > Polar circumference" 
    },
    { 
        level: "Level_1", 
        q: "8. Which among the following is not a type of solar eclipse?<br>[SSC CHSL 15/03/2023]", 
        o: ["Annular", "Partial", "Penumbral", "Total"], 
        c: 2, 
        e: "Solar Eclipse - moon is between Sun and Earth and blocks the sunlight. Occurs during New moon(amavasya).<br><br>It is of 3 types - total, annular, partial Lunar Eclipse - earth is between Sun and moon and blocks the sunlight. Occurs during Full moon(purnima) Blue moon is when there are 2 purnima in one month Lunar eclipse + perigee = bigger moon(super moon)" 
    },
    { 
        level: "Level_1", 
        q: "9. Which of the following statements regarding the moon is correct?[SSC CPO 11/11/2022]<br>I. The size of the illuminated part of the moon vislble from the Earth increases each day after the new moon day.<br>II. After the full moon day, the sunlit part of the moon visible from the Earth decreases in size every day.", 
        o: ["Both I and II", "Only I", "Neither I nor II", "Only II"], 
        c: 0, 
        e: "Full moon(purnima) - moon appears as a full circle<br><br>New moon(amavasya) - moon is invisible<br><br>After purnima, illuminated part of moon decreases(waning phase) each day and in nearly 15 days it becomes invisible thereby causing amavasya." 
    },
    { 
        level: "Level_1", 
        q: "10. During the phenomenon of aphelion, the approximate distance between the Earth and the Sun is:[SSC CHSL 12/10/2020]", 
        o: ["137 million km", "152 million km", "147 million km", "142 million km"], 
        c: 1, 
        e: "Perihelion(3 January) - Earth is nearest to the Sun(147.5 mn km)<br>Aphelion(4 July) - Earth is farthest from the Sun(152.5 mn km)" 
    },
    { 
        level: "Level_1", 
        q: "11. How many degrees does the Earth rotate about its own axis in one hour?<br>[SSC CGL 06/03/2020]", 
        o: ["10", "20", "24", "15"], 
        c: 3, 
        e: "Each hour, Earth rotates about $15^\\circ$ and hence in 24 hours it completes one rotation($24 \\times 15^\\circ = 360^\\circ$).<br><br>Moving 15° East from prime meridian - time increases by 1 hour<br>Moving 15° West from prime meridian - time decreases by 1 hour<br>Rotation causes day and night while revolution and tilt cause change in seasons." 
    },
    { 
        level: "Level_1", 
        q: "12. Which of the following sets of statements are correct about the Inter-Tropical Convergence Zone(ITCZ)?<br>[SSC CPO 05/10/2023]<br>I. The ITCZ is a broad trough of low pressure in equatorial latitudes.<br>II. This is where the northeast and the southeast trade winds converge.<br>III. The ITCZ is the equatorial trough normally positioned about $5^\\circ\\mathrm{N}$ of the equator and remains there throughout the year.<br>IV. The ITCZ moves over to the plane of Ganga in Summer.", 
        o: ["Only I and III", "I, II and III", "Only II and III", "I, II and IV"], 
        c: 3, 
        e: "ITCZ(doldrum) is a low pressure belt between $10^\\circ$ N and $10^\\circ$ S. It Is a zone of convergence of airmass. It moves north and south with the apparent shift of Sun. Cell - representation of general circulation of atmosphere, 3 cells - Hadley cell, Ferrel cell, Polar cell" 
    },
    { 
        level: "Level_1", 
        q: "13. During October-November, the apparent movement of the sun is towards the____.[SSC MTS 18/05/2023]", 
        o: ["North", "North-East", "North-West", "South"], 
        c: 3, 
        e: "During October-November, the apparent movement of the Sun is towards the South because during this time, Earth is tilted away from the Sun in NH and towards the Sun in SH.<br>Earth is tilted at 23.5° on its axis and 66.5° on its orbital plane.<br>Summer solstice - 21 June, Winter solstice - 22 December" 
    },
    { 
        level: "Level_1", 
        q: "14. On which of the following two dates does the equinox fall?<br>[SSC CHSL 15/03/2023]", 
        o: ["21 June and 23 September", "21 March and 21 June", "21 March and 23 September", "23 September and 22 December"], 
        c: 2, 
        e: "Equinox - sunlight fall vertically on equator, so equal day and night. Vernal/Spring equinox-21 march, Autumnal/fall equinox - 23 september. Recall about summer and winter solstice." 
    },
    { 
        level: "Level_1", 
        q: "15. What is the zone between the Arctic Circle and North Pole called?<br>[SSC CHSL 21/03/2023]", 
        o: ["Torrid zone", "Frigid zone", "North temperate zone", "South temperate zone"], 
        c: 1, 
        e: "Frigid zone – 66.5° N - 90° N and 66.5° S - 90° S<br>Torrid zone – 23.5° N - 23.5° S<br>Temperate zone – 23.5° N - 66.5° N and 23.5° S - 66.5° S<br>Recall all the important latitudes.<br><br>Arctic circle - 66.5° N, Antarctic circle - 66.5° S, Tropic of Cancer - 23.5° N, Tropic of Capricorn - 23.5° S<br><br>Do you know that longitudes Intersect each other at North and South poles whereas latitudes don’t intersect each other?" 
    },
    { 
        level: "Level_1", 
        q: "16. 1° latitude is equal to approximately ______km.<br>[SSC CHSL 16/10/2020]", 
        o: ["111", "145", "133", "122"], 
        c: 0, 
        e: "$1^\\circ$ latitude = 111 km" 
    },
    { 
        level: "Level_1", 
        q: "17. Lines joining locations at equal travel time from a common center are called:[SSC CHSL 21/10/2020]", 
        o: ["Isohalines", "Isochrones", "Isobar", "Isobronts"], 
        c: 1, 
        e: "Isochrones - line joining locations at equal travel time<br>Isohalines - line joining places of same salinity<br>Isobar - line joining places of same atmospheric pressure<br>Isobronts - line joining places where thunderstorms are in a specific phase at a specific time<br>Isohyets - line joining places with same amount of rainfall<br>Isonephs - line joining places with same amount of cloud cover<br>Iobaths - line joining places with same depth below water" 
    },
    { 
        level: "Level_1", 
        q: "18. All parallel circles from the Equator to the poles are known as<br>[SSC CHSL 26/10/2020]",

// --- APP LOGIC ---
let activeQuizData = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];

// Navigation functions
function showUniverseSubmenu() {
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('submenu-screen').classList.remove('hidden');
}

function backToMainMenu() {
    document.getElementById('submenu-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

function alertVacant(topicName) {
    alert(`The '${topicName}' sector is currently uncharted. Data will be available in future updates.`);
}

function startQuiz(levelCode) {
    activeQuizData = QUESTIONS_DB.filter(q => q.level === levelCode);
    
    if(activeQuizData.length === 0) {
        alert("No data available for this selection yet.");
        return;
    }

    currentIndex = 0;
    score = 0;
    userAnswers = [];

    document.getElementById('submenu-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');

    const levelLabels = {
        'Level_1': "Universe - Type 1",
        'Level_2': "Universe - Type 2"
    };
    
    document.getElementById('topic-label').innerText = levelLabels[levelCode] || "Quiz";
    loadQuestion();
}

function loadQuestion() {
    if(currentIndex >= activeQuizData.length) { 
        showResults(); 
        return; 
    }

    const q = activeQuizData[currentIndex];
    const pct = (currentIndex / activeQuizData.length) * 100;
    
    document.getElementById('progress-bar').style.width = `${pct}%`;
    document.getElementById('curr-q-num').innerText = currentIndex + 1;
    document.getElementById('total-q-num').innerText = activeQuizData.length;
    document.getElementById('score-badge').innerText = `Score: ${score}`;

    document.getElementById('explanation-container').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');

    document.getElementById('q-text').innerHTML = q.q;
    const container = document.getElementById('opt-container');
    container.innerHTML = '';

    q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-card';
        // Using a marker like 'A)' for options
        btn.innerHTML = `<span style="margin-right: 12px; font-weight: 800; color: var(--accent-blue);">${String.fromCharCode(65 + i)}.)</span> ${opt}`;
        btn.onclick = () => handleAnswer(btn, i, q.c);
        container.appendChild(btn);
    });
}

function handleAnswer(btn, selected, correct) {
    const btns = document.querySelectorAll('.option-card');
    btns.forEach(b => b.disabled = true);

    const q = activeQuizData[currentIndex];
    const isCorrect = selected === correct;
    
    userAnswers.push({ 
        q: q.q, 
        user: q.o[selected], 
        correct: q.o[correct], 
        isCorrect: isCorrect 
    });

    if(isCorrect) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('wrong');
        btns[correct].classList.add('correct');
    }
    
    document.getElementById('score-badge').innerText = `Score: ${score}`;

    const explBox = document.getElementById('explanation-container');
    const explText = document.getElementById('expl-text');
    
    if (q.e && q.e.trim() !== "") {
        explText.innerHTML = q.e;
        explBox.classList.remove('hidden');
    } else {
        explText.innerHTML = "<em>No additional notes recorded for this entry.</em>";
        explBox.classList.remove('hidden');
    }
    
    document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
    currentIndex++;
    loadQuestion();
}

function showResults() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    
    const pct = Math.round((score / activeQuizData.length) * 100);
    document.getElementById('final-score').innerText = `${score} / ${activeQuizData.length}`;
    document.getElementById('score-circle-el').style.setProperty('--pct', `${pct}%`);
    
    let rank = "Novice Surveyor";
    if(pct >= 50) rank = "Competent Cartographer";
    if(pct >= 80) rank = "Master Navigator";
    if(pct === 100) rank = "Legendary Atlas Keeper";
    
    document.getElementById('rank-title').innerText = rank;

    const revContainer = document.getElementById('review-list');
    revContainer.innerHTML = userAnswers.map((a, i) => `
        <div class="review-item">
            <div class="rev-q">${i + 1}. ${a.q}</div>
            <div class="rev-a" style="color: ${a.isCorrect ? 'var(--success)' : 'var(--danger)'}">
               ${a.isCorrect ? '✅ Correct Selection: ' + a.user : '❌ You selected: ' + a.user + '<br><span style="color:var(--success); margin-top:8px; display:inline-block; font-weight:800;">✅ Correct Answer: ' + a.correct + '</span>'}
            </div>
        </div>
    `).join('');
}

function quitQuiz() {
    if(confirm("Are you sure you want to abandon the current expedition? Progress will be lost.")) {
        backToMainMenu();
    }
}
</script>
