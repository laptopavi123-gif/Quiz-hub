      },
      {
        t: "In which Indian state will you find Mount Tiyi?",
        o: ["Arunachal Pradesh", "Odisha", "Himachal Pradesh", "Nagaland"],
        c: 3,
        e: "Nagaland. Some other mountains: Japfu Peak, Changkikong Range, Mount Saramati, Veda Peak, Ongpangkong Range."
      },
      {
        t: "In which of the following Indian states is the Gorichen peak located?",
        o: ["Madhya Pradesh", "Arunachal Pradesh", "Himachal Pradesh", "Nagaland"],
        c: 1,
        e: "Arunachal Pradesh. Gorichen Peak (6858 m) is the highest peak in Arunachal Pradesh, Dhupgarh is the highest in Madhya Pradesh, and Reo Purgyil is the highest in Himachal Pradesh."
      },
      {
        t: "Mountaineers refer to altitudes above about ______ meters as the 'death zone'.",
        o: ["5,800", "8,000", "6,700", "7,200"],
        c: 1,
        e: "8,000. The death zone refers to altitudes where oxygen pressure is too low to sustain human life for extended periods."
      },
      {
        t: "Which of the following is a mountain peak that rises above the surrounding peaks at the mountainous border of the Indian state of Nagaland and the Sagaing region of Myanmar?",
        o: ["Mount Kalsubai", "Mount Doddabetta", "Mount Saramati", "Mount Dhupgarh"],
        c: 2,
        e: "Mount Saramati. Doddabetta is the highest mountain in the Nilgiri Mountains at 2,637 meters. Kalsubai (highest point) is a mountain in the Western Ghats, located in the Indian state of Maharashtra."
      },
      {
        t: "Generally, a steep hill with an elevation of more than ______ meters is classified as a mountain.",
        o: ["600", "500", "1000", "800"],
        c: 0,
        e: "600. Within the earth, a continuous movement is taking place. The process leads to the upliftment and sinking of the earth's surface at several places. The external process is the continuous wearing down and rebuilding of the land surface. Eg: Erosion and Deposition."
      },
      {
        t: "______ is created by the collision of convergent plate boundaries.",
        o: ["Mid-ocean ridge", "Land erosion", "Oceanic trench", "Mountain building"],
        c: 3,
        e: "Mountain building. A convergent boundary is an area on earth where two or more lithospheric plates converge or collide and one plate eventually slides beneath the other."
      },
      {
        t: "'Pidurutalagala' is the highest mountain peak in",
        o: ["Bhutan", "Sri Lanka", "Myanmar", "Nepal"],
        c: 1,
        e: "Sri Lanka. Pidurutalagala (Mount Pedro) is the tallest mountain in Sri Lanka, standing at 2,524 m in Nuwara Eliya."
      },
      {
        t: "Which of the following hills is situated in Assam?",
        o: ["Aravali Hills", "Karbi Anglong Hills", "Javadi Hills", "Shevaroy Hills"],

      },
      {
        t: "Where is Mount Diavolo, an important mountain peak in the Andaman and Nicobar Islands, Located?",
        o: ["Great Nicobar", "North Andaman", "Middle Andaman", "South Andaman"],
        c: 3,
        e: "South Andaman. It has an elevation of 295 meters. Middle Andaman is separated from North Andaman Island by Austen Strait, and from Baratang Island at the south by Homfray's Strait."
      },
      {
        t: "Mount Jopuno is situated in which of the following states?",
        o: ["Uttarakhand", "Sikkim", "Andhra Pradesh", "Himachal Pradesh"],
        c: 1,
        e: "Sikkim. Mount Jopuno, located in western Sikkim at 5,603 meters, is situated within Khangchendzonga National Park."
      },
      {
        t: "Which of the following hills is situated in Andhra Pradesh?",
        o: ["Kaimur Hills", "Pachmarhi Hills", "Nagari Hills", "Girnar Hills"],
        c: 2,
        e: "Nagari hills. Other hill stations in Andhra Pradesh include Tirumala, Araku Valley, Horsley Hills, Lambasingi, Nallamala Hills."
      },
      {
        t: "In which of the following states is the Shatrunjaya Hills located?",
        o: ["Gujarat", "Andhra Pradesh", "Madhya Pradesh", "Karnataka"],
        c: 0,
        e: "Gujarat. Other prominent hills in Gujarat include- Bhujia Hill, Dhinodhar, Girnar, Kalo Dungar, Pavagadh Hill, Thaltej-Jodhpur Tekra, Wilson Hills."
      },
      {
        t: "Which of the following mountains is situated near the Siachen region of Ladakh in India?",
        o: ["Kirat Chuli Mountain", "Kabru Mountain", "Kanchenjunga Mountain", "K12 Mountain"],
        c: 3,
        e: "K12 Mountain. Kirat Chuli Mountain or Tent Peak is a mountain in the Himalayas. Kabru is a mountain in the Himalayas on the border of eastern Nepal and India. Kanchenjunga is part of the Great Himalaya Range. K12 is the second highest peak in the Saltoro Mountains, a subrange of the Karakoram range in the Siachen region, in Ladakh."
      },
      {
        t: "Borra Caves are situated on the East Coast of India in which of the following hills?",
        o: ["Nallamala Hills", "Horsley Hills", "Nagari Hills", "Ananthagiri Hills"],
        c: 3,
        e: "Ananthagiri Hills. Borra Caves, also called Borra Guhalu, are located on the East Coast of India, in the Ananthagiri hills of the Araku Valley of the Visakhapatnam district in Andhra Pradesh."
      },
      {
        t: "Which of the following types of volcanic eruptions of Earth's volcanoes are most explosive?",
        o: ["Caldera", "Lapolith", "Dykes", "Flood basalt provinces"],
        c: 0,
        e: "Caldera. A caldera eruption is the most explosive type of volcanic activity, occurring when a volcano's magma chamber empties and the ground above collapses, forming a large, circular depression. Example: Yellowstone Caldera. Dykes: It is a vertical or steeply inclined geological formation that occurs when magma cuts through rock layers and solidifies. Flood basalt provinces: Flood basalt refers to large, extensive lava flows that spread out over vast areas. Example: Deccan Traps in India."
      },
      {
        t: "What is the name of the process of gases being outpoured from the interior of the solid earth?",
        o: ["Evaporation", "Transpiration", "Degassing", "Gas evolution"],
        c: 2,
        e: "Degassing is the process by which gases are released from the interior of the solid Earth, typically through volcanic activity or other geological processes. This includes gases such as water vapor, carbon dioxide, sulfur dioxide, and others that are expelled from magma or other subsurface materials."
      },
      {
        t: "Which of the following statements is best related to the 'pacific ring of fire'?",
        o: ["Known for thermal power station", "Known for volcano and earthquakes", "Known for only glacial formations", "Known for tropical rainforests"],
        c: 1,
        e: "The 'ring of fire' is a ring of volcanoes in the Pacific Ocean."
      },
    ];

    // ==========================================
    //  APP STATE
    // ==========================================
    let quizData = [];
    let currentQIndex = 0;
    let score = 0;
    
    // Timer Variables
    let timerInterval = null;
    let currentTimerDuration = 0; 
    let timeLeft = 0; 
    let isPaused = false;
    
    let userResults = [];

    // Init
    window.onload = () => restartQuiz();

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function restartQuiz() {
      // 1. Deep copy the raw questions
      quizData = JSON.parse(JSON.stringify(rawQuestions));
      
      // 2. Shuffle the ORDER of questions
      shuffleArray(quizData);
      
      // 3. Shuffle the OPTIONS within each question
      quizData.forEach(q => {
        // Store the correct answer string before shuffling
        const correctAnswerText = q.o[q.c];
        
        // Shuffle the options array
        shuffleArray(q.o);
        
        // Find the new index of the correct answer string
        q.c = q.o.indexOf(correctAnswerText);
      });
      
      currentQIndex = 0;
      score = 0;
      userResults = [];
      isPaused = false;
      updatePauseButton();
      
      document.getElementById('score').innerText = 0;
      document.getElementById('total').innerText = quizData.length;
      document.getElementById('game-area').style.display = 'block';
      document.getElementById('review-area').style.display = 'none';
      document.getElementById('settings-area').style.display = 'flex';
      
      document.getElementById('timer-container').style.display = 'block';

      loadQuestion();
    }

    function togglePause() {
      const pauseBtn = document.getElementById('pause-btn');
      const gameArea = document.getElementById('game-area');
      const overlay = document.getElementById('pause-overlay');
      const statsContent = document.getElementById('pause-stats-content');

      if (!isPaused) {
        // ACTION: PAUSE
        clearInterval(timerInterval);
        isPaused = true;
        
        // Calculate Stats
        const attempted = userResults.length;
        const correct = userResults.filter(r => r.status === 'correct').length;
        const wrong = userResults.filter(r => r.status === 'wrong').length;
        const skipped = userResults.filter(r => r.status === 'skipped').length;
        
        statsContent.innerHTML = `
          <div class="pause-stat-row"><span>Attempted:</span> <span class="stat-val">${attempted}</span></div>
          <div class="pause-stat-row"><span>Correct:</span> <span class="stat-val" style="color:#a8e6cf">${correct}</span></div>
          <div class="pause-stat-row"><span>Wrong:</span> <span class="stat-val" style="color:#ff8b94">${wrong}</span></div>
          <div class="pause-stat-row"><span>Skipped:</span> <span class="stat-val" style="color:#ffd3b6">${skipped}</span></div>
        `;

        gameArea.classList.add('paused-content');
        overlay.style.display = 'flex'; // Use flex to center
        pauseBtn.innerText = "Resume";
        pauseBtn.classList.add('paused-state');
      } else {
        // ACTION: RESUME
        isPaused = false;
        gameArea.classList.remove('paused-content');
        overlay.style.display = 'none';
        pauseBtn.innerText = "Pause";
        pauseBtn.classList.remove('paused-state');
        runTimer(); // Resume with existing global 'timeLeft'
      }
    }
    
    function updatePauseButton() {
      const pauseBtn = document.getElementById('pause-btn');
      const overlay = document.getElementById('pause-overlay');
      const gameArea = document.getElementById('game-area');
      
      isPaused = false;
      pauseBtn.innerText = "Pause";
      pauseBtn.classList.remove('paused-state');
      overlay.style.display = 'none';
      gameArea.classList.remove('paused-content');
    }

    function loadQuestion() {
      if(timerInterval) clearInterval(timerInterval);
      
      updatePauseButton();

      const q = quizData[currentQIndex];
      document.getElementById('current').innerText = currentQIndex + 1;
      document.getElementById('question-text').innerHTML = q.t;
      document.getElementById('explanation-text').innerText = q.e;

      const optionsDiv = document.getElementById('options-container');
      optionsDiv.innerHTML = '';
      
      // Reset grid layout
      optionsDiv.className = 'options';

      document.getElementById('feedback-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      
      document.querySelector('.quiz-container').classList.remove('apply-shake');

      // Check for long options to adjust layout (stack vertically if too long)
      const hasLongOptionText = q.o.some(opt => opt.length > 30);
      if(hasLongOptionText) {
        optionsDiv.classList.add('single-col');
      }

      q.o.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerText = optText;
        btn.onclick = () => checkAnswer(index, btn);
        optionsDiv.appendChild(btn);
      });

      // CALCULATE TIME (Auto Mode Logic)
      const timerMode = document.getElementById('timer').value;
      
      if(timerMode === "auto") {
        // Smart Timer: 
        // If any option is longer than 50 chars (sentence-based answer), give 20 seconds.
        const hasLengthyOptions = q.o.some(opt => opt.length > 50);
        const hasLongQuestion = q.t.length > 100;

        if (hasLengthyOptions) {
          currentTimerDuration = 20;
        } else if (hasLongQuestion) {
           currentTimerDuration = 15;
        } else {
          currentTimerDuration = 10;
        }
      } else {
        currentTimerDuration = parseInt(timerMode);
      }

      timeLeft = currentTimerDuration; 
      runTimer();
    }

    function runTimer() {
      const bar = document.getElementById('timer-bar');
      bar.style.backgroundColor = 'var(--timer-color)';
      
      const percentage = (timeLeft / currentTimerDuration) * 100;
      bar.style.width = percentage + '%';

      timerInterval = setInterval(() => {
        timeLeft -= 0.1; 
        const pct = (timeLeft / currentTimerDuration) * 100;
        bar.style.width = pct + '%';

        if(timeLeft <= 0) {
          clearInterval(timerInterval);
          bar.style.width = '0%';
          handleTimeOut();
        }
      }, 100);
    }

    function showNotification(text, type) {
      const banner = document.getElementById('top-notification');
      banner.innerText = text;
      banner.className = `top-notification show ${type}`;
      setTimeout(() => banner.classList.remove('show'), 2500);
    }

    function handleTimeOut() {
      const q = quizData[currentQIndex];
      showNotification("Time's Up!", "error");
      
      document.querySelector('.quiz-container').classList.add('apply-shake');
      
      userResults.push({ qIndex: currentQIndex, status: 'skipped', userAnswer: null });
      revealAnswer(null);
    }

    function checkAnswer(selectedIndex, btnElement) {
      if(timerInterval) clearInterval(timerInterval);
      
      const q = quizData[currentQIndex];
      const isCorrect = (selectedIndex === q.c);

      userResults.push({
        qIndex: currentQIndex,
        status: isCorrect ? 'correct' : 'wrong',
        userAnswer: q.o[selectedIndex]
      });

      if(isCorrect) {
        score++;
        document.getElementById('score').innerText = score;
        showNotification("Correct!", "success");
        setTimeout(() => nextQuestion(), 500);
      } else {
        showNotification("Wrong Answer!", "error");
        document.querySelector('.quiz-container').classList.add('apply-shake');
        btnElement.classList.add('wrong');
        revealAnswer(selectedIndex);
      }
    }

    function revealAnswer(userSelectedIndex) {
      const q = quizData[currentQIndex];
      const btns = document.querySelectorAll('.option');
      
      btns.forEach((btn, idx) => {
        btn.disabled = true;
        if(idx === q.c) btn.classList.add('correct');
      });

      document.getElementById('feedback-box').style.display = 'block';
      document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
      currentQIndex++;
      if(currentQIndex < quizData.length) {
        loadQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('settings-area').style.display = 'none';
      document.getElementById('timer-container').style.display = 'none';
      document.getElementById('review-area').style.display = 'block';

      const correctCount = userResults.filter(r => r.status === 'correct').length;
      const wrongCount = userResults.filter(r => r.status === 'wrong').length;
      const skippedCount = userResults.filter(r => r.status === 'skipped').length;

      document.getElementById('final-stats').innerHTML = `
        <div class="stat-box" style="color:#155724; background:#d4edda; border-color:#c3e6cb">Correct: ${correctCount}</div>
        <div class="stat-box" style="color:#721c24; background:#f8d7da; border-color:#f5c6cb">Wrong: ${wrongCount}</div>
        <div class="stat-box">Skipped: ${skippedCount}</div>
        <h3 style="margin-top:20px;">Final Score: ${score} / ${quizData.length}</h3>
      `;

      const reviewContainer = document.getElementById('review-details');
      reviewContainer.innerHTML = '';

      const mistakes = userResults.filter(r => r.status !== 'correct');
      
      if(mistakes.length === 0) {
        document.getElementById('toggle-review-btn').style.display = 'none';
        reviewContainer.innerHTML = '<p style="text-align:center;">Perfect Score! Well done.</p>';
      } else {
        document.getElementById('toggle-review-btn').style.display = 'inline-block';
        mistakes.forEach(m => {
          const q = quizData[m.qIndex];
          const userVal = m.userAnswer || "Time Out";
          const correctVal = q.o[q.c];
          
          reviewContainer.innerHTML += `
            <div class="review-item">
              <span class="badge-wrong">${m.status.toUpperCase()}</span>
              <p><b>Q:</b> ${q.t}</p>
              <p><b>Your Answer:</b> <span style="text-decoration:line-through; color:var(--subtext)">${userVal}</span></p>
              <p style="color:var(--correct-text)"><b>Correct:</b> ${correctVal}</p>
              <div style="background:#f1f3f5; padding:10px; border-radius:6px; font-size:0.9rem; margin-top:5px;">
                <i>${q.e}</i>
              </div>
            </div>
          `;
        });
      }
    }

    function toggleReviewDetails() {
      const el = document.getElementById('review-details');
      const btn = document.getElementById('toggle-review-btn');
      if(el.style.display === 'none') {
        el.style.display = 'block';
        btn.innerText = 'Hide Mistakes';
      } else {
        el.style.display = 'none';
        btn.innerText = 'Review Mistakes';
      }
    }
  </script>
