<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Assessment - Offline</title>
    
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --border-color: #e5e7eb;
            --success: #10b981;
            --success-bg: #d1fae5;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Switched to system fonts for offline support */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Top Progress Bar */
        .progress-wrapper {
            width: 100%;
            max-width: 800px;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Main Card */
        .assessment-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px dashed var(--border-color);
        }

        .question-number {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-meta {
            font-size: 0.85rem;
            color: var(--text-gray);
            background: #f3f4f6;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 500;
        }

        .question-content {
            font-size: 1.25rem;
            line-height: 1.7;
            margin-bottom: 2rem;
            color: #111827;
        }

        /* Options layout */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }

        .option-item:hover {
            border-color: #a5b4fc;
            background: #eef2ff;
        }

        .option-item.selected {
            border-color: var(--primary);
            background: #eef2ff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .option-item.correct {
            border-color: var(--success);
            background: var(--success-bg);
        }

        .option-item.wrong {
            border-color: var(--danger);
            background: var(--danger-bg);
        }

        .option-letter {
            font-weight: 700;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--border-color);
            border-radius: 50%;
            margin-right: 1rem;
            font-size: 0.9rem;
            color: var(--text-gray);
            flex-shrink: 0;
        }

        .option-item.selected .option-letter {
            background: var(--primary);
            color: #fff;
        }

        /* Solution Box */
        .solution-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .solution-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bottom Controls */
        .controls {
            margin-top: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.97); }

        .btn-outline {
            background: transparent;
            color: var(--text-gray);
            border: 2px solid var(--border-color);
        }
        
        .btn-outline:hover {
            background: #f9fafb;
            color: var(--text-dark);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Results Screen */
        .results-view {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--success-bg);
            color: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 0 auto 2rem auto;
            border: 8px solid #a7f3d0;
        }
    </style>
</head>
<body>

    <div class="progress-wrapper">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="assessment-card" id="quiz-card">
        <div class="header-row">
            <div class="question-number" id="q-number">Question 1</div>
            <div class="question-meta" id="q-meta">Assessment</div>
        </div>

        <div class="question-content" id="q-text"></div>

        <div class="options-list" id="options-container"></div>

        <div class="solution-box" id="solution-container">
            <div class="solution-title">Detailed Solution</div>
            <div id="solution-text"></div>
        </div>

        <div class="controls">
            <button class="btn btn-outline" id="btn-prev" onclick="navigate(-1)">Previous</button>
            <button class="btn btn-primary" id="btn-next" onclick="navigate(1)">Next</button>
        </div>
    </div>

    <div class="assessment-card results-view" id="results-card">
        <h2>Assessment Complete!</h2>
        <p style="color: var(--text-gray); margin-bottom: 2rem;">Here is your final score.</p>
        <div class="score-circle" id="final-score">0/0</div>
        <button class="btn btn-primary" onclick="reviewMode()">Review Solutions</button>
    </div>

    <script>
        // Paste your generated questions here
        const quizData = [
    {
        id: 1,
        meta: "SSC CGL 26/09/2025 (Shift 3)",
        question: "The incenter of a triangle is located at (4, 3). The length of the altitude from the incenter to side AB is 3 units. What is the radius of the triangle's incircle?",
        options: ["1 units", "2 units", "3 units", "4 units"],
        correctIndex: 2,
        solution: "The radius of the incircle of a triangle is the perpendicular distance from the incenter to any side of the triangle.<br><br>Here, that distance = 3 units."
    },
    {
        id: 2,
        meta: "SSC CGL 21/09/2025 (Shift 3)",
        question: "Find the x-intercept of 5x + 2y = 20",
        options: ["2", "4", "5", "7"],
        correctIndex: 1,
        solution: "Given: 5x + 2y = 20<br><br>To find the X-intercept, set y = 0:<br>5x + 2(0) = 20<br>5x = 20<br>x = 20/5 = 4"
    },
    {
        id: 3,
        meta: "SSC CGL 21/09/2025 (Shift 1)",
        question: "In a triangle with vertices A(x,y), B(6,2), and C(3,7), the centroid is at G(4, 4). Find the coordinates of vertex A.",
        options: ["(3, 3)", "(4, 2)", "(3, 4)", "(2, 3)"],
        correctIndex: 0,
        solution: "The centroid G is calculated as: ((x1+x2+x3)/3, (y1+y2+y3)/3)<br><br>For the x-coordinate of A:<br>4 = (x + 6 + 3) / 3<br>12 = x + 9<br>x = 3<br><br>For the y-coordinate of A:<br>4 = (y + 2 + 7) / 3<br>12 = y + 9<br>y = 3<br><br>Coordinates of vertex A are (3, 3)."
    },
    {
        id: 4,
        meta: "SSC CGL 18/09/2025 (Shift 1)",
        question: "Find the midpoint of the segment joining (1,2) and (5,8).",
        options: ["(3, 4)", "(5,6)", "(3,5)", "(6, 7)"],
        correctIndex: 2,
        solution: "Midpoint = ((x1+x2)/2, (y1+y2)/2)<br><br>Midpoint = ((1+5)/2, (2+8)/2) = (6/2, 10/2) = (3, 5)"
    },
    {
        id: 5,
        meta: "SSC CGL 17/09/2025 (Shift 3)",
        question: "What is the slope of the line passing through points (3, 4) and (5, 8)?",
        options: ["2", "3", "5", "4"],
        correctIndex: 0,
        solution: "Slope (m) = (y2 - y1) / (x2 - x1)<br>m = (8 - 4) / (5 - 3) = 4 / 2 = 2"
    },
    {
        id: 6,
        meta: "SSC CGL 15/09/2025 (Shift 3)",
        question: "What is the slope of the line perpendicular to y = -5x + 2?",
        options: ["1/5", "5", "-1/5", "-5"],
        correctIndex: 0,
        solution: "The given line has a slope (m1) of -5.<br>The slope of a perpendicular line (m2) is the negative reciprocal: m2 = -1 / m1.<br>Therefore, m2 = -1 / -5 = 1/5."
    },
    {
        id: 7,
        meta: "SSC CGL 12/09/2025 (Shift 1)",
        question: "The line y = mx + 7 passes through the point (2, 9). Find the value of m.",
        options: ["4", "3", "1", "2"],
        correctIndex: 2,
        solution: "Substitute the point (2, 9) into the equation y = mx + 7:<br>9 = m(2) + 7<br>9 - 7 = 2m<br>2 = 2m<br>m = 1"
    },
    {
        id: 8,
        meta: "Graduate Level 28/07/2025 (Shift - 3)",
        question: "In triangle ABC, if the orthocenter (H) is (9, -3) and the circumcenter (O) is (0, 6), find the centroid (G).",
        options: ["(1,2)", "(2,1)", "(4,4)", "(3,3)"],
        correctIndex: 3,
        solution: "The Centroid (G) divides the line joining the Orthocenter (H) and Circumcenter (O) in the ratio 2:1.<br><br>Using the section formula:<br>G = ((2*0 + 1*9)/3, (2*6 + 1*(-3))/3)<br>G = (9/3, 9/3) = (3, 3)"
    },
    {
        id: 9,
        meta: "Graduate Level 25/07/2025 (Shift - 3)",
        question: "In triangle PQR, vertices P and Q are (2,0) and (3,5). Vertex R lies on the line y = x. If the centroid is (3,3), find the coordinates of R.",
        options: ["(6, 6)", "(4, 4)", "(3, 3)", "(8,8)"],
        correctIndex: 1,
        solution: "Let R be (t, t) since it lies on y = x.<br>Centroid x-coord: 3 = (2 + 3 + t) / 3 => 9 = 5 + t => t = 4.<br>Centroid y-coord: 3 = (0 + 5 + t) / 3 => 9 = 5 + t => t = 4.<br>So, R is (4, 4)."
    },
    {
        id: 10,
        meta: "",
        question: "The shortest length of the intercept between the x-axis and y-axis of the equation 6x + 8y - 48 = 0 is:",
        options: ["14 units", "6 units", "10 units", "12 units"],
        correctIndex: 2,
        solution: "For x-intercept (y=0): 6x = 48 => x = 8.<br>For y-intercept (x=0): 8y = 48 => y = 6.<br>The intercept length is the hypotenuse of a triangle with sides 8 and 6.<br>Length = sqrt(8² + 6²) = sqrt(64 + 36) = sqrt(100) = 10 units."
    },
    {
        id: 11,
        meta: "",
        question: "What is the area (in unit squares) of the triangle enclosed by 2x + 5y = 12, x + y = 3 and the x-axis?",
        options: ["2.5", "3.5", "3", "4"],
        correctIndex: 2,
        solution: "Intersection of the two lines: (1, 2).<br>Intersection of 2x + 5y = 12 with x-axis (y=0): (6, 0).<br>Intersection of x + y = 3 with x-axis (y=0): (3, 0).<br>Area = 0.5 * |[x1(y2-y3) + x2(y3-y1) + x3(y1-y2)]|<br>Area = 0.5 * |[1(0-0) + 6(0-2) + 3(2-0)]| = 0.5 * |-12 + 6| = 3 unit²"
    },
    {
        id: 12,
        meta: "",
        question: "The equation of a circle with centre (1, -2) and radius 4 cm is:",
        options: [
            "x² + y² + 2x - 4y = 16", 
            "x² + y² - 2x + 4y = 16", 
            "x² + y² + 2x - 4y = 11", 
            "x² + y² - 2x + 4y = 11"
        ],
        correctIndex: 3,
        solution: "Standard form: (x - h)² + (y - k)² = r²<br>(x - 1)² + (y + 2)² = 4²<br>x² - 2x + 1 + y² + 4y + 4 = 16<br>x² + y² - 2x + 4y + 5 = 16<br>x² + y² - 2x + 4y = 11"
    },
    {
        id: 13,
        meta: "",
        question: "What is the area (in square units) of the triangular region enclosed by x + y = 3, 2x + 5y = 12 and the x axis?",
        options: ["2", "3", "4", "6"],
        correctIndex: 1,
        solution: "Vertices of triangle: (3,0), (6,0), and intersection (1,2).<br>Base on x-axis = 6 - 3 = 3 units.<br>Height = y-coordinate of intersection = 2 units.<br>Area = 0.5 * base * height = 0.5 * 3 * 2 = 3 square units."
    }
        ];

        let currentIndex = 0;
        let userAnswers = [];
        let isSubmitted = false;

        const ui = {
            card: document.getElementById('quiz-card'),
            resultsCard: document.getElementById('results-card'),
            qNumber: document.getElementById('q-number'),
            qMeta: document.getElementById('q-meta'),
            qText: document.getElementById('q-text'),
            optionsContainer: document.getElementById('options-container'),
            solutionBox: document.getElementById('solution-container'),
            solutionText: document.getElementById('solution-text'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            progressBar: document.getElementById('progress-bar')
        };

        function init() {
            if (quizData.length === 0) {
                ui.qText.innerHTML = "<em>No questions loaded yet. Please add data to the quizData array.</em>";
                ui.btnNext.disabled = true;
                return;
            }
            userAnswers = new Array(quizData.length).fill(null);
            loadQuestion(0);
        }

        function updateProgress() {
            if (quizData.length === 0) return;
            const answered = userAnswers.filter(a => a !== null).length;
            const percentage = (answered / quizData.length) * 100;
            ui.progressBar.style.width = `${percentage}%`;
        }

        function loadQuestion(index) {
            if (quizData.length === 0) return;
            
            currentIndex = index;
            const q = quizData[index];

            ui.qNumber.textContent = `Question ${index + 1} of ${quizData.length}`;
            ui.qMeta.textContent = q.meta || "Practice Question";
            ui.qMeta.style.display = q.meta ? 'block' : 'none';
            ui.qText.innerHTML = q.question;

            // Render Options
            ui.optionsContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D', 'E'];
            
            q.options.forEach((optText, i) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-item';
                
                if (isSubmitted) {
                    if (i === q.correctIndex) optDiv.classList.add('correct');
                    else if (i === userAnswers[index]) optDiv.classList.add('wrong');
                    optDiv.style.cursor = 'default';
                } else {
                    if (userAnswers[index] === i) optDiv.classList.add('selected');
                    optDiv.onclick = () => selectOption(i);
                }

                optDiv.innerHTML = `
                    <div class="option-letter">${labels[i]}</div>
                    <div class="option-text">${optText}</div>
                `;
                ui.optionsContainer.appendChild(optDiv);
            });

            // Handle Solution Visibility
            if (isSubmitted) {
                ui.solutionBox.style.display = 'block';
                ui.solutionText.innerHTML = q.solution;
            } else {
                ui.solutionBox.style.display = 'none';
            }

            // Update Navigation Buttons
            ui.btnPrev.disabled = currentIndex === 0;
            ui.btnPrev.style.opacity = currentIndex === 0 ? '0.5' : '1';
            
            if (currentIndex === quizData.length - 1) {
                ui.btnNext.textContent = isSubmitted ? "Finish Review" : "Submit Assessment";
                ui.btnNext.classList.replace('btn-primary', 'btn-primary');
            } else {
                ui.btnNext.textContent = "Next";
            }
        }

        function selectOption(optIndex) {
            userAnswers[currentIndex] = optIndex;
            updateProgress();
            
            // Re-render to show selection
            loadQuestion(currentIndex);
            
            // Automatically go to next after short delay if not last question
            if (currentIndex < quizData.length - 1) {
                setTimeout(() => navigate(1), 400);
            }
        }

        function navigate(direction) {
            if (direction === 1 && currentIndex === quizData.length - 1) {
                if (isSubmitted) {
                    ui.card.style.display = 'none';
                    ui.resultsCard.style.display = 'block';
                } else {
                    submitAssessment();
                }
                return;
            }

            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < quizData.length) {
                loadQuestion(newIndex);
            }
        }

        function submitAssessment() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            if (answeredCount < quizData.length) {
                if(!confirm(`You have only answered ${answeredCount} out of ${quizData.length} questions. Submit anyway?`)) {
                    return;
                }
            }

            isSubmitted = true;
            let score = 0;
            userAnswers.forEach((ans, i) => {
                if (ans === quizData[i].correctIndex) score++;
            });

            ui.card.style.display = 'none';
            ui.resultsCard.style.display = 'block';
            document.getElementById('final-score').textContent = `${score}/${quizData.length}`;
            ui.progressBar.style.width = '100%';
            ui.progressBar.style.backgroundColor = 'var(--success)';
        }

        function reviewMode() {
            ui.resultsCard.style.display = 'none';
            ui.card.style.display = 'block';
            loadQuestion(0);
        }

        window.onload = init;
    </script>
</body>
</html>
