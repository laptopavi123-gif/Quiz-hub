<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Day 2 Homonyms Quiz (Balanced & Visual)</title>
  <style>
    /* Floating Back Button Style */
    .app-back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 30px;
        font-family: sans-serif;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        z-index: 1000; /* Ensures it stays on top */
        transition: transform 0.2s;
        text-decoration: none; /* In case you use <a> tag */
    }
    
    .app-back-btn:hover {
        transform: scale(1.05);
        background-color: #0056b3;
    }
</style>
  <style>
    :root{
      --primary:#007bff;
      --bg:#f4f4f9;
      --card:#ffffff;
      --text:#333;
      
      /* COLORS */
      --correct-bg: #28a745; 
      --correct-text: #ffffff; 
      --wrong-bg: #dc3545; 
      --wrong-text: #ffffff; 
      --timer-color: #ffc107;
    }
    body{
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      display:flex;justify-content:center;align-items:center;
      min-height:100vh;margin:0;padding:20px;
    }
    
    .quiz-container{
      background: var(--card);
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width:100%;max-width:900px;
      position: relative;
      overflow: hidden;
    }
    
    /* HEADER */
    .header{
      display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;
    }
    .score-board{font-weight:bold;color:var(--primary); font-size: 1.1em;}
    h2{color:var(--text);margin:10px 0 4px;}
    .question{font-size:1.2em;color:#222;margin:0 0 20px; line-height: 1.5;}
    
    /* CONTROLS */
    .controls{
      display:flex;gap:15px;align-items:center;flex-wrap:wrap;
      background:#f0f2f5; padding:10px 15px; border-radius:10px; margin-bottom: 15px;
    }
    .control-group{display:flex;align-items:center;gap:6px;}
    select { padding:6px 10px;border:1px solid #ccc;border-radius:6px;background:#fff; font-size:14px; }

    /* OPTIONS */
    .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media (max-width:560px){ .options{grid-template-columns:1fr;} }
    
    button.option{
      padding:15px 12px;font-size:16px;cursor:pointer;
      border:2px solid #ddd;border-radius:8px;background:#fff;transition:0.2s; text-align:left;
      font-weight: 500; color: #444;
    }
    button.option:hover{background-color:#eef; border-color:#bbb;}
    button.option:disabled{cursor: not-allowed; opacity: 1;}
    
    .correct { background-color: var(--correct-bg) !important; border-color: #1e7e34 !important; color: white !important; }
    .wrong { background-color: var(--wrong-bg) !important; border-color: #bd2130 !important; color: white !important; }

    /* --- VISUAL FEEDBACK CARDS --- */
    .feedback{
      margin-top:25px; display:none; animation: fadeIn 0.4s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .feedback h4 {
      text-align: center; margin: 0 0 15px; color: #666; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9em;
    }

    .comparison-container {
      display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;
      background: #fff; border: 2px solid #eef0f3; border-radius: 12px; padding: 20px;
    }

    .comparison-card {
      flex: 1; min-width: 160px; max-width: 240px;
      background: #fdfdfd; border: 1px solid #e0e0e0; border-radius: 10px;
      padding: 10px; text-align: center;
      display: flex; flex-direction: column;
    }

    /* Highlight the correct card */
    .is-correct-card { border: 2px solid #28a745; background: #f0fff4; transform: scale(1.02); box-shadow: 0 4px 12px rgba(40, 167, 69, 0.15); }
    .is-correct-card .word-title { background: #d4edda; color: #155724; }

    .word-title {
      display: block; font-size: 1.1em; font-weight: 800; text-transform: uppercase;
      color: #333; margin-bottom: 8px; letter-spacing: 0.5px;
      background: #f0f2f5; padding: 6px; border-radius: 6px;
    }

    /* UPDATED: Image Container Styles for Clickability */
    .img-container {
      width: 100%; height: 140px; background: #eee; border-radius: 8px; margin-bottom: 10px;
      overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
      cursor: pointer; /* Pointer to indicate click */
      transition: transform 0.2s;
    }
    .img-container:hover {
      transform: scale(1.02);
      border: 2px solid var(--primary);
    }
    .img-container:active {
      transform: scale(0.98);
    }
    
    .comparison-img {
      width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s;
    }
    .comparison-img.loaded { opacity: 1; }

    /* Spinner */
    .loader {
      border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%;
      width: 20px; height: 20px; animation: spin 1s linear infinite; position: absolute;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .word-def { font-size: 0.9em; color: #555; line-height: 1.4; flex-grow: 1; }
    
    /* FOOTER / NEXT BTN */
    .next-btn {
      margin-top:20px; background-color:var(--primary); color:white; border:none;
      padding:12px 24px; border-radius:30px; cursor:pointer; display:none; 
      font-size:16px; font-weight:bold; width: 100%;
    }
    .next-btn:hover{background-color:#0056b3;}
    
    /* TIMER */
    .timer-container { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin: 10px 0 20px; overflow: hidden; display: none; }
    .timer-bar { height: 100%; background-color: var(--timer-color); width: 100%; transition: width 1s linear; }

    /* NOTIFICATION */
    .top-notification {
      position: fixed; top: -80px; left: 0; width: 100%; padding: 16px; text-align: center;
      font-size: 1.1rem; font-weight: bold; color: white; z-index: 9999; transition: top 0.3s;
      background-color: #dc3545; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .top-notification.show { top: 0; }

    /* RESULTS */
    #review-area { text-align: center; }
    .stat-box { display: inline-block; padding: 10px 20px; margin: 5px; border-radius: 8px; font-weight: bold; background: #eee;}
    .stat-correct { background: #d4edda; color: #155724; }
    .stat-wrong { background: #f8d7da; color: #721c24; }
  </style>
</head>

    //  APP STATE
    // ==========================================
    let activeQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval = null;
    let timeLimit = 0;
    let userResults = [];

    // Init
    startQuiz(); 

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // -----------------------------------------------------
    // TEXT TO SPEECH HELPER
    // -----------------------------------------------------
    function speakWord(word) {
      // Prevent bubbling if user clicks child elements
      if(window.event) window.event.stopPropagation();
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US'; 
        utterance.rate = 0.9; 
        window.speechSynthesis.speak(utterance);
      } else {
        alert("Audio playback is not supported in this browser.");
      }
    }

    function startQuiz() {
      // 1. Get Settings
      const level = document.getElementById('level').value;
      const timerVal = document.getElementById('timer').value;
      const lvlNum = parseInt(level);
      timeLimit = parseInt(timerVal);

      // 2. Filter & Setup Data
      let rawData = Q.filter(q => q.l === lvlNum);
      
      activeQuestions = JSON.parse(JSON.stringify(rawData));
      // Randomize options for each question but keep track of correct answer
      activeQuestions.forEach(q => {
        const correctText = q.o[q.c];
        shuffleArray(q.o);
        q.c = q.o.indexOf(correctText);
      });
      // Randomize question order
      shuffleArray(activeQuestions);

      // 3. Reset State
      currentQuestionIndex = 0;
      score = 0;
      userResults = [];
      document.getElementById('score').innerText = score;
      
      // 4. Reset UI
      document.getElementById('game-area').style.display = 'block';
      document.getElementById('review-area').style.display = 'none';
      document.getElementById('timer-container').style.display = (timeLimit > 0) ? 'block' : 'none';
      document.getElementById('timer-bar').style.width = '100%';
      document.getElementById('top-notification').classList.remove('show');

      loadQuestion();
    }

    function loadQuestion() {
      if(timerInterval) clearInterval(timerInterval);

      const q = activeQuestions[currentQuestionIndex];
      document.getElementById('total').innerText = activeQuestions.length;
      document.getElementById('current').innerText = currentQuestionIndex + 1;
      document.getElementById('question-number').innerText = `Question ${currentQuestionIndex + 1}`;
      document.getElementById('question-text').innerText = q.t;

      const optionsDiv = document.getElementById('options-container');
      optionsDiv.innerHTML = '';
      
      // Hide feedback from previous
      document.getElementById('feedback-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      q.o.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optionsDiv.appendChild(btn);
      });

      if(timeLimit > 0) runTimer(timeLimit);
    }

    function runTimer(seconds) {
      let timeLeft = seconds;
      const bar = document.getElementById('timer-bar');
      bar.style.width = '100%';
      bar.style.backgroundColor = 'var(--timer-color)';

      timerInterval = setInterval(() => {
        timeLeft--;
        const percentage = (timeLeft / seconds) * 100;
        bar.style.width = percentage + '%';

        if(percentage < 30) bar.style.backgroundColor = '#dc3545';

        if(timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function showTopBanner(text) {
      const banner = document.getElementById('top-notification');
      banner.innerText = text;
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 2500);
    }

    function handleTimeOut() {
      const q = activeQuestions[currentQuestionIndex];
      showTopBanner(`Time's Up! Answer: ${q.o[q.c]}`);

      userResults.push({ qIndex: currentQuestionIndex, status: 'skipped', userAnswer: null });
      disableOptions(q.c);
      showFeedback(q, true);
    }

    function checkAnswer(selectedIndex, btnElement) {
      if(timerInterval) clearInterval(timerInterval);

      const q = activeQuestions[currentQuestionIndex];
      const isCorrect = (selectedIndex === q.c);
      
      userResults.push({
        qIndex: currentQuestionIndex,
        status: isCorrect ? 'correct' : 'wrong',
        userAnswer: q.o[selectedIndex]
      });

      if (isCorrect) {
        score++;
        document.getElementById('score').innerText = score;
        nextQuestion(); // Auto-advance on correct
      } else {
        btnElement.classList.add('wrong');
        showTopBanner(`Wrong! Answer: ${q.o[q.c]}`);
        disableOptions(q.c);
        showFeedback(q, true); // Show visuals for wrong answer
      }
    }

    function disableOptions(correctIndex) {
      const btns = document.querySelectorAll('.option');
      btns.forEach((b, idx) => {
        b.disabled = true;
        if(idx === correctIndex) b.classList.add('correct');
      });
    }

    function showFeedback(questionData, showVisuals) {
      if(!showVisuals) return;

      const feedbackBox = document.getElementById('feedback-box');
      feedbackBox.innerHTML = `<h4>Visual Comparison</h4><div class="comparison-container" id="cards-container"></div>`;
      const container = document.getElementById('cards-container');
      
      const correctWord = questionData.o[questionData.c];

      questionData.v.forEach(v => {
        // AI Image Generation Logic
        const seed = Math.floor(Math.random() * 9000) + 1000;
        const prompt = encodeURIComponent(`${v.img} cartoon vector flat illustration minimalist`);
        const imgSrc = `https://image.pollinations.ai/prompt/${prompt}?width=240&height=140&nologo=true&seed=${seed}`;

        const isCorrectCard = (v.w === correctWord) ? 'is-correct-card' : '';

        const card = document.createElement('div');
        card.className = `comparison-card ${isCorrectCard}`;
        
        // ADDED: onclick for audio, removed visual cues (clean version)
        card.innerHTML = `
          <div class="word-title">${v.w}</div>
          <div class="img-container" onclick="speakWord('${v.w}')">
            <div class="loader"></div>
            <img class="comparison-img" src="${imgSrc}" alt="${v.w}" 
                 onload="this.classList.add('loaded'); this.parentElement.querySelector('.loader').style.display='none';">
          </div>
          <div class="word-def">${v.d}</div>
        `;
        container.appendChild(card);
      });
      
      feedbackBox.style.display = 'block';
      document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < activeQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('timer-container').style.display = 'none';
      document.getElementById('top-notification').classList.remove('show');
      document.getElementById('review-area').style.display = 'block';

      const skipped = userResults.filter(r => r.status === 'skipped').length;
      const wrong = userResults.filter(r => r.status === 'wrong').length;
      const correct = userResults.filter(r => r.status === 'correct').length;

      const summaryHTML = `
        <div class="stat-box stat-correct">Correct: ${correct}</div>
        <div class="stat-box stat-wrong">Wrong: ${wrong}</div>
        <div class="stat-box" style="background:#e2e3e5;">Timeouts: ${skipped}</div>
        <h3>Total Score: ${score} / ${activeQuestions.length}</h3>
      `;
      document.getElementById('result-summary').innerHTML = summaryHTML;
    }
  </script>
</body>
</html>
