<html lang="en">

<style>
    :root {
        --primary-color: #4a90e2;
        --secondary-color: #2c3e50;
        --accent-color: #f39c12;
        --success-color: #27ae60;
        --error-color: #e74c3c;
        --bg-color: #eef2f3;
        --card-bg: #ffffff;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        color: #333;
    }

    .quiz-wrapper {
        width: 100%;
        max-width: 700px;
        background-color: var(--card-bg);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        overflow: hidden;
        position: relative;
    }

    /* Header Section */
    .quiz-header {
        background: linear-gradient(135deg, var(--secondary-color), #34495e);
        color: white;
        padding: 25px;
        text-align: center;
        position: relative;
    }

    .quiz-header h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    .quiz-header p {
        margin: 5px 0 0;
        font-size: 14px;
        opacity: 0.8;
    }

    /* Progress Bar */
    .progress-container {
        width: 100%;
        height: 6px;
        background-color: rgba(255,255,255,0.2);
        margin-top: 15px;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        background-color: var(--accent-color);
        width: 0%;
        transition: width 0.4s ease;
    }

    /* Content Area */
    .quiz-content {
        padding: 30px;
    }

    .stats-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 600;
        color: #7f8c8d;
    }

    .question-card {
        text-align: center;
        margin-bottom: 30px;
        animation: fadeIn 0.5s ease;
    }

    .idiom-text {
        font-size: 28px;
        font-weight: 800;
        color: var(--secondary-color);
        margin-bottom: 10px;
        line-height: 1.3;
    }

    .instruction {
        color: #95a5a6;
        font-style: italic;
        font-size: 15px;
    }

    /* Options Grid */
    .options-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .option-btn {
        background-color: #f8f9fa;
        border: 2px solid #e9ecef;
        padding: 15px 20px;
        border-radius: 12px;
        color: #444;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: left;
        position: relative;
        font-weight: 500;
    }

    .option-btn:hover:not(:disabled) {
        border-color: var(--primary-color);
        background-color: #f0f8ff;
        transform: translateY(-2px);
    }

    /* State Classes */
    .option-btn.correct {
        background-color: #d4edda;
        border-color: var(--success-color);
        color: #155724;
    }

    .option-btn.wrong {
        background-color: #f8d7da;
        border-color: var(--error-color);
        color: #721c24;
        opacity: 0.7;
    }

    .option-btn:disabled {
        cursor: default;
        transform: none;
    }

    /* Feedback Section */
    .feedback-box {
        margin-top: 25px;
        padding: 20px;
        border-radius: 10px;
        background-color: #fff3cd;
        border-left: 5px solid var(--accent-color);
        display: none; /* Hidden by default */
        text-align: left;
        animation: slideUp 0.3s ease;
    }

    .feedback-title {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        color: #856404;
    }

    .feedback-text {
        color: #333;
        font-size: 16px;
    }

    /* Controls */
    .controls {
        margin-top: 30px;
        text-align: right;
        min-height: 50px;
    }

    .btn-next {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s;
        display: none; /* Hidden initially */
        box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
    }

    .btn-next:hover {
        background-color: #357abd;
    }

    /* Results Screen */
    .results-screen {
        text-align: center;
        padding: 40px;
        display: none;
    }

    .score-circle {
        width: 120px;
        height: 120px;
        background-color: var(--primary-color);
        color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 36px;
        font-weight: bold;
        margin: 0 auto 20px;
        box-shadow: 0 10px 20px rgba(74, 144, 226, 0.3);
    }

    .btn-restart {
        background-color: var(--secondary-color);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 20px;
    }

    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
        .idiom-text { font-size: 22px; }
        .quiz-content { padding: 20px; }
    }
</style>
</head>

    let quizQueue = [];

    // Initialize Quiz
    function initQuiz() {
        // Shuffle the entire dataset
        quizQueue = [...idiomsData].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;
        
        document.getElementById('quizScreen').style.display = 'block';
        document.getElementById('resultScreen').style.display = 'none';
        updateStats();
        loadQuestion();
    }

    // Load a single question
    function loadQuestion() {
        if (currentIndex >= quizQueue.length) {
            showResults();
            return;
        }

        currentQuestionData = quizQueue[currentIndex];
        
        // Update UI Text
        document.getElementById('idiomText').innerText = currentQuestionData.i;
        
        // Reset state
        document.getElementById('feedbackBox').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
        
        // Generate Options (1 correct + 3 wrong)
        const correctMeaning = currentQuestionData.m;
        
        // Get 3 random wrong meanings
        const otherIdioms = idiomsData.filter(item => item.i !== currentQuestionData.i);
        const shuffledOthers = otherIdioms.sort(() => Math.random() - 0.5);
        const wrongMeanings = shuffledOthers.slice(0, 3).map(item => item.m);
        
        const allOptions = [correctMeaning, ...wrongMeanings];
        // Shuffle options
        allOptions.sort(() => Math.random() - 0.5);

        // Render Buttons
        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        
        allOptions.forEach(optText => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.onclick = () => handleAnswer(btn, optText === correctMeaning);
            grid.appendChild(btn);
        });

        updateProgress();
    }

    // Handle User Click
    function handleAnswer(selectedBtn, isCorrect) {
        // Disable all buttons
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        const feedbackBox = document.getElementById('feedbackBox');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const feedbackContent = document.getElementById('feedbackContent');

        if (isCorrect) {
            score++;
            selectedBtn.classList.add('correct');
            feedbackBox.style.display = 'block';
            feedbackBox.style.backgroundColor = '#d4edda';
            feedbackBox.style.borderLeftColor = '#28a745';
            feedbackTitle.style.color = '#155724';
            feedbackTitle.innerText = "Correct!";
            feedbackContent.innerText = "Great job! That is the correct meaning.";
        } else {
            selectedBtn.classList.add('wrong');
            // Highlight the correct one
            buttons.forEach(btn => {
                if (btn.innerText === currentQuestionData.m) {
                    btn.classList.add('correct');
                }
            });
            
            // Show Feedback (Correct Meaning)
            feedbackBox.style.display = 'block';
            feedbackBox.style.backgroundColor = '#fff3cd';
            feedbackBox.style.borderLeftColor = '#ffc107';
            feedbackTitle.style.color = '#856404';
            feedbackTitle.innerText = "Incorrect.";
            feedbackContent.innerHTML = `The correct meaning is:<br><strong>${currentQuestionData.m}</strong>`;
        }

        updateStats();
        document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function updateStats() {
        document.getElementById('questionCounter').innerText = `Question ${currentIndex + 1} / ${quizQueue.length}`;
        document.getElementById('scoreCounter').innerText = `Score: ${score}`;
    }

    function updateProgress() {
        const percentage = ((currentIndex) / quizQueue.length) * 100;
        document.getElementById('progressBar').style.width = percentage + '%';
    }

    function showResults() {
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        
        const finalPercent = Math.round((score / quizQueue.length) * 100);
        document.getElementById('finalScoreText').innerText = score;
        document.getElementById('totalQuestionsText').innerText = quizQueue.length;
        document.getElementById('finalScoreCircle').innerText = finalPercent + '%';

        const msg = document.getElementById('resultMessage');
        if (finalPercent >= 90) msg.innerText = "Outstanding! You're an idiom expert.";
        else if (finalPercent >= 70) msg.innerText = "Great job! Keep practicing.";
        else msg.innerText = "Good effort. Review the meanings and try again!";
    }

    function restartQuiz() {
        initQuiz();
    }

    // Start on load
    window.onload = initQuiz;

</script>

</body>
</html>
