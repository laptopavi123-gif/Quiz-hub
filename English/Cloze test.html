<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-bg: #d1fae5;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg: #f8fafc;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { color: var(--primary); margin-bottom: 5px; }
        .subtitle { color: var(--text-light); font-size: 1.1em; }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.2s ease;
            font-size: 0.9em;
        }

        .tab-btn:hover { background-color: var(--primary-light); color: var(--primary); }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        /* Layout */
        .quiz-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 900px) {
            .quiz-layout {
                grid-template-columns: 45% 55%;
                align-items: start;
            }
            .passage-card {
                position: sticky;
                top: 20px;
                max-height: 90vh;
                overflow-y: auto;
            }
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #f1f5f9;
        }

        /* Passage Text Styling */
        .passage-text {
            font-size: 1.15em;
            color: #334155;
            line-height: 1.9;
            white-space: pre-line;
        }

        .blank-marker {
            display: inline-block;
            min-width: 24px;
            text-align: center;
            font-weight: 700;
            color: var(--primary);
            background-color: var(--primary-light);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #c7d2fe;
            margin: 0 3px;
            font-size: 0.9em;
        }

        /* Question Item */
        .question-item {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        
        .q-header {
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            color: #1e293b;
            font-size: 1.05em;
        }

        .q-badge {
            background: #1e293b;
            color: white;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            height: fit-content;
            margin-top: 2px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .option-btn {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-size: 0.95em;
            color: #475569;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary);
        }

        /* Answer States */
        .option-btn.correct {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--error);
            border-color: var(--error);
            color: white;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8fafc;
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            font-size: 0.95em;
            color: #334155;
            display: none; /* Hidden by default */
            animation: fadeIn 0.4s ease;
        }

        .explanation-box strong { color: var(--primary); display: block; margin-bottom: 5px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar for passage */
        .passage-card::-webkit-scrollbar { width: 8px; }
        .passage-card::-webkit-scrollbar-track { background: #f1f1f1; }
        .passage-card::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .passage-card::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    </style>
</head>

    function renderTabs() {

            tabContainer.appendChild(btn);
        });
    }

    function loadPassage(index) {
        currentPassageIndex = index;
        const data = quizData[index];

        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            if(idx === index) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        document.getElementById('passageContainer').innerHTML = data.passage;

        const qContainer = document.getElementById('questionsContainer');
        qContainer.innerHTML = '';

        data.questions.forEach(q => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question-item';
            
            let optionsHtml = '';
            q.options.forEach((opt) => {
                optionsHtml += `
                    <button class="option-btn" onclick="checkAnswer(${q.numb}, '${opt.replace(/'/g, "\\'")}', this)">
                        ${opt}
                    </button>
                `;
            });

            qDiv.innerHTML = `
                <div class="q-header">
                    <span class="q-badge">#${q.numb}</span>
                    <span>${q.question}</span>
                </div>
                <div class="options-grid" id="opts-${q.numb}" data-answered="false">
                    ${optionsHtml}
                </div>
                <div class="explanation-box" id="expl-${q.numb}">
                    <strong>💡 Explanation</strong>
                    ${q.explanation}
                </div>
            `;
            qContainer.appendChild(qDiv);
        });
    }

    function checkAnswer(questionNumber, selectedOption, btnElement) {
        const currentData = quizData[currentPassageIndex];
        const question = currentData.questions.find(q => q.numb === questionNumber);
        
        const parentGrid = document.getElementById(`opts-${questionNumber}`);
        const explanationBox = document.getElementById(`expl-${questionNumber}`);
        const allBtns = parentGrid.querySelectorAll('.option-btn');
        
        if (parentGrid.dataset.answered === "true") return;
        parentGrid.dataset.answered = "true";

        const isCorrect = (selectedOption === question.answer);
        
        if (isCorrect) {
            btnElement.classList.add('correct');
        } else {
            btnElement.classList.add('wrong');
            allBtns.forEach(btn => {
                if(btn.innerText.trim() === question.answer) {
                    btn.classList.add('correct');
                }
            });
        }

        allBtns.forEach(btn => btn.disabled = true);
        
        // Show explanation
        explanationBox.style.display = 'block';
    }

    init();

</script>
</body>
</html>
