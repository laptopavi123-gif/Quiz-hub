      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

      background-image:

        radial-gradient(at 50% 50%, #ffffff 0px, transparent 50%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(67, 56, 202, 0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #f1f5f9;
      position: absolute;
      top: 0;
      left: 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-content {
      padding: 40px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .badge-group {
      display: flex;
      gap: 12px;
    }

    .timer-badge, .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .score-badge.pop {
      transform: scale(1.15);
      background: var(--primary);
      color: #ffffff;
    }

    .icon-svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.5;
    }

    /* Ultra-Smooth Transitions */
    .quiz-wrapper {
      position: relative;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-wrapper.slide-out {
      opacity: 0;
      transform: translateX(-20px);
    }

    .quiz-wrapper.slide-in {
      opacity: 0;
      transform: translateX(20px);
    }

    .question-container {
      position: relative;
      margin-bottom: 36px;
    }

    .question-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 580px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      .card-content {
        padding: 32px 24px;
      }
      .question-title {
        font-size: 1.3rem;
      }
    }

    .option-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s, background-color 0.2s;
      user-select: none;
    }

    .option-card:active:not(.disabled) {
      transform: scale(0.97);
    }

    .option-card:hover:not(.disabled) {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .option-prefix {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .option-label {
      font-size: 1rem;
      font-weight: 600;
      color: #334155;
    }

    .option-card.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      transform: scale(1.02);
    }

    .option-card.correct .option-prefix {
      background: var(--correct);
      color: #ffffff;
    }

    .option-card.correct .option-label {
      color: #064e3b;
    }

    .option-card.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
    }

    .option-card.wrong .option-prefix {
      background: var(--wrong);
      color: #ffffff;
    }

    .option-card.wrong .option-label {
      color: #7f1d1d;
    }

    .option-card.disabled {
      cursor: default;
      pointer-events: none;
    }

    .score-view {
      text-align: center;
      padding: 40px 10px;
    }

    .score-val {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);

    }

    .score-label {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 32px;

      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -8px rgba(67, 56, 202, 0.4);
      transition: transform 0.2s, opacity 0.2s;
    }

      transform: scale(0.95);
    }

    function shuffleOptions(array) {
      let shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let currentCorrectAnswer = "";

    const quizWrapper = document.getElementById("quizWrapper");
    const questionTitle = document.getElementById("questionTitle");
    const optionsGrid = document.getElementById("optionsGrid");
    const progressBar = document.getElementById("progressBar");
    const scoreText = document.getElementById("scoreText");
    const scoreBadge = document.getElementById("scoreBadge");
    const timerText = document.getElementById("timerText");
    const prefixes = ["A", "B", "C", "D"];

    function loadQuestion() {
      answered = false;
      const qData = rawData[currentIndex];
      const questionText = qData[0];
      currentCorrectAnswer = qData[1];
      
      const distractors = [qData[2], qData[3], qData[4]];
      const allOptions = shuffleOptions([currentCorrectAnswer, ...distractors]);

      timerText.textContent = `Question ${currentIndex + 1}/${rawData.length}`;
      questionTitle.textContent = questionText;
      progressBar.style.width = `${((currentIndex + 1) / rawData.length) * 100}%`;
      optionsGrid.innerHTML = "";

      allOptions.forEach((optText, idx) => {
        const optCard = document.createElement("div");
        optCard.className = "option-card";
        optCard.dataset.value = optText;
        optCard.innerHTML = `
          <div class="option-prefix">${prefixes[idx]}</div>
          <span class="option-label">${optText}</span>
        `;
        optCard.onclick = () => selectOption(optText, optCard);
        optionsGrid.appendChild(optCard);
      });
    }

    function selectOption(selectedValue, clickedCard) {
      if (answered) return;
      answered = true;

      const cards = optionsGrid.querySelectorAll(".option-card");
      cards.forEach(card => card.classList.add("disabled"));

      if (selectedValue === currentCorrectAnswer) {
        clickedCard.classList.add("correct");
        score++;
        scoreText.textContent = score;
        scoreBadge.classList.add("pop");
        setTimeout(() => scoreBadge.classList.remove("pop"), 300);
      } else {
        clickedCard.classList.add("wrong");
        cards.forEach(card => {
          if (card.dataset.value === currentCorrectAnswer) {
            card.classList.add("correct");
          }
        });
      }

      setTimeout(() => {
        quizWrapper.classList.add("slide-out");
        
        setTimeout(() => {
          currentIndex++;
          if (currentIndex < rawData.length) {
            loadQuestion();
            quizWrapper.classList.remove("slide-out");
            quizWrapper.classList.add("slide-in");
            
            requestAnimationFrame(() => {
              quizWrapper.classList.remove("slide-in");
            });
          } else {
            showResults();
            quizWrapper.classList.remove("slide-out");
          }
        }, 350); 
      }, 900); 
    }

    function showResults() {
      const accuracy = Math.round((score / rawData.length) * 100);
      quizWrapper.innerHTML = `
        <div class="score-view">
          <div class="score-val">${score} / ${rawData.length}</div>
          <div class="score-label">Final Accuracy: ${accuracy}%</div>
          <button class="restart-btn" onclick="location.reload()">Restart Quiz</button>
        </div>
      `;
    }

    loadQuestion();
  </script>
