<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Chapter-End Exercise</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #22c55e;
            --error: #ef4444;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --exp-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 30px;
        }

        /* Header & Progress */
        .header {
            margin-bottom: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Question Section */
        .question-text {
            font-size: 1.25rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #e5e7eb;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            color: var(--text-main);
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #eef2ff;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #166534;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        /* Explanation Box (Immediate Feedback) */
        .explanation-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--exp-bg);
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            animation: fadeIn 0.3s ease-in;
        }

        .exp-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Controls */
        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        /* Results */
        .result-box {
            text-align: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="result-box">
        <h1>English Chapter-End Exercise</h1>
        <p style="margin-top: 10px; color: var(--text-sub);">25 Questions | Explanations Included</p>
        <button class="btn" onclick="startQuiz()" style="margin-top: 25px;">Start Quiz</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="header">
            <div class="stats-bar">
                <span id="question-count">Question 1/25</span>
                <span id="score-tracker">Score: 0</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <div id="question-text" class="question-text"></div>

        <div id="options-container" class="options-grid"></div>

        <div id="explanation-display" class="explanation-box hidden">
            <span class="exp-title">Explanation:</span>
            <span id="explanation-text"></span>
        </div>

        <div class="controls">
            <button id="next-btn" class="btn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
    </div>

    <div id="result-screen" class="hidden result-box">
        <h2>Quiz Completed!</h2>
        <div class="score-display">
            <span id="final-score">0</span> / 25
        </div>
        <p id="score-message" style="color: var(--text-sub); margin-bottom: 25px;"></p>
        <button class="btn" onclick="restartQuiz()">Restart Quiz</button>
    </div>
</div>

<script>
    // Data sourced from provided documents:
    // Questions: Source 45 (pg 1-2)
    // Explanations: Source 46 (pg 1-2, Explanatory notes)
    const quizQuestions = [
      {
        id: 1,
        question: "He looked for his book the cushion.",
        options: ["(a) cushion", "(b) under them cushion", "(c) under the cushion", "(d) into cushion"],
        correctAnswer: "(c) under the cushion",
        explanation: "The object of the sentence 'the cushion' is incomplete without the preposition 'under'. Hence, option (c) is the answer."
      },
      {
        id: 2,
        question: "We went to see her whose she was not well.",
        options: ["(a) when she was not well.", "(b) which she was not well.", "(c) where she was not well.", "(d) who she was not well."],
        correctAnswer: "(a) when she was not well.",
        explanation: "The relative pronoun joining the two clauses of the sentence requires 'when' rather than 'whose'. Hence, option (a) is the answer."
      },
      {
        id: 3,
        question: "Why you don't ever finish the work on time?",
        options: ["(a) you don't ever finish", "(b) don't you ever finish", "(c) you doesn't ever finish", "(d) doesn't you ever finish"],
        correctAnswer: "(b) don't you ever finish",
        explanation: "As it is an interrogative sentence, the auxiliary verb 'don't' should be used before the subject 'you'. Hence, option (b) is the answer."
      },
      {
        id: 4,
        question: "He will be happy to see me, he won't?",
        options: ["(a) aren't he?", "(b) won't he?", "(c) he aren't?", "(d) am I not?"],
        correctAnswer: "(b) won't he?",
        explanation: "As it is an affirmative tag question; 'He will be happy....', the clause used after the comma (,) should be negative 'won't he'. Hence, option (b) is the answer."
      },
      {
        id: 5,
        question: "They weren't planning to go on a vacation, weren't they?",
        options: ["(a) isn't they?", "(b) wasn't they?", "(c) was they?", "(d) were they?"],
        correctAnswer: "(d) were they?",
        explanation: "As it is a negative tag question; 'weren't planning to go....', the clause used after the comma (,) should be affirmative 'were they'. Hence, option (d) is the answer."
      },
      {
        id: 6,
        question: "Let's the assignment be completed soon.",
        options: ["(a) Lets the assignment", "(b) Let him the assignment", "(c) Let the assignment", "(d) Let them the assignment"],
        correctAnswer: "(c) Let the assignment",
        explanation: "As the sentence is in passive voice; 'let us or let's' needs to be replaced with only 'Let'. Hence, option (c) is the answer."
      },
      {
        id: 7,
        question: "Bravo! I hurt my toe.",
        options: ["(a) Hey, I hurt my toe!", "(b) Yippie! I hurt my toe.", "(c) Amen! I hurt my toe.", "(d) Ouch! I hurt my toe."],
        correctAnswer: "(d) Ouch! I hurt my toe.",
        explanation: "As the situation mentioned in the sentence is 'sad' in nature '...I hurt my toe'; 'bravo', which is a 'joy' indicating exclamatory word (interjection) needs to be replaced with only 'Ouch', which is a 'pain' indicating exclamatory word. Hence, option (d) is the answer."
      },
      {
        id: 8,
        question: "Not only is he smart so also has a lot of keenness to learn.",
        options: ["(a) but also has", "(b) while also has", "(c) which also has", "(d) and also has"],
        correctAnswer: "(a) but also has",
        explanation: "As it is a double-clause sentence with a phrase 'Not only....', it needs to be followed by 'Not only.... but also....', instead of 'so also .....'. Hence, option (a) is the answer."
      },
      {
        id: 9,
        question: "Naresh said he has met most of the team members.",
        options: ["(a) he meet", "(b) he meeting", "(c) he had met", "(d) he had been met"],
        correctAnswer: "(c) he had met",
        explanation: "As the sentence has two past indicating words: 'said' and 'met', the verb used to indicate earlier action should be in past perfect 'had met' and the verb used to indicate the action that happened later should be in simple past 'said'. Hence, option (c) is the answer."
      },
      {
        id: 10,
        question: "He said New Delhi was the capital of India.",
        options: ["(a) New Delhi will be the capital", "(b) New Delhi is the capital", "(c) New Delhi were the capital", "(d) New Delhi capital"],
        correctAnswer: "(b) New Delhi is the capital",
        explanation: "As 'New Delhi' is still the capital of India (action continues), it should be expressed in 'is' rather than 'was'. Hence, option (b) is the answer."
      },
      {
        id: 11,
        question: "My neighbour told me someone has been looking for me yesterday.",
        options: ["(a) will be looking", "(b) is looking", "(c) have been looking", "(d) had been looking"],
        correctAnswer: "(d) had been looking",
        explanation: "As the time phrase used in the sentence is 'yesterday', denoting past, it should be expressed as: 'had been looking' (past perfect continuous) rather than 'has been looking' (present perfect continuous). Hence, option (d) is the answer."
      },
      {
        id: 12,
        question: "When did you had your dinner?",
        options: ["(a) did you be having", "(b) did you have", "(c) did you having", "(d) did you has"],
        correctAnswer: "(b) did you have",
        explanation: "As the sentence denotes past action, 'did' cannot be followed by 'had', but 'have'. Hence, option (b) is the answer."
      },
      {
        id: 13,
        question: "She said she shall be doing some important work next Friday.",
        options: ["(a) she should be doing", "(b) she would be doing", "(c) she shall doing", "(d) she must be doing"],
        correctAnswer: "(b) she would be doing",
        explanation: "As the time phrase used in the sentence is, 'next Friday', it should take the verb modal: 'would' rather than auxiliary verb 'shall'. Hence, option (b) is the answer."
      },
      {
        id: 14,
        question: "Simran told to me that he was the captain of the team.",
        options: ["(a) told me", "(b) said me", "(c) says me", "(d) tells me"],
        correctAnswer: "(a) told me",
        explanation: "As per the 'direct-indirect Speech' rule, reporting verb 'told' is not followed by the preposition 'to' (however, 'said' needs to be followed by the preposition 'to'). Thus it should be 'told me' rather than 'told to me'. Hence, option (a) is the answer."
      },
      {
        id: 15,
        question: "I approached the policeman and enquired him when I could leave the city.",
        options: ["(a) enquired from him", "(b) enquired to him", "(c) enquired of him", "(d) enquired for him"],
        correctAnswer: "(c) enquired of him",
        explanation: "As per the 'direct-indirect Speech' rule, reporting verb 'enquired' should be followed by the preposition 'of'. Thus it should be 'enquired of him' rather than 'enquired him'. Hence, option (c) is the answer."
      },
      {
        id: 16,
        question: "I asked Ritika where she has been all those days.",
        options: ["(a) she had been", "(b) she will have been", "(c) she will be", "(d) she was being"],
        correctAnswer: "(a) she had been",
        explanation: "As the sentence has two past indicating words: 'asked' and 'been', the verb used to indicate earlier action should be in past perfect 'had been' and the verb used to indicate the action that happened later should be in simple past 'asked'. Hence, option (a) is the answer."
      },
      {
        id: 17,
        question: "My cousin asked me if I will not be going to the movie that evening.",
        options: ["(a) will going", "(b) would not be going", "(c) will go", "(d) would going"],
        correctAnswer: "(b) would not be going",
        explanation: "As per the 'direct-indirect Speech' rule, verb indicating 'nearness' of time' needs to be replaced when the sentence is expressed in indirect speech. Thus, 'will' in '... not be going' should be replaced with 'would'. Hence, option (b) is the answer."
      },
      {
        id: 18,
        question: "Are you being entertain by this show?",
        options: ["(a) being entertained", "(b) being entertaining", "(c) being entertains", "(d) being entertainment"],
        correctAnswer: "(a) being entertained",
        explanation: "As the sentence is expressed in passive voice, its verb should be expressed in V3 form. Thus, 'being entertain' should be replaced with 'being entertained'. Hence, option (a) is the answer."
      },
      {
        id: 19,
        question: "Mohini urged her friend to drop her home as it is getting dark.",
        options: ["(a) as it will be getting dark.", "(b) as it has been dark.", "(c) as it is dark.", "(d) as it was getting dark."],
        correctAnswer: "(d) as it was getting dark.",
        explanation: "As the sentence is expressed in reported speech (indirect speech), its verb should be expressed in V2 form. Thus, 'as it is getting dark' should be replaced with 'as it was getting dark'. Hence, option (d) is the answer."
      },
      {
        id: 20,
        question: "The teacher taught her students that honesty was the best policy.",
        options: ["(a) honesty should be the best policy.", "(b) honesty were the best policy.", "(c) honesty is the best policy.", "(d) honesty will be the best policy."],
        correctAnswer: "(c) honesty is the best policy.",
        explanation: "As the sentence is expressed in reported speech (indirect speech) speaks about universal truth, its verb should be expressed in V1 form. Thus, 'was' in 'honesty was the best policy' should be replaced with 'is': 'honesty is the best policy'. Hence, option (c) is the answer."
      },
      {
        id: 21,
        question: "The boss was please with the hard-working employee.",
        options: ["(a) has pleased with", "(b) pleases with", "(c) pleasing with", "(d) pleased with"],
        correctAnswer: "(d) pleased with",
        explanation: "The sentence should have 'pleased' as an adjective followed by 'the boss was...' rather than 'please', which is a 'request making word' an imperative sentence. Hence, option (d) is the answer."
      },
      {
        id: 22,
        question: "He exclaimed jubilantly that he has stood first in the class.",
        options: ["(a) he had stood first", "(b) he stands first", "(c) he is standing first", "(d) he will stand first"],
        correctAnswer: "(a) he had stood first",
        explanation: "As the sentence has two past indicating words: 'exclaimed' and 'stood', the verb used to indicate earlier action should be in past perfect 'had stood' and the verb used to indicate the action that happened later should be in simple past 'exclaimed'. Hence, option (a) is the answer."
      },
      {
        id: 23,
        question: "These great words were spoke by Dr Watson.",
        options: ["(a) were speaking by", "(b) were speak by", "(c) were spoken by", "(d) were speaks by"],
        correctAnswer: "(c) were spoken by",
        explanation: "As the sentence is expressed in passive voice, its verb should be expressed in V3 form. Thus, 'were spoke by' should be replaced with 'was spoken by'. Hence, option (c) is the answer."
      },
      {
        id: 24,
        question: "The father encouraged the unsuccessful son not to worry, as everything will be fine.",
        options: ["(a) everything is fine.", "(b) everything would be fine.", "(c) everything fine.", "(d) everything shall be fine."],
        correctAnswer: "(b) everything would be fine.",
        explanation: "As per the 'direct-indirect Speech' rule, verb indicating 'nearness' of time' needs to be replaced when the sentence is expressed in indirect speech. Thus, 'will be fine' in '...will be fine' should be replaced with '.....would be fine'. Hence, option (b) is the answer."
      },
      {
        id: 25,
        question: "Did they made the attempt to conquer the fort?",
        options: ["(a) Did they making", "(b) Did they makes", "(c) Did they make", "(d) Did they maker"],
        correctAnswer: "(c) Did they make",
        explanation: "As the sentence denotes past action, 'did' cannot be followed by 'made', but 'make'. Hence, option (c) is the answer."
      }
    ];

    // --- APP LOGIC ---
    let currentQuestionIndex = 0;
    let score = 0;

    // Elements
    const screens = {
        start: document.getElementById('start-screen'),
        quiz: document.getElementById('quiz-screen'),
        result: document.getElementById('result-screen')
    };

    const els = {
        questionText: document.getElementById('question-text'),
        optionsContainer: document.getElementById('options-container'),
        progressFill: document.getElementById('progress-fill'),
        questionCount: document.getElementById('question-count'),
        scoreTracker: document.getElementById('score-tracker'),
        nextBtn: document.getElementById('next-btn'),
        finalScore: document.getElementById('final-score'),
        scoreMsg: document.getElementById('score-message'),
        expDisplay: document.getElementById('explanation-display'),
        expText: document.getElementById('explanation-text')
    };

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        showScreen('quiz');
        loadQuestion();
    }

    function showScreen(screenName) {
        Object.values(screens).forEach(s => s.classList.add('hidden'));
        screens[screenName].classList.remove('hidden');
    }

    function loadQuestion() {
        const q = quizQuestions[currentQuestionIndex];
        
        // Update UI
        els.questionText.textContent = `${q.id}. ${q.question}`;
        els.questionCount.textContent = `Question ${currentQuestionIndex + 1}/${quizQuestions.length}`;
        els.scoreTracker.textContent = `Score: ${score}`;
        els.nextBtn.disabled = true;
        
        // Hide explanation from previous question
        els.expDisplay.classList.add('hidden');
        els.expText.textContent = '';

        // Progress Bar
        const progress = (currentQuestionIndex / quizQuestions.length) * 100;
        els.progressFill.style.width = `${progress}%`;

        // Render Options
        els.optionsContainer.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(btn, opt, q);
            els.optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedOption, questionObj) {
        const allBtns = els.optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const isCorrect = selectedOption === questionObj.correctAnswer;

        if (isCorrect) {
            selectedBtn.classList.add('correct');
            score++;
        } else {
            selectedBtn.classList.add('wrong');
            // Highlight correct one
            allBtns.forEach(btn => {
                if (btn.textContent === questionObj.correctAnswer) {
                    btn.classList.add('correct');
                }
            });
        }

        // SHOW EXPLANATION IMMEDIATELY
        els.expText.textContent = questionObj.explanation;
        els.expDisplay.classList.remove('hidden');

        els.nextBtn.disabled = false;
        els.scoreTracker.textContent = `Score: ${score}`;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizQuestions.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        showScreen('result');
        els.finalScore.textContent = score;
        els.progressFill.style.width = '100%';

        const percentage = (score / quizQuestions.length) * 100;
        if (percentage === 100) els.scoreMsg.textContent = "Perfect Score!";
        else if (percentage >= 80) els.scoreMsg.textContent = "Great work!";
        else if (percentage >= 50) els.scoreMsg.textContent = "Good effort. Review the explanations to improve.";
        else els.scoreMsg.textContent = "Keep practicing. Read the explanations carefully.";
    }

    function restartQuiz() {
        startQuiz();
    }
</script>

</body>
</html>
