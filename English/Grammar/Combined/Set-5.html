<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC/Banking - Sentence Improvement Quiz - Practice Set 9</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f8fafc;
            --bg-panel: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--bg-panel);
            max-width: 850px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h2 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; }

        .progress-container {
            background: #e0e7ff;
            height: 8px;
            width: 100%;
        }

        .progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Question View Styles --- */
        .question-body { padding: 40px; min-height: 400px; }

        .question-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #1e293b;
        }

        .question-text u {
            text-decoration-color: var(--primary);
            text-decoration-thickness: 3px;
            padding-bottom: 2px;
        }

        .options-list { display: flex; flex-direction: column; gap: 14px; }

        .option-btn {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 22px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .option-btn:disabled { cursor: default; }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--wrong-text);
        }

        .explanation {
            margin-top: 30px;
            background: #f8fafc;
            border-left: 5px solid var(--primary);
            padding: 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.4s ease;
            color: #334155;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .explanation strong { color: var(--primary); }

        .footer-nav {
            padding: 20px 40px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
        }

        .nav-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background: var(--border-color);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .nav-btn:hover:not(:disabled) { background: #cbd5e1; }
        .nav-btn.primary-btn { background: var(--primary); color: white; }
        .nav-btn.primary-btn:hover:not(:disabled) { background: var(--primary-hover); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* --- Final Result Dashboard Styles --- */
        .result-body {
            display: none;
            padding: 40px;
            background: #f8fafc;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .dashboard-header h3 {
            font-size: 2rem;
            color: var(--text-main);
            margin: 0 0 10px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .val-total { color: var(--primary); }
        .val-correct { color: #16a34a; }
        .val-wrong { color: #dc2626; }
        .val-acc { color: #d97706; }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .review-card {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .review-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
        }

        .review-card.is-correct::before { background: #22c55e; }
        .review-card.is-wrong::before { background: #ef4444; }
        .review-card.is-skipped::before { background: #94a3b8; }

        .r-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .r-answer-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .r-row {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .icon { margin-right: 8px; font-size: 1.1rem; }

        .r-explanation {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .question-body, .result-body { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Sentence Improvement - Practice Set 9</h2>
    </div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Interface for Answering Questions -->
    <div class="question-body" id="questionBody">
        <div class="question-meta">
            <span id="questionCount">Question 1 of 34</span>
            <span>SSC / Bank Pattern</span>
        </div>
        
        <div class="question-text" id="questionText"></div>
        <div class="options-list" id="optionsContainer"></div>
        <div class="explanation" id="explanationBox"></div>
    </div>

    <div class="footer-nav" id="footerNav">
        <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" disabled>Previous</button>
        <button class="nav-btn primary-btn" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>

    <!-- Interface for Final Results -->
    <div class="result-body" id="resultBody">
        <div class="dashboard-header">
            <h3>Performance Dashboard</h3>
            <p style="color: var(--text-muted);">Review your answers and explanations below.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value val-total" id="statTotal">0</div>
                <div class="stat-label">Total Questions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-correct" id="statCorrect">0</div>
                <div class="stat-label">Correct Answers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-wrong" id="statWrong">0</div>
                <div class="stat-label">Incorrect Answers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-acc" id="statAcc">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>

        <div class="review-list" id="reviewList">
            <!-- Review cards injected here via JS -->
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <button class="nav-btn primary-btn" onclick="location.reload()" style="padding: 16px 40px; font-size: 1.1rem;">Restart Practice</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "He was bitten by a snake, <u>walking in the garden</u>.",
            options: { a: "as he walked in the garden", b: "while he walked in the garden", c: "while he was walking in the garden", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) while he was walking in the garden:</strong> It is not clear in the sentence where snake was walked or he; so it should be \"while he was walking in the garden.\""
        },
        {
            q: "No one could explain how a calm and balanced person like him could <u>penetrate</u> such a mindless act on his friends.",
            options: { a: "perpetuate", b: "perpetrate", c: "precipitate", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) perpetrate:</strong> Penetrate is wrong use; it should be perpetrate."
        },
        {
            q: "I gave him <u>the little</u> money that I could spare then.",
            options: { a: "very little", b: "some little", c: "a little", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) a little:</strong> \"A little money\" is appropriate as it means some money."
        },
        {
            q: "Mahatma Gandhi was <u>by far a great man</u> of India.",
            options: { a: "a very great man", b: "too great a man", c: "the greatest man", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) the greatest man:</strong> As \"by far\" is used, therefore, \"the greatest man\" is appropriate."
        },
        {
            q: "No sooner had the umpire given the batsman out <u>than the crowd rushed</u> into the field.",
            options: { a: "but the people", b: "when the crowds", c: "and the crowd", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The conjunction 'no sooner' is always paired correctly with 'than'."
        },
        {
            q: "Within a few years most of the fertile land <u>had underwent</u> forcible indigo cultivation.",
            options: { a: "has underwent", b: "had undergone", c: "was undergone", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) had undergone:</strong> The past perfect tense is formed with 'had' plus the past participle verb form (undergone, not underwent)."
        },
        {
            q: "If you have paid only twenty rupees for this purse, it <u>has really cheap</u>.",
            options: { a: "has really cheapest", b: "is really cheap", c: "has been really cheapest", d: "is real cheap", e: "No correction required" },
            ans: "b",
            expl: "<strong>(b) is really cheap:</strong> 'Is' correctly acts as the linking verb to describe the state or fact about the purse being cheap."
        },
        {
            q: "<u>If the pain is returning</u>, you would better take another pill.",
            options: { a: "has returned", b: "should return", c: "returned", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) returned:</strong> In conditional sentences expressing advice for a hypothetical situation, the simple past ('returned') aligns with the conditional 'would better/had better'."
        },
        {
            q: "<u>From where did he obtain the money</u> is a mystery.",
            options: { a: "Where from did he obtain the money", b: "Where did he obtain the money from", c: "Where he obtained the money from", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) Where he obtained the money from:</strong> When a question becomes a noun clause acting as a subject, the word order must be assertive (Subject + Verb), not interrogative."
        },
        {
            q: "Do you <u>remember to meet her</u> at my house last year?",
            options: { a: "remember of meeting her", b: "remember about meeting her", c: "remember having met her", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) remember having met her:</strong> The verb 'remember' is followed by a gerund or perfect gerund ('having met') when referring back to a past action or memory."
        },
        {
            q: "The monograph which was published 3 years ago, <u>would suggest</u> that by 2001 there will be 73 million T.V. sets in India.",
            options: { a: "has been suggesting", b: "had suggested", c: "would have suggested", d: "will suggest" },
            ans: "b",
            expl: "<strong>(b) had suggested:</strong> Because the publication happened in the past (3 years ago), the past perfect 'had suggested' properly sequences the past actions."
        },
        {
            q: "Vishal, who <u>studies</u> medicine at present, hopes to go abroad after graduation.",
            options: { a: "has been studying", b: "is studying", c: "will study", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) is studying:</strong> The phrase 'at present' indicates a temporary, ongoing action, requiring the present continuous tense."
        },
        {
            q: "The greatest thing in style is to have a <u>use</u> of metaphor.",
            options: { a: "command", b: "knowledge", c: "need", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) command:</strong> Idiomatically, one has a 'command of' a language or literary device, implying mastery and skill."
        },
        {
            q: "A good house has been <u>alloted</u> to him.",
            options: { a: "aloted", b: "alloted", c: "allotted", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) allotted:</strong> The correct spelling for assigning a portion of something is 'allotted' (double 'l', double 't')."
        },
        {
            q: "Ashutosh <u>had occupying</u> this house for over 25 years and has no intention of vacating it now.",
            options: { a: "is occupying", b: "will occupy", c: "was to occupy", d: "has been occupying", e: "No correction required" },
            ans: "d",
            expl: "<strong>(d) has been occupying:</strong> An action starting in the past and continuing into the present ('for over 25 years' and 'now') requires the present perfect continuous tense."
        },
        {
            q: "One can live and work in a town without being aware of the daily march of the sun across the sky without <u>never</u> seeing the moon and stars.",
            options: { a: "seldom", b: "hardly", c: "ever", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) ever:</strong> The preposition 'without' is inherently negative. Following it with 'never' creates an incorrect double negative. 'Ever' is the correct choice."
        },
        {
            q: "From next term we will <u>go all out</u> for sports.",
            options: { a: "all go out", b: "all be out", c: "be all out", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) all go out:</strong> \"We will all go out\" correctly positions the pronoun 'all' to refer to 'we'."
        },
        {
            q: "<u>If you had attended</u> the meeting, you would have benefited a great deal.",
            options: { a: "would benefit", b: "could benefit", c: "benefited", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> This is a perfectly formed Type 3 conditional sentence: 'had + past participle' in the if-clause, and 'would have + past participle' in the main clause."
        },
        {
            q: "My neighbours are extremely noisy but even more <u>are they quarrelsome</u>.",
            options: { a: "they are even more quarrelsome", b: "even more they are quarrelsome", c: "they are quarrelsome even more", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) they are even more quarrelsome:</strong> Standard English requires an assertive word order (Subject + Verb) here, not the inverted order of a question."
        },
        {
            q: "The article should not <u>exceed more than</u> hundred words.",
            options: { a: "exceed beyond", b: "exceed", c: "exceed than", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) exceed:</strong> The verb 'exceed' inherently means 'to be more than', making the phrase 'more than' redundant."
        },
        {
            q: "Though courageous, he could not <u>hold up</u> against the heavy odds.",
            options: { a: "hold fast", b: "hold out", c: "hold in", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) hold out:</strong> The phrasal verb 'hold out' means to resist or endure in difficult circumstances, which fits the context of facing heavy odds."
        },
        {
            q: "The meeting was postponed <u>owing to lack</u> of quorum.",
            options: { a: "due to", b: "because of", c: "for", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) for:</strong> 'For lack of' is a standard, idiomatic phrase meaning because of a deficiency or absence of something."
        },
        {
            q: "Hoping not to be disturbed, I sat down in my easy chair to read the book <u>I won as a prize</u>.",
            options: { a: "I have won as prize", b: "I had won as a prize", c: "I had to win as a prize", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) I had won as a prize:</strong> The action of winning the prize occurred before sitting down to read. The past perfect tense ('had won') correctly shows this sequence of past events."
        },
        {
            q: "He copied the details <u>word by word</u>.",
            options: { a: "word to word", b: "word for word", c: "word on word", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) word for word:</strong> The correct English idiom for copying or translating exactly as written or spoken is 'word for word'."
        },
        {
            q: "In India today many of our intellectuals still talk in terms of the French revolution and the Rights of Man, not appreciating that <u>much has happened since then</u>.",
            options: { a: "much might happen", b: "much had happened", c: "much has been happening", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The present perfect tense ('has happened') accurately connects past events to the present situation being discussed."
        },
        {
            q: "<u>How one earned money is more important than how much he earned?</u>",
            options: { a: "he earns", b: "he has earned", c: "one earns", d: "one earned", e: "No correction required" },
            ans: "c",
            expl: "<strong>(c) one earns:</strong> To maintain pronoun consistency, 'one' should be followed by 'one', and the general truth is best expressed in the simple present tense ('earns')."
        },
        {
            q: "About a thousand sportsmen from all the colleges have arrived, the <u>highest</u> contingent being from Delhi.",
            options: { a: "biggest", b: "largest", c: "greatest", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) biggest:</strong> While 'largest' is also common, 'biggest' is grammatically correct and selected by the answer key to describe the size of a group of people."
        },
        {
            q: "The man <u>to who I sold</u> my house was a cheat.",
            options: { a: "to whom I sell", b: "to who I sell", c: "who was sold to", d: "to whom I sold", e: "No correction required" },
            ans: "d",
            expl: "<strong>(d) to whom I sold:</strong> 'Whom' is the objective case of 'who' and must be used after the preposition 'to'."
        },
        {
            q: "He has <u>fallen out</u> with the girl he wanted to marry.",
            options: { a: "fallen off", b: "fallen in love", c: "fallen for", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) fallen in love:</strong> Contextually, falling 'in love' with the person you want to marry makes more logical sense than falling 'out' (which means having an argument)."
        },
        {
            q: "The greater the demand, <u>higher</u> the price.",
            options: { a: "the higher", b: "high", c: "the high", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) the higher:</strong> This is a parallel comparative structure. It must follow the pattern: 'The + comparative adjective, the + comparative adjective' (The greater... the higher)."
        },
        {
            q: "I <u>have been working</u> on this job for the last ten days.",
            options: { a: "am working", b: "would be working", c: "have been worked", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> An action starting in the past and continuing to the present is correctly expressed using the present perfect continuous tense ('have been working')."
        },
        {
            q: "The Managing Director said that the firm had ordered the goods and <u>will</u> have to pay for them.",
            options: { a: "may", b: "would", c: "shall", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) would:</strong> In indirect speech where the reporting verb is in the past ('said'), the future modal 'will' must be backshifted to its past form, 'would'."
        },
        {
            q: "He never recollected his grand father <u>to say</u> that his job was odd.",
            options: { a: "say", b: "to have said", c: "saying", d: "while saying", e: "No correction required" },
            ans: "c",
            expl: "<strong>(c) saying:</strong> The verb 'recollect' is followed by a gerund (-ing form) when referring back to a past memory or action."
        },
        {
            q: "Modern industrialized communities have lost touch with the soil and do not experience that joy which nature gives and the rich glow of health <u>that which comes from contact with</u> mother earth.",
            options: { a: "which comes from contact with", b: "which comes out from contact with", c: "which flows how from contact with", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) which comes from contact with:</strong> Using both 'that' and 'which' together is redundant. 'Which comes from contact with' is concise and grammatically correct."
        }
    ];

    let currentQuestionIndex = 0;
    const userAnswers = new Array(quizData.length).fill(null);
    
    // UI Elements
    const qBody = document.getElementById('questionBody');
    const footerNav = document.getElementById('footerNav');
    const resultBody = document.getElementById('resultBody');
    const qText = document.getElementById('questionText');
    const optsContainer = document.getElementById('optionsContainer');
    const explBox = document.getElementById('explanationBox');
    const progBar = document.getElementById('progressBar');
    const qCount = document.getElementById('questionCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function loadQuestion(index) {
        const qData = quizData[index];
        
        qCount.innerText = `Question ${index + 1} of ${quizData.length}`;
        progBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
        
        qText.innerHTML = `${index + 1}. ${qData.q}`;
        optsContainer.innerHTML = '';
        explBox.style.display = 'none';
        
        for (const [key, value] of Object.entries(qData.options)) {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `(${key}) ${value}`;
            
            if (userAnswers[index]) {
                btn.disabled = true;
                if (key === qData.ans) {
                    btn.classList.add('correct');
                } else if (key === userAnswers[index] && key !== qData.ans) {
                    btn.classList.add('wrong');
                }
            } else {
                btn.onclick = () => selectAnswer(key, btn);
            }
            optsContainer.appendChild(btn);
        }

        if (userAnswers[index]) {
            explBox.innerHTML = qData.expl;
            explBox.style.display = 'block';
        }

        prevBtn.disabled = index === 0;
        nextBtn.innerText = index === quizData.length - 1 ? 'Finish & View Results' : 'Next';
    }

    function selectAnswer(selectedKey, btnElement) {
        const qData = quizData[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = selectedKey;
        
        const allBtns = optsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => {
            btn.disabled = true;
            const btnKey = btn.innerText.match(/\((.)\)/)[1];
            if (btnKey === qData.ans) btn.classList.add('correct');
        });

        if (selectedKey !== qData.ans) btnElement.classList.add('wrong');

        explBox.innerHTML = qData.expl;
        explBox.style.display = 'block';
        
        // Auto Scroll to the bottom to show explanation and the next button
        setTimeout(() => {
            footerNav.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 150);
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion(currentQuestionIndex);
        } else {
            showFinalResults();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion(currentQuestionIndex);
        }
    }

    function showFinalResults() {
        qBody.style.display = 'none';
        footerNav.style.display = 'none';
        resultBody.style.display = 'block';

        let correct = 0;
        let wrong = 0;
        let skipped = 0;
        let reviewHTML = '';

        quizData.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            let isCorrect = false;
            let cardClass = '';
            let userIcon = '';
            
            if (!userAns) {
                skipped++;
                cardClass = 'is-skipped';
                userIcon = '<span class="icon" style="color:#94a3b8;">➖</span>';
            } else if (userAns === q.ans) {
                correct++;
                isCorrect = true;
                cardClass = 'is-correct';
                userIcon = '<span class="icon" style="color:#22c55e;">✅</span>';
            } else {
                wrong++;
                cardClass = 'is-wrong';
                userIcon = '<span class="icon" style="color:#ef4444;">❌</span>';
            }

            reviewHTML += `
                <div class="review-card ${cardClass}">
                    <div class="r-question">Q${idx + 1}. ${q.q}</div>
                    <div class="r-answer-block">
                        <div class="r-row ${isCorrect ? 'text-correct' : (userAns ? 'text-wrong' : 'text-muted')}">
                            ${userIcon} Your Answer: ${userAns ? `(${userAns}) ${q.options[userAns]}` : 'Skipped'}
                        </div>
                        ${!isCorrect ? `
                        <div class="r-row text-correct">
                            <span class="icon">🎯</span> Correct Answer: (${q.ans}) ${q.options[q.ans]}
                        </div>` : ''}
                    </div>
                    <div class="r-explanation">${q.expl}</div>
                </div>
            `;
        });

        const total = quizData.length;
        const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

        document.getElementById('statTotal').innerText = total;
        document.getElementById('statCorrect').innerText = correct;
        document.getElementById('statWrong').innerText = wrong;
        document.getElementById('statAcc').innerText = `${accuracy}%`;
        
        document.getElementById('reviewList').innerHTML = reviewHTML;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize Quiz
    loadQuestion(0);
</script>

</body>
</html>
