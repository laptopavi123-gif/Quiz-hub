<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Exam - Complete Sentence Improvement Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--card-bg);
            max-width: 850px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
            font-size: 1.4rem;
        }

        .progress-container {
            background: #e0e7ff;
            height: 6px;
            width: 100%;
        }

        .progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-body {
            padding: 30px;
            min-height: 400px;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .question-text u {
            text-decoration-color: var(--primary);
            text-decoration-thickness: 2px;
            padding-bottom: 2px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: #15803d;
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: #b91c1c;
        }

        .explanation {
            margin-top: 25px;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 18px;
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.3s ease-in;
            color: #334155;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-nav {
            padding: 20px 30px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
        }

        .nav-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: var(--border-color);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        .nav-btn:hover:not(:disabled) {
            background: #cbd5e1;
        }

        .nav-btn.primary-btn {
            background: var(--primary);
            color: white;
        }

        .nav-btn.primary-btn:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Review Section Styles */
        .review-section {
            display: none;
            padding: 30px;
        }

        .score-card {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .review-item {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-q-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .review-ans {
            font-size: 0.95rem;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .text-correct { color: #15803d; }
        .text-wrong { color: #b91c1c; }
        .text-neutral { color: var(--text-muted); }
        
        .review-expl {
            margin-top: 10px;
            font-size: 0.9rem;
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Sentence Improvement Practice (43 Questions)</h2>
    </div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Question View -->
    <div class="question-body" id="questionBody">
        <div class="question-meta">
            <span id="questionCount">Question 1 of 43</span>
            <span>SSC CGL / CDS Pattern</span>
        </div>
        
        <div class="question-text" id="questionText"></div>
        <div class="options-list" id="optionsContainer"></div>
        <div class="explanation" id="explanationBox"></div>
    </div>

    <!-- Review View -->
    <div class="review-section" id="reviewSection">
        <!-- Injected via JS -->
    </div>

    <div class="footer-nav" id="footerNav">
        <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" disabled>Previous</button>
        <button class="nav-btn primary-btn" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "They are <u>bringing down</u> the old bridge to build a new one.",
            options: { a: "destroying", b: "damaging", c: "demolishing", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) demolishing:</strong> Buildings and bridges are intentionally 'demolished' to make way for new structures. 'Destroying' usually implies violence or accidents."
        },
        {
            q: "Maggie took a hot bath because she <u>was working</u> in the garden all afternoon.",
            options: { a: "is", b: "has", c: "had been working", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) had been working:</strong> For an action that was continuous and completed in the past before another past action (took a bath), the past perfect continuous tense is required."
        },
        {
            q: "The country faced a rainfall deficit of eight percent <u>after the</u> four month long southwest monsoon.",
            options: { a: "during the", b: "at the end of the", c: "for the", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) at the end of the:</strong> Deficits are calculated and declared 'at the end of' a season."
        },
        {
            q: "Children with disabilities and special needs also have the right to education <u>just like normal children</u>.",
            options: { a: "just as normal children do", b: "even as normal children are doing", c: "along with normal children", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) just as normal children do:</strong> Using 'just as... do' is grammatically superior and more formal than the prepositional phrase 'just like' when comparing clauses."
        },
        {
            q: "He was <u>too glad</u> to see his friend.",
            options: { a: "very glad", b: "so glad", c: "to glad", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) very glad:</strong> 'Too' implies a negative excess (more than necessary). In affirmative positive contexts, 'very' is the correct adverb."
        },
        {
            q: "All his efforts to find his lost child were in <u>vane</u>.",
            options: { a: "vein", b: "wane", c: "vain", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) vain:</strong> 'In vain' is the correct spelling of the idiom meaning without success or result."
        },
        {
            q: "He is so intelligent that he <u>could</u> win the quiz competition.",
            options: { a: "will", b: "can", c: "should", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) can:</strong> The main clause is in the present tense ('He is so intelligent'), so the subordinate clause must use 'can' rather than the past form 'could'."
        },
        {
            q: "The demonstration <u>passed</u> peacefully.",
            options: { a: "passed out", b: "passed off", c: "passed on", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) passed off:</strong> The correct phrasal verb for an event taking place and finishing in a certain way is 'passed off'."
        },
        {
            q: "They have not spoken to each other <u>since they</u> quarreled.",
            options: { a: "for", b: "because", c: "ever since", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> 'Since' correctly establishes the point of time in the past when the action started."
        },
        {
            q: "I walked back home after the movie <u>yesterday night</u>.",
            options: { a: "last night", b: "previous night", c: "that night", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) last night:</strong> 'Yesterday night' is not standard English; the correct phrase is 'last night'."
        },
        {
            q: "Last evening I went to the optician and bought <u>spectacles</u>.",
            options: { a: "a spectacle", b: "two spectacles", c: "a pair of spectacles", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) a pair of spectacles:</strong> Items composed of two identical parts joined together (spectacles, scissors, trousers) take 'a pair of'."
        },
        {
            q: "He came <u>despite of</u> his busy schedule.",
            options: { a: "nevertheless", b: "but for", c: "in spite of", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) in spite of:</strong> 'Despite' never takes the preposition 'of'. You must use either 'despite' alone or 'in spite of'."
        },
        {
            q: "The receptionist asked the patient, 'Who <u>recommended</u> you to Dr. Paulson?'",
            options: { a: "introduced", b: "referred", c: "alluded", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) referred:</strong> In medical contexts, patients are 'referred' to specialists by other doctors or individuals."
        },
        {
            q: "<u>Seeing that she is very tired</u>, I walked out of the room and let her sleep.",
            options: { a: "Seeing that she are very tired", b: "Seeing that she was very tired", c: "Seeing she is tired", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) Seeing that she was very tired:</strong> The main verbs ('walked', 'let') are in the past tense, so the dependent clause must also be in the past tense ('was')."
        },
        {
            q: "Because of his mastery in this field, his suggestions are <u>wide accepted</u>.",
            options: { a: "are widely accepted", b: "are wide acceptance", c: "have widely accepted", d: "have been wide accepted", e: "No correction required" },
            ans: "a",
            expl: "<strong>(a) are widely accepted:</strong> We need the adverb 'widely' to modify the past participle 'accepted'."
        },
        {
            q: "I hope, you vividly remember the premiere of the film when <u>I, my wife and you</u> were present in the hall.",
            options: { a: "you, I and my wife", b: "my wife, I and you", c: "you, my wife and I", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) you, my wife and I:</strong> When multiple pronouns/nouns are connected, the standard courteous order is Second Person, Third Person, First Person (231)."
        },
        {
            q: "The fact finding committee has so far not made any <u>advancement</u>.",
            options: { a: "progress", b: "improvement", c: "stride", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) progress:</strong> The standard collocation when referring to committees or tasks moving forward is making 'progress'."
        },
        {
            q: "Who does not know that this was <u>broadcasted</u> ten days ago?",
            options: { a: "had broadcast", b: "was broadcast", c: "was broadcasting", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) was broadcast:</strong> The past participle of 'broadcast' remains 'broadcast'. 'Broadcasted' is incorrect."
        },
        {
            q: "You are warned <u>against committing</u> the same mistake again.",
            options: { a: "for committing", b: "against to commit", c: "to commit", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> 'Warned against' followed by a gerund ('committing') is grammatically flawless."
        },
        {
            q: "The teacher gave the students some <u>advice</u>.",
            options: { a: "advise", b: "advises", c: "advices", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> 'Advice' is an uncountable noun. It cannot be pluralized as 'advices'. ('Advise' is a verb)."
        },
        {
            q: "I shall <u>ring him</u> tomorrow in the afternoon.",
            options: { a: "ring to him", b: "ring up to him", c: "ring him up", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) ring him up:</strong> The correct phrasal verb meaning to telephone someone is to 'ring (someone) up'."
        },
        {
            q: "You must find <u>someone</u> to accompany you to Bombay.",
            options: { a: "no one", b: "everyone", c: "anyone", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> 'Someone' is correctly used in affirmative sentences when referring to an unspecified person."
        },
        {
            q: "I wish I <u>was</u> with him.",
            options: { a: "have been", b: "were", c: "am", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) were:</strong> In expressions of unfulfilled wishes or hypothetical situations (subjunctive mood), 'were' is used for all subjects."
        },
        {
            q: "He is the <u>kindest and generous</u> of all my friends.",
            options: { a: "more generous among all my friends", b: "more generous of all my friends", c: "kindest and most generous", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) kindest and most generous:</strong> The rule of parallelism dictates that adjectives connected by 'and' must be in the same degree (superlative + superlative)."
        },
        {
            q: "None of the guests <u>were introduced</u> to the bride.",
            options: { a: "introduced", b: "was introduced", c: "have been introduced", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) was introduced:</strong> In formal grammar, 'none' takes a singular verb because it means 'not a single one'."
        },
        {
            q: "One should exercise <u>their</u> right to vote.",
            options: { a: "his", b: "our", c: "one's", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) one's:</strong> The pronoun 'one' must be followed by its possessive form 'one's'."
        },
        {
            q: "He stopped <u>to work</u> an hour ago.",
            options: { a: "to working", b: "to have worked", c: "working", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) working:</strong> 'Stop' followed by a gerund ('working') means to cease an action. 'Stop to work' means pausing in order to start working."
        },
        {
            q: "<u>Little</u> that I knew of the English language, was not sufficient to make me a teacher of English.",
            options: { a: "Very little", b: "The little", c: "A little", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) The little:</strong> 'The little' is used to denote a specific, though small, amount ('the little that I knew')."
        },
        {
            q: "Your results depend not only on how much you have studied <u>but how long</u> you have read.",
            options: { a: "but also how long", b: "but also on how long", c: "but also on how much long", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) but also on how long:</strong> The correlative conjunction 'not only... but also' requires strict parallel structure ('not only on... but also on...')."
        },
        {
            q: "She <u>cut a sad figure</u> in her first performance on the stage.",
            options: { a: "made a sorry figure", b: "cut a sorry face", c: "cut a sorry figure", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) cut a sorry figure:</strong> This is a fixed idiom which means to leave a poor or negative impression."
        },
        {
            q: "When the professor fell off the stool, the students could not <u>avoid to laugh</u>.",
            options: { a: "avoid laughing", b: "refrain to laugh", c: "avoid laughter", d: "stop laughter", e: "No correction required" },
            ans: "a",
            expl: "<strong>(a) avoid laughing:</strong> The verb 'avoid' is always followed by a gerund (-ing form), not an infinitive."
        },
        {
            q: "What <u>does agonise me most</u> is not this criticism, but the trivial reason behind it.",
            options: { a: "I most agonised", b: "most agonising me", c: "agonises me most", d: "agonising me most", e: "No correction required" },
            ans: "c",
            expl: "<strong>(c) agonises me most:</strong> In declarative sentences functioning as noun clauses, standard subject-verb word order is used ('What agonises me')."
        },
        {
            q: "<u>All his answers were correct.</u>",
            options: { a: "His every answers", b: "His all answers", c: "All of his answers", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The construction 'All + possessive adjective + plural noun' is completely grammatically correct."
        },
        {
            q: "He gave me an old <u>scissor</u>.",
            options: { a: "old scissor", b: "an old scissors", c: "a pair of old scissors", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) a pair of old scissors:</strong> 'Scissors' is always plural. To count them, you must use 'a pair of'."
        },
        {
            q: "His trousers are <u>three sizes large</u>.",
            options: { a: "three sizes too large", b: "three size", c: "three sizes over", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) three sizes too large:</strong> The adverb 'too' is required to indicate that the size is excessively large."
        },
        {
            q: "There is a shortage of well qualified teachers of most subjects, <u>specially</u> of English and Economics.",
            options: { a: "especially of", b: "especially in", c: "in special of", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) especially of:</strong> 'Especially' means particularly or above all, whereas 'specially' means for a specific purpose."
        },
        {
            q: "<u>The more they earn, more they spend.</u>",
            options: { a: "More they earn, more they spend", b: "More they earn, the more they spend", c: "The more they earn, the more they spend", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) The more they earn, the more they spend:</strong> Parallel comparatives always require the definite article 'the' before both comparatives."
        },
        {
            q: "It is easier <u>walking than run</u>.",
            options: { a: "easier walking to running", b: "easier to walk than to run", c: "easier walking than running", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) easier to walk than to run:</strong> Both elements being compared must be in the same form (infinitive to infinitive, or gerund to gerund)."
        },
        {
            q: "Whenever my students come across new words, I ask them to <u>look for them</u> in the dictionary.",
            options: { a: "to look at them", b: "to look it up", c: "to look them up", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) to look them up:</strong> The correct phrasal verb meaning to search for information in a reference book is 'look up'."
        },
        {
            q: "He dislikes the word dislike, <u>isn't he?</u>",
            options: { a: "does he", b: "doesn't he", c: "didn't he", d: "hasn't he", e: "No correction required" },
            ans: "b",
            expl: "<strong>(b) doesn't he:</strong> The main verb 'dislikes' is present simple affirmative. The question tag must be present simple negative ('doesn't he')."
        },
        {
            q: "I asked him <u>that why he is</u> so lazy.",
            options: { a: "why is he", b: "why he was", c: "that why is he", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) why he was:</strong> In indirect speech, the conjunction 'that' is dropped before wh-words, the verb changes to past tense, and the structure reverts to subject-verb."
        },
        {
            q: "The brochure, which is being enclosed with the application form, will give you <u>information</u> that you need.",
            options: { a: "informations", b: "the information", c: "an information", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) the information:</strong> Because it specifies 'that you need', the information becomes specific and requires the definite article 'the'. ('Information' cannot be pluralized)."
        },
        {
            q: "You must <u>accustom yourself with</u> new ideas.",
            options: { a: "accustomed with", b: "accustom to", c: "accustom yourself to", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) accustom yourself to:</strong> The reflexive verb 'accustom oneself' takes the preposition 'to', not 'with'."
        }
    ];

    let currentQuestionIndex = 0;
    const userAnswers = new Array(quizData.length).fill(null);
    
    // UI Elements
    const qBody = document.getElementById('questionBody');
    const footerNav = document.getElementById('footerNav');
    const reviewSection = document.getElementById('reviewSection');
    const qText = document.getElementById('questionText');
    const optsContainer = document.getElementById('optionsContainer');
    const explBox = document.getElementById('explanationBox');
    const progBar = document.getElementById('progressBar');
    const qCount = document.getElementById('questionCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function loadQuestion(index) {
        const qData = quizData[index];
        
        // Update Metadata
        qCount.innerText = `Question ${index + 1} of ${quizData.length}`;
        progBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
        
        // Load Question content
        qText.innerHTML = `${index + 1}. ${qData.q}`;
        optsContainer.innerHTML = '';
        explBox.style.display = 'none';
        
        // Dynamically Generate Options
        for (const [key, value] of Object.entries(qData.options)) {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `(${key}) ${value}`;
            
            // Re-render states if already answered
            if (userAnswers[index]) {
                btn.disabled = true;
                if (key === qData.ans) {
                    btn.classList.add('correct');
                } else if (key === userAnswers[index] && key !== qData.ans) {
                    btn.classList.add('wrong');
                }
            } else {
                btn.onclick = () => selectAnswer(key, btn);
            }
            optsContainer.appendChild(btn);
        }

        // Display explanation if previously answered
        if (userAnswers[index]) {
            explBox.innerHTML = qData.expl;
            explBox.style.display = 'block';
        }

        // Toggle Buttons
        prevBtn.disabled = index === 0;
        if (index === quizData.length - 1) {
            nextBtn.innerText = 'Finish & Review';
        } else {
            nextBtn.innerText = 'Next';
        }
    }

    function selectAnswer(selectedKey, btnElement) {
        const qData = quizData[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = selectedKey;
        
        // Disable all and evaluate logic
        const allBtns = optsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => {
            btn.disabled = true;
            const btnKey = btn.innerText.match(/\((.)\)/)[1];
            
            if (btnKey === qData.ans) {
                btn.classList.add('correct');
            }
        });

        // Add wrong styling if error made
        if (selectedKey !== qData.ans) {
            btnElement.classList.add('wrong');
        }

        // Reveal explanation
        explBox.innerHTML = qData.expl;
        explBox.style.display = 'block';
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion(currentQuestionIndex);
        } else {
            showReview();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion(currentQuestionIndex);
        }
    }

    function showReview() {
        qBody.style.display = 'none';
        footerNav.style.display = 'none';
        reviewSection.style.display = 'block';

        let score = 0;
        let reviewHTML = '';

        quizData.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            const isCorrect = (userAns === q.ans);
            if (isCorrect) score++;

            reviewHTML += `
                <div class="review-item">
                    <div class="review-q-text">${idx + 1}. ${q.q}</div>
                    <div class="review-ans ${userAns ? (isCorrect ? 'text-correct' : 'text-wrong') : 'text-neutral'}">
                        Your Answer: ${userAns ? `(${userAns}) ${q.options[userAns]}` : 'Not Attempted'}
                    </div>
                    ${!isCorrect ? `<div class="review-ans text-correct">Correct Answer: (${q.ans}) ${q.options[q.ans]}</div>` : ''}
                    <div class="review-expl">${q.expl}</div>
                </div>
            `;
        });

        // Add Score Card at the top
        const scoreCard = `
            <div class="score-card">
                You scored ${score} out of ${quizData.length}
            </div>
        `;
        
        // Add Restart button at the bottom
        const restartBtn = `
            <div style="text-align: center; margin-top: 30px;">
                <button class="nav-btn primary-btn" onclick="location.reload()" style="padding: 15px 30px; font-size: 1.1rem;">Restart Test</button>
            </div>
        `;

        reviewSection.innerHTML = scoreCard + reviewHTML + restartBtn;
        window.scrollTo(0, 0); // Scroll to top for review
    }

    // Trigger on mount
    loadQuestion(0);
</script>

</body>
</html>
