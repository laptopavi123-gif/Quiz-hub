<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC/Banking - Sentence Improvement Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f8fafc;
            --bg-panel: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--bg-panel);
            max-width: 850px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h2 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; }

        .progress-container {
            background: #e0e7ff;
            height: 8px;
            width: 100%;
        }

        .progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Question View Styles --- */
        .question-body { padding: 40px; min-height: 400px; }

        .question-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #1e293b;
        }

        .question-text u {
            text-decoration-color: var(--primary);
            text-decoration-thickness: 3px;
            padding-bottom: 2px;
        }

        .options-list { display: flex; flex-direction: column; gap: 14px; }

        .option-btn {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 22px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .option-btn:disabled { cursor: default; }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--wrong-text);
        }

        .explanation {
            margin-top: 30px;
            background: #f8fafc;
            border-left: 5px solid var(--primary);
            padding: 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.4s ease;
            color: #334155;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .explanation strong { color: var(--primary); }

        .footer-nav {
            padding: 20px 40px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
        }

        .nav-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background: var(--border-color);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .nav-btn:hover:not(:disabled) { background: #cbd5e1; }
        .nav-btn.primary-btn { background: var(--primary); color: white; }
        .nav-btn.primary-btn:hover:not(:disabled) { background: var(--primary-hover); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* --- Final Result Dashboard Styles --- */
        .result-body {
            display: none;
            padding: 40px;
            background: #f8fafc;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .dashboard-header h3 {
            font-size: 2rem;
            color: var(--text-main);
            margin: 0 0 10px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .val-total { color: var(--primary); }
        .val-correct { color: #16a34a; }
        .val-wrong { color: #dc2626; }
        .val-acc { color: #d97706; }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .review-card {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .review-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
        }

        .review-card.is-correct::before { background: #22c55e; }
        .review-card.is-wrong::before { background: #ef4444; }
        .review-card.is-skipped::before { background: #94a3b8; }

        .r-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .r-answer-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .r-row {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .icon { margin-right: 8px; font-size: 1.1rem; }

        .r-explanation {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .question-body, .result-body { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Sentence Improvement Practice Test</h2>
    </div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Interface for Answering Questions -->
    <div class="question-body" id="questionBody">
        <div class="question-meta">
            <span id="questionCount">Question 1 of 35</span>
            <span>SSC / Bank Pattern</span>
        </div>
        
        <div class="question-text" id="questionText"></div>
        <div class="options-list" id="optionsContainer"></div>
        <div class="explanation" id="explanationBox"></div>
    </div>

    <div class="footer-nav" id="footerNav">
        <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" disabled>Previous</button>
        <button class="nav-btn primary-btn" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>

    <!-- Interface for Final Results -->
    <div class="result-body" id="resultBody">
        <div class="dashboard-header">
            <h3>Performance Dashboard</h3>
            <p style="color: var(--text-muted);">Review your answers and explanations below.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value val-total" id="statTotal">0</div>
                <div class="stat-label">Total Questions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-correct" id="statCorrect">0</div>
                <div class="stat-label">Correct Answers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-wrong" id="statWrong">0</div>
                <div class="stat-label">Incorrect Answers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-acc" id="statAcc">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>

        <div class="review-list" id="reviewList">
            <!-- Review cards injected here via JS -->
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <button class="nav-btn primary-btn" onclick="location.reload()" style="padding: 16px 40px; font-size: 1.1rem;">Restart Practice</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "Each village adopted by the club was <u>provided by</u> electric supply.",
            options: { a: "provided", b: "provided with", c: "provided for", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) provided with:</strong> The correct preposition to use after the verb 'provide' when indicating what is being supplied is 'with' (e.g., provide someone with something)."
        },
        {
            q: "Sports <u>is good to</u> health.",
            options: { a: "is good for health", b: "are good to health", c: "are good for health", e: "No improvement" },
            ans: "a",
            expl: "<strong>(a) is good for health:</strong> When used as a singular general concept (the activity of sports), 'is' is acceptable. More importantly, the correct preposition is 'good for', not 'good to'."
        },
        {
            q: "Even more than my father was she intolerant of demonstrativeness and the wearing of one's heart <u>on his sleeve</u>.",
            options: { a: "on the sleeve", b: "on one's sleeve", c: "on her sleeve", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) on one's sleeve:</strong> The idiom is 'to wear one's heart on one's sleeve'. Since the sentence uses the indefinite pronoun 'one's heart', it must correctly match with 'one's sleeve'."
        },
        {
            q: "He is in the habit of purchasing the <u>very good</u> of all the things available.",
            options: { a: "the most good", b: "the better", c: "the very better", d: "the best" },
            ans: "d",
            expl: "<strong>(d) the best:</strong> When comparing 'all the things' (more than two), the superlative degree 'the best' must be used instead of the positive degree 'very good'."
        },
        {
            q: "I suggest that he <u>study</u> medicine.",
            options: { a: "will study", b: "studies", c: "studied", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The verb 'suggest' followed by a 'that' clause triggers the subjunctive mood, which requires the base form of the verb ('study') regardless of the subject."
        },
        {
            q: "I was <u>attacked by</u> malaria.",
            options: { a: "attacked with", b: "afflicted by", c: "afflicted with", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) afflicted with:</strong> In formal English, people are 'afflicted with' a disease, illness, or condition. 'Attacked by' is not idiomatic for diseases."
        },
        {
            q: "The baby was left <u>in charge of</u> a neighbour.",
            options: { a: "to care of", b: "to care for", c: "in the charge of", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) in the charge of:</strong> The phrase 'in the charge of' means under the care or supervision of someone."
        },
        {
            q: "She asked me if I knew a person who could teach her French. I said I <u>wasn't</u>.",
            options: { a: "do not know", b: "didn't", c: "hadn't", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) didn't:</strong> The reply must match the auxiliary verb of the original question ('if I knew' -> past tense). Therefore, 'I didn't (know)' is the correct parallel response."
        },
        {
            q: "He found the gold coin as he <u>cleans</u> the floor.",
            options: { a: "while he cleans", b: "as he had cleaning", c: "as he was cleaning", d: "while cleaning", e: "No correction required" },
            ans: "c",
            expl: "<strong>(c) as he was cleaning:</strong> The first clause is in the past tense ('found'). The action of cleaning was ongoing in the past when the coin was found, requiring the past continuous tense."
        },
        {
            q: "His salary is not adequate for him to <u>make the both ends meet</u>.",
            options: { a: "make both ends meet", b: "make both the ends meet", c: "make both his ends meet", d: "No correction required" },
            ans: "a",
            expl: "<strong>(a) make both ends meet:</strong> The correct and fixed English idiom is 'make both ends meet'. It does not take the definite article 'the'."
        },
        {
            q: "An accident took place <u>early today morning</u>.",
            options: { a: "this morning", b: "morning today", c: "at the morning", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) this morning:</strong> The standard English expression to refer to the morning of the current day is 'this morning', not 'today morning'."
        },
        {
            q: "The engagement ceremony <u>took place</u> in this very hotel last Sunday.",
            options: { a: "was took place", b: "did take place", c: "was taken place", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The phrasal verb 'took place' is in the active voice and is the correct past tense form for an event happening."
        },
        {
            q: "After a few minutes the unconscious boxer began to come <u>out</u>.",
            options: { a: "up", b: "round", c: "on", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) round:</strong> The phrasal verb 'come round' (or 'come around') means to recover consciousness."
        },
        {
            q: "He has frightened many a people <u>by his gun</u>.",
            options: { a: "by gun", b: "by a gun", c: "with his gun", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) with his gun:</strong> When an instrument or tool is used to perform an action, the correct preposition is 'with' (with a gun, with a knife, etc.)."
        },
        {
            q: "The farmer's way of life can be <u>contrasted to</u> that of the factory worker.",
            options: { a: "constrasted for", b: "contrasted against", c: "contrasted with", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) contrasted with:</strong> The verb 'contrast' is standardly followed by the preposition 'with' when comparing two differing things."
        },
        {
            q: "The winter was <u>such severe</u> that even water in the taps was frozen.",
            options: { a: "severe such", b: "so severe", c: "severe so much", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) so severe:</strong> The correct structure to express cause and effect with an adjective is 'so + adjective + that' (so severe that...)."
        },
        {
            q: "More than one person <u>was killed</u> in the accident.",
            options: { a: "have been killed", b: "were killed", c: "are killed", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> Despite its plural meaning, the grammatical construction 'More than one' is always followed by a singular noun and a singular verb ('was')."
        },
        {
            q: "To succeed in a difficult task, <u>persistent is needed</u>.",
            options: { a: "persistence was needed", b: "persistence is what one needs", c: "one needs to be persistent", d: "persistence should have needed", e: "No correction required" },
            ans: "c",
            expl: "<strong>(c) one needs to be persistent:</strong> The sentence begins with a modifying infinitive phrase ('To succeed...'). The subject immediately following it must logically be the person who will succeed ('one'), fixing the dangling modifier."
        },
        {
            q: "He didn't believe in God <u>but</u> he went to church regularly.",
            options: { a: "however", b: "nevertheless", c: "yet", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The conjunction 'but' correctly and effectively connects these two contrasting independent clauses."
        },
        {
            q: "Is your <u>brother yet at</u> the university?",
            options: { a: "brother still at", b: "brother continue at", c: "brother till at", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) brother still at:</strong> 'Still' is used in questions and positive sentences to ask about an ongoing situation. 'Yet' is usually used for expected completions in negative sentences or questions."
        },
        {
            q: "The farewell <u>took place</u> last Sunday.",
            options: { a: "was took place", b: "was taken place", c: "did take place", d: "No correction required" },
            ans: "d",
            expl: "<strong>(d) No correction required:</strong> 'Took place' is grammatically correct as an active past-tense verb phrase for an event."
        },
        {
            q: "<u>I, your brother and you</u> will be partners in the business.",
            options: { a: "I, you and your brother", b: "You, your brother and I", c: "You, I and your brother", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) You, your brother and I:</strong> When singular pronouns of different persons are joined, the polite grammatical rule is to use the order 231 (Second person, Third person, First person)."
        },
        {
            q: "We demonstrated to them how we <u>were prepared</u> the artistic patterns.",
            options: { a: "are prepared", b: "have prepared", c: "are preparing", d: "had prepared", e: "No correction required" },
            ans: "d",
            expl: "<strong>(d) had prepared:</strong> The demonstration happened in the past ('demonstrated'). The preparation happened before the demonstration, necessitating the past perfect tense ('had prepared')."
        },
        {
            q: "I prefer football <u>for</u> cricket.",
            options: { a: "to", b: "than", c: "from", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) to:</strong> The verb 'prefer' is always followed by the preposition 'to' when comparing two items (e.g., prefer X to Y)."
        },
        {
            q: "Mr. Dewan has driven almost thrice <u>so far as</u> Mr. Gupta has.",
            options: { a: "as far", b: "as far as", c: "as much as", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) as far as:</strong> The correct structure for positive equality or comparative degree with multipliers is 'as + adjective + as' (thrice as far as)."
        },
        {
            q: "While we would like <u>that all Indian children to go</u> to school, we need to ponder why they do not.",
            options: { a: "all Indian children", b: "that all the Indian children", c: "if all the children of India", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) all Indian children:</strong> The verb 'like' followed by an infinitive does not take the conjunction 'that'. The correct structure is 'would like someone to do something'."
        },
        {
            q: "<u>Scarcely had he left</u> when his friend came.",
            options: { a: "He had scarcely left", b: "He had left scarcely", c: "He scarcely had left", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> When a sentence begins with a negative adverb like 'Scarcely', it correctly takes inverted word order (auxiliary verb before the subject)."
        },
        {
            q: "A highly improved variety of seeds <u>is</u> available to the farmer these days.",
            options: { a: "has been", b: "are", c: "will be", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The subject of the sentence is the singular noun 'variety' (of seeds), which correctly takes the singular verb 'is'."
        },
        {
            q: "It is essential to <u>thoroughly clean</u> the machine after each use.",
            options: { a: "to thorough clean", b: "to clean thorough", c: "to thorough clean", d: "to thoroughly cleaning", e: "No correction required" },
            ans: "e",
            expl: "<strong>(e) No correction required:</strong> While splitting an infinitive ('to thoroughly clean') is sometimes frowned upon by strict traditionalists, it is widely accepted in modern English and is the best available option here."
        },
        {
            q: "He felt like a character in a story book <u>which had gazed out</u> for a moment in his brief, imagined life at the real world.",
            options: { a: "that gazed out", b: "who did gaze out", c: "who had gazed out", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) who had gazed out:</strong> The relative pronoun refers to 'a character' (a person). Therefore, 'who' must be used instead of 'which'."
        },
        {
            q: "I have got some tea, but I do not have <u>a</u> sugar.",
            options: { a: "some", b: "any", c: "more", d: "got", e: "No correction required" },
            ans: "b",
            expl: "<strong>(b) any:</strong> 'Sugar' is an uncountable noun and cannot take the indefinite article 'a'. In a negative clause ('do not have'), the determiner 'any' is used."
        },
        {
            q: "Tell your leader that I grant him permission <u>of stay</u> in my kingdom.",
            options: { a: "for stay", b: "about staying", c: "to stay", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) to stay:</strong> The noun 'permission' is idiomatically followed by an infinitive verb phrase (permission to do something)."
        },
        {
            q: "I was delighted to see <u>him fully recover</u>.",
            options: { a: "he full recovered", b: "him fully recovered", c: "his full recovery", d: "No correction required" },
            ans: "d",
            expl: "<strong>(d) No correction required:</strong> The structure 'see + object + bare infinitive' is perfectly grammatically sound (e.g., I saw him cross the street)."
        },
        {
            q: "I told him what to do and how <u>he does it</u>.",
            options: { a: "should he do it", b: "to do it", c: "should it be done", d: "he did it", e: "No correction required" },
            ans: "b",
            expl: "<strong>(b) to do it:</strong> For sentence balance and parallelism, the structure 'what to do' must be matched with 'how to do it'."
        },
        {
            q: "Each of our students <u>pay their</u> tuition fee at the beginning of the month.",
            options: { a: "student pay their", b: "student pays their", c: "students pays his", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) students pays his:</strong> The structure 'Each of' requires a plural noun ('students'), but acts as a singular subject taking a singular verb ('pays') and a singular possessive pronoun ('his/her')."
        }
    ];

    let currentQuestionIndex = 0;
    const userAnswers = new Array(quizData.length).fill(null);
    
    // UI Elements
    const qBody = document.getElementById('questionBody');
    const footerNav = document.getElementById('footerNav');
    const resultBody = document.getElementById('resultBody');
    const qText = document.getElementById('questionText');
    const optsContainer = document.getElementById('optionsContainer');
    const explBox = document.getElementById('explanationBox');
    const progBar = document.getElementById('progressBar');
    const qCount = document.getElementById('questionCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function loadQuestion(index) {
        const qData = quizData[index];
        
        qCount.innerText = `Question ${index + 1} of ${quizData.length}`;
        progBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
        
        qText.innerHTML = `${index + 1}. ${qData.q}`;
        optsContainer.innerHTML = '';
        explBox.style.display = 'none';
        
        for (const [key, value] of Object.entries(qData.options)) {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `(${key}) ${value}`;
            
            if (userAnswers[index]) {
                btn.disabled = true;
                if (key === qData.ans) {
                    btn.classList.add('correct');
                } else if (key === userAnswers[index] && key !== qData.ans) {
                    btn.classList.add('wrong');
                }
            } else {
                btn.onclick = () => selectAnswer(key, btn);
            }
            optsContainer.appendChild(btn);
        }

        if (userAnswers[index]) {
            explBox.innerHTML = qData.expl;
            explBox.style.display = 'block';
        }

        prevBtn.disabled = index === 0;
        nextBtn.innerText = index === quizData.length - 1 ? 'Finish & View Results' : 'Next';
    }

    function selectAnswer(selectedKey, btnElement) {
        const qData = quizData[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = selectedKey;
        
        const allBtns = optsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => {
            btn.disabled = true;
            const btnKey = btn.innerText.match(/\((.)\)/)[1];
            if (btnKey === qData.ans) btn.classList.add('correct');
        });

        if (selectedKey !== qData.ans) btnElement.classList.add('wrong');

        explBox.innerHTML = qData.expl;
        explBox.style.display = 'block';
        
        // Auto Scroll Feature
        setTimeout(() => {
            footerNav.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 150);
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion(currentQuestionIndex);
        } else {
            showFinalResults();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion(currentQuestionIndex);
        }
    }

    function showFinalResults() {
        qBody.style.display = 'none';
        footerNav.style.display = 'none';
        resultBody.style.display = 'block';

        let correct = 0;
        let wrong = 0;
        let skipped = 0;
        let reviewHTML = '';

        quizData.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            let isCorrect = false;
            let cardClass = '';
            let userIcon = '';
            
            if (!userAns) {
                skipped++;
                cardClass = 'is-skipped';
                userIcon = '<span class="icon" style="color:#94a3b8;">➖</span>';
            } else if (userAns === q.ans) {
                correct++;
                isCorrect = true;
                cardClass = 'is-correct';
                userIcon = '<span class="icon" style="color:#22c55e;">✅</span>';
            } else {
                wrong++;
                cardClass = 'is-wrong';
                userIcon = '<span class="icon" style="color:#ef4444;">❌</span>';
            }

            reviewHTML += `
                <div class="review-card ${cardClass}">
                    <div class="r-question">Q${idx + 1}. ${q.q}</div>
                    <div class="r-answer-block">
                        <div class="r-row ${isCorrect ? 'text-correct' : (userAns ? 'text-wrong' : 'text-muted')}">
                            ${userIcon} Your Answer: ${userAns ? `(${userAns}) ${q.options[userAns]}` : 'Skipped'}
                        </div>
                        ${!isCorrect ? `
                        <div class="r-row text-correct">
                            <span class="icon">🎯</span> Correct Answer: (${q.ans}) ${q.options[q.ans]}
                        </div>` : ''}
                    </div>
                    <div class="r-explanation">${q.expl}</div>
                </div>
            `;
        });

        const total = quizData.length;
        const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

        document.getElementById('statTotal').innerText = total;
        document.getElementById('statCorrect').innerText = correct;
        document.getElementById('statWrong').innerText = wrong;
        document.getElementById('statAcc').innerText = `${accuracy}%`;
        
        document.getElementById('reviewList').innerHTML = reviewHTML;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize Quiz
    loadQuestion(0);
</script>

</body>
</html>
