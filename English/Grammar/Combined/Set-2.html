<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC/Banking - Sentence Improvement Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f8fafc;
            --bg-panel: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--bg-panel);
            max-width: 850px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h2 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; }

        .progress-container {
            background: #e0e7ff;
            height: 8px;
            width: 100%;
        }

        .progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Question View Styles --- */
        .question-body { padding: 40px; min-height: 400px; }

        .question-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #1e293b;
        }

        .question-text u {
            text-decoration-color: var(--primary);
            text-decoration-thickness: 3px;
            padding-bottom: 2px;
        }

        .options-list { display: flex; flex-direction: column; gap: 14px; }

        .option-btn {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 22px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .option-btn:disabled { cursor: default; }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--wrong-text);
        }

        .explanation {
            margin-top: 30px;
            background: #f8fafc;
            border-left: 5px solid var(--primary);
            padding: 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.4s ease;
            color: #334155;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .explanation strong { color: var(--primary); }

        .footer-nav {
            padding: 20px 40px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
        }

        .nav-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background: var(--border-color);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .nav-btn:hover:not(:disabled) { background: #cbd5e1; }
        .nav-btn.primary-btn { background: var(--primary); color: white; }
        .nav-btn.primary-btn:hover:not(:disabled) { background: var(--primary-hover); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* --- Final Result Dashboard Styles --- */
        .result-body {
            display: none;
            padding: 40px;
            background: #f8fafc;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .dashboard-header h3 {
            font-size: 2rem;
            color: var(--text-main);
            margin: 0 0 10px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .val-total { color: var(--primary); }
        .val-correct { color: #16a34a; }
        .val-wrong { color: #dc2626; }
        .val-acc { color: #d97706; }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .review-card {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .review-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
        }

        .review-card.is-correct::before { background: #22c55e; }
        .review-card.is-wrong::before { background: #ef4444; }
        .review-card.is-skipped::before { background: #94a3b8; }

        .r-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .r-answer-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .r-row {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .icon { margin-right: 8px; font-size: 1.1rem; }

        .r-explanation {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .question-body, .result-body { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Sentence Improvement Exam Practice</h2>
    </div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Interface for Answering Questions -->
    <div class="question-body" id="questionBody">
        <div class="question-meta">
            <span id="questionCount">Question 1 of 29</span>
            <span>SSC / Bank Pattern</span>
        </div>
        
        <div class="question-text" id="questionText"></div>
        <div class="options-list" id="optionsContainer"></div>
        <div class="explanation" id="explanationBox"></div>
    </div>

    <div class="footer-nav" id="footerNav">
        <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" disabled>Previous</button>
        <button class="nav-btn primary-btn" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>

    <!-- Interface for Final Results -->
    <div class="result-body" id="resultBody">
        <div class="dashboard-header">
            <h3>Performance Dashboard</h3>
            <p style="color: var(--text-muted);">Review your answers and explanations below.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value val-total" id="statTotal">0</div>
                <div class="stat-label">Total Questions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-correct" id="statCorrect">0</div>
                <div class="stat-label">Correct Answers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-wrong" id="statWrong">0</div>
                <div class="stat-label">Incorrect Answers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-acc" id="statAcc">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>

        <div class="review-list" id="reviewList">
            <!-- Review cards injected here via JS -->
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <button class="nav-btn primary-btn" onclick="location.reload()" style="padding: 16px 40px; font-size: 1.1rem;">Restart Practice</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "Can you tell me <u>why did you not speak</u> the truth?",
            options: { a: "why did not you speak", b: "that why did you not speak", c: "why you did not speak", d: "why did you not spoke", e: "No improvement" },
            ans: "c",
            expl: "<strong>(c) why you did not speak:</strong> In an indirect question embedded within a sentence, the word order must be assertive (Subject + Verb), not interrogative (Auxiliary + Subject)."
        },
        {
            q: "The boy <u>which</u> came to see me this morning had come from Agra.",
            options: { a: "that", b: "whom", c: "who", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) who:</strong> The relative pronoun 'who' is used for human subjects. 'Which' is used for animals or objects."
        },
        {
            q: "The partners swore <u>from fighting again</u>.",
            options: { a: "not fighting again", b: "by not to fight again", c: "that they wouldn't fight again", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) that they wouldn't fight again:</strong> The correct idiomatic construction for taking an oath is to swear 'that' someone will/won't do something, or swear 'to do' something. 'Swore from' is grammatically incorrect."
        },
        {
            q: "Not till he got home <u>he did realise</u> that he had lost his keys in the theatre.",
            options: { a: "did he realise", b: "he did not realise", c: "he realised", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) did he realise:</strong> When a sentence begins with a negative adverbial phrase like 'Not till...', the law of inversion applies, requiring the auxiliary verb to precede the subject (did he)."
        },
        {
            q: "Please remind me <u>of posting</u> these letters of my relatives.",
            options: { a: "for posting", b: "to post", c: "by posting", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) to post:</strong> To ensure someone doesn't forget a future action, the correct structure is 'remind someone to do something' (infinitive)."
        },
        {
            q: "Had we been on time, we <u>would not have missed</u> the train.",
            options: { a: "will not have", b: "might have", c: "would have been", d: "had not", e: "No correction required" },
            ans: "e",
            expl: "<strong>(e) No correction required:</strong> This is a perfectly correct Type 3 conditional sentence (Past Unreal). Structure: Had + Subject + V3, Subject + would have + V3."
        },
        {
            q: "When we saw him last, he <u>ran</u> to catch a bus.",
            options: { a: "was running", b: "has run", c: "had run", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) was running:</strong> The sentence describes an action that was in continuous progress at the specific moment 'when we saw him', necessitating the past continuous tense."
        },
        {
            q: "If you get confused while performing the act, just <u>don't stop to try</u>.",
            options: { a: "keep your try on", b: "continue your tries", c: "not give up trying", d: "keep on trying", e: "No correction required" },
            ans: "d",
            expl: "<strong>(d) keep on trying:</strong> Idiomatically, 'keep on trying' is the most natural and standard phrase used to encourage someone to persist."
        },
        {
            q: "It was indeed a shock for her, but she has <u>later</u> recovered from it.",
            options: { a: "afterwards", b: "since", c: "then", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) since:</strong> 'Has since recovered' is the standard usage with the present perfect tense to indicate an action completed between a past event (the shock) and now."
        },
        {
            q: "I must study my books <u>today as I have to give</u> an examination tomorrow.",
            options: { a: "for I have to give", b: "since I have to give", c: "as I have to take", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) as I have to take:</strong> <em>(Note: The original book had a typo printing 'to Jay' instead of 'today')</em>. In English, students 'take' an examination, whereas teachers 'give' or 'administer' it."
        },
        {
            q: "Anybody would <u>like assist you for improvement in</u> the work.",
            options: { a: "you like to assist", b: "like assist to you", c: "like to assist you", d: "No correction required" },
            ans: "c",
            expl: "<strong>(c) like to assist you:</strong> The verb 'like' is properly followed by an infinitive ('to assist') in this context. 'Assist' takes a direct object ('you') without prepositions."
        },
        {
            q: "<u>Due to these reasons</u> we are all in favour of universal compulsory education.",
            options: { a: "By these reasons", b: "For these reasons", c: "Out of these reasons", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) For these reasons:</strong> 'Due to' functions as an adjective phrase modifying a noun. To modify the entire clause or verb, the adverbial phrase 'For these reasons' is grammatically accurate."
        },
        {
            q: "He has very good command <u>on</u> English.",
            options: { a: "of", b: "over", c: "in", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) over:</strong> The correct preposition to express authority, mastery, or fluency regarding a language or subject is 'command over'."
        },
        {
            q: "Many a <u>young man have served his</u> country nobly.",
            options: { a: "young men have served their", b: "young men have served his", c: "young man has served his", d: "No correction required" },
            ans: "c",
            expl: "<strong>(c) young man has served his:</strong> The phrase 'Many a' grammatically functions as a singular subject modifier. Therefore, it must be followed by a singular noun ('man') and a singular verb ('has')."
        },
        {
            q: "I am <u>looking forward to see</u> you soon.",
            options: { a: "looking forward towards seeing", b: "looking forward for seeing", c: "looking forward to seeing", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) looking forward to seeing:</strong> The phrasal verb 'look forward to' ends with a preposition ('to'). Prepositions must be followed by a noun or a gerund ('seeing')."
        },
        {
            q: "His colleagues could not tell me <u>why did he not come</u> to office yesterday.",
            options: { a: "why not had he come", b: "why he did not come", c: "why had he not come", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) why he did not come:</strong> Because this is an indirect question, the word order after the question word 'why' must be an assertive Subject + Verb order."
        },
        {
            q: "I waited for half an hour for my friend, but he didn't <u>turn in</u>.",
            options: { a: "turn about", b: "turn around", c: "turn up", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) turn up:</strong> The phrasal verb 'turn up' means to arrive or appear, which fits the context perfectly. 'Turn in' usually means to submit something or go to bed."
        },
        {
            q: "I will now deal with him in a manner different from the one <u>I have adopted</u> so far.",
            options: { a: "I adopted", b: "I was adopting", c: "I have been adopting", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The present perfect tense ('have adopted') is completely correct here, as 'so far' connects a past action that continues to hold relevance in the present."
        },
        {
            q: "I shall not go <u>until I am invited</u>.",
            options: { a: "if not I am invited", b: "till I am invited", c: "unless I am invited", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) unless I am invited:</strong> 'Until' is used for time limits. Because this is a condition (going is dependent on the action of being invited), 'unless' is the correct conjunction."
        },
        {
            q: "Our departure from this place now depends on <u>their coming here</u>.",
            options: { a: "they come", b: "them coming", c: "they coming", d: "their's coming", e: "No correction required" },
            ans: "e",
            expl: "<strong>(e) No correction required:</strong> A gerund ('coming') is a noun, and therefore must be preceded by a possessive adjective ('their'), making the sentence perfectly correct."
        },
        {
            q: "He should <u>not had done</u> it.",
            options: { a: "should had not", b: "should not have", c: "should have", d: "had not", e: "No correction required" },
            ans: "b",
            expl: "<strong>(b) should not have:</strong> Modal verbs (should, could, would) are always followed by the base form of the verb. Therefore, 'have' is correct, and 'had' is grammatically impossible."
        },
        {
            q: "Ramakrishna <u>availed himself of</u> all the leave to his credit.",
            options: { a: "availed of", b: "availed to", c: "availed", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The verb 'avail' is reflexive and must be followed by a reflexive pronoun (himself, myself, etc.) and the preposition 'of'."
        },
        {
            q: "The assistant was asked <u>that why he was</u> generally late.",
            options: { a: "why was he", b: "why that he was", c: "why he was", d: "that why he had been" },
            ans: "c",
            expl: "<strong>(c) why he was:</strong> In reported speech (indirect questions), the conjunction 'that' is never used before a Wh-question word like 'why', 'where', or 'what'."
        },
        {
            q: "After the heavy rains last week, the water in the lake <u>raised another two feet</u>.",
            options: { a: "would raise another two feet.", b: "rised another two feet", c: "rose another two feet", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) rose another two feet:</strong> 'Raise' is a transitive verb requiring an object (e.g., raise your hand). 'Rise' (past tense: rose) is intransitive and describes something moving up on its own, like water levels."
        },
        {
            q: "It was quite clear that the runner <u>could be able to</u> improve upon his own record.",
            options: { a: "will be able", b: "should be able", c: "would be able", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) would be able:</strong> 'Could' and 'be able to' mean the exact same thing, making their combination redundant. The past tense of 'will be able' is 'would be able', which fits the past tense context of the sentence."
        },
        {
            q: "With a thundering roar the huge rocket <u>soared up</u> from the launching pad.",
            options: { a: "took off", b: "went upwards", c: "flew up", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) took off:</strong> 'Took off' is the most precise and idiomatic phrasal verb used for an aircraft or rocket leaving the ground."
        },
        {
            q: "My elder sister and her daughter <u>helps me in</u> my domestic work.",
            options: { a: "helps me for", b: "help me in", c: "help me about", d: "helped me about", e: "No correction required" },
            ans: "b",
            expl: "<strong>(b) help me in:</strong> The subject 'sister and her daughter' is compound and plural, so the verb must be plural ('help' instead of 'helps')."
        },
        {
            q: "I complimented him <u>for his</u> success in the examination.",
            options: { a: "about", b: "on", c: "at", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) on:</strong> The correct preposition to use after the verb 'compliment' is 'on' (e.g., compliment someone on something)."
        },
        {
            q: "The orphans have been clamouring for nutritious food <u>from the past</u> two weeks.",
            options: { a: "for past", b: "since the past", c: "for the past", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) for the past:</strong> When indicating a duration or period of time (two weeks) in the present perfect continuous tense, the preposition 'for' must be used instead of 'from' or 'since'."
        }
    ];

    let currentQuestionIndex = 0;
    const userAnswers = new Array(quizData.length).fill(null);
    
    // UI Elements
    const qBody = document.getElementById('questionBody');
    const footerNav = document.getElementById('footerNav');
    const resultBody = document.getElementById('resultBody');
    const qText = document.getElementById('questionText');
    const optsContainer = document.getElementById('optionsContainer');
    const explBox = document.getElementById('explanationBox');
    const progBar = document.getElementById('progressBar');
    const qCount = document.getElementById('questionCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function loadQuestion(index) {
        const qData = quizData[index];
        
        qCount.innerText = `Question ${index + 1} of ${quizData.length}`;
        progBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
        
        qText.innerHTML = `${index + 1}. ${qData.q}`;
        optsContainer.innerHTML = '';
        explBox.style.display = 'none';
        
        for (const [key, value] of Object.entries(qData.options)) {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `(${key}) ${value}`;
            
            if (userAnswers[index]) {
                btn.disabled = true;
                if (key === qData.ans) {
                    btn.classList.add('correct');
                } else if (key === userAnswers[index] && key !== qData.ans) {
                    btn.classList.add('wrong');
                }
            } else {
                btn.onclick = () => selectAnswer(key, btn);
            }
            optsContainer.appendChild(btn);
        }

        if (userAnswers[index]) {
            explBox.innerHTML = qData.expl;
            explBox.style.display = 'block';
        }

        prevBtn.disabled = index === 0;
        nextBtn.innerText = index === quizData.length - 1 ? 'Finish & View Results' : 'Next';
    }

    function selectAnswer(selectedKey, btnElement) {
        const qData = quizData[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = selectedKey;
        
        const allBtns = optsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => {
            btn.disabled = true;
            const btnKey = btn.innerText.match(/\((.)\)/)[1];
            if (btnKey === qData.ans) btn.classList.add('correct');
        });

        if (selectedKey !== qData.ans) btnElement.classList.add('wrong');

        explBox.innerHTML = qData.expl;
        explBox.style.display = 'block';
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion(currentQuestionIndex);
        } else {
            showFinalResults();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion(currentQuestionIndex);
        }
    }

    function showFinalResults() {
        qBody.style.display = 'none';
        footerNav.style.display = 'none';
        resultBody.style.display = 'block';

        let correct = 0;
        let wrong = 0;
        let skipped = 0;
        let reviewHTML = '';

        quizData.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            let isCorrect = false;
            let cardClass = '';
            let userIcon = '';
            
            if (!userAns) {
                skipped++;
                cardClass = 'is-skipped';
                userIcon = '<span class="icon" style="color:#94a3b8;">➖</span>';
            } else if (userAns === q.ans) {
                correct++;
                isCorrect = true;
                cardClass = 'is-correct';
                userIcon = '<span class="icon" style="color:#22c55e;">✅</span>';
            } else {
                wrong++;
                cardClass = 'is-wrong';
                userIcon = '<span class="icon" style="color:#ef4444;">❌</span>';
            }

            reviewHTML += `
                <div class="review-card ${cardClass}">
                    <div class="r-question">Q${idx + 1}. ${q.q}</div>
                    <div class="r-answer-block">
                        <div class="r-row ${isCorrect ? 'text-correct' : (userAns ? 'text-wrong' : 'text-muted')}">
                            ${userIcon} Your Answer: ${userAns ? `(${userAns}) ${q.options[userAns]}` : 'Skipped'}
                        </div>
                        ${!isCorrect ? `
                        <div class="r-row text-correct">
                            <span class="icon">🎯</span> Correct Answer: (${q.ans}) ${q.options[q.ans]}
                        </div>` : ''}
                    </div>
                    <div class="r-explanation">${q.expl}</div>
                </div>
            `;
        });

        const total = quizData.length;
        const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

        document.getElementById('statTotal').innerText = total;
        document.getElementById('statCorrect').innerText = correct;
        document.getElementById('statWrong').innerText = wrong;
        document.getElementById('statAcc').innerText = `${accuracy}%`;
        
        document.getElementById('reviewList').innerHTML = reviewHTML;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize Quiz
    loadQuestion(0);
</script>

</body>
</html>
