<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC/Banking - Sentence Improvement Quiz - Practice Set 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f8fafc;
            --bg-panel: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--bg-panel);
            max-width: 850px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h2 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; }

        .progress-container {
            background: #e0e7ff;
            height: 8px;
            width: 100%;
        }

        .progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Question View Styles --- */
        .question-body { padding: 40px; min-height: 400px; }

        .question-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #1e293b;
        }

        .question-text u {
            text-decoration-color: var(--primary);
            text-decoration-thickness: 3px;
            padding-bottom: 2px;
        }

        .options-list { display: flex; flex-direction: column; gap: 14px; }

        .option-btn {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 22px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .option-btn:disabled { cursor: default; }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--wrong-text);
        }

        .explanation {
            margin-top: 30px;
            background: #f8fafc;
            border-left: 5px solid var(--primary);
            padding: 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.4s ease;
            color: #334155;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .explanation strong { color: var(--primary); }

        .footer-nav {
            padding: 20px 40px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
        }

        .nav-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background: var(--border-color);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .nav-btn:hover:not(:disabled) { background: #cbd5e1; }
        .nav-btn.primary-btn { background: var(--primary); color: white; }
        .nav-btn.primary-btn:hover:not(:disabled) { background: var(--primary-hover); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* --- Final Result Dashboard Styles --- */
        .result-body {
            display: none;
            padding: 40px;
            background: #f8fafc;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .dashboard-header h3 {
            font-size: 2rem;
            color: var(--text-main);
            margin: 0 0 10px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .val-total { color: var(--primary); }
        .val-correct { color: #16a34a; }
        .val-wrong { color: #dc2626; }
        .val-acc { color: #d97706; }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .review-card {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .review-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
        }

        .review-card.is-correct::before { background: #22c55e; }
        .review-card.is-wrong::before { background: #ef4444; }
        .review-card.is-skipped::before { background: #94a3b8; }

        .r-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .r-answer-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .r-row {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .icon { margin-right: 8px; font-size: 1.1rem; }

        .r-explanation {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .question-body, .result-body { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Sentence Improvement - Practice Set 8</h2>
    </div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Interface for Answering Questions -->
    <div class="question-body" id="questionBody">
        <div class="question-meta">
            <span id="questionCount">Question 1 of 37</span>
            <span>SSC / Bank Pattern</span>
        </div>
        
        <div class="question-text" id="questionText"></div>
        <div class="options-list" id="optionsContainer"></div>
        <div class="explanation" id="explanationBox"></div>
    </div>

    <div class="footer-nav" id="footerNav">
        <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" disabled>Previous</button>
        <button class="nav-btn primary-btn" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>

    <!-- Interface for Final Results -->
    <div class="result-body" id="resultBody">
        <div class="dashboard-header">
            <h3>Performance Dashboard</h3>
            <p style="color: var(--text-muted);">Review your answers and explanations below.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value val-total" id="statTotal">0</div>
                <div class="stat-label">Total Questions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-correct" id="statCorrect">0</div>
                <div class="stat-label">Correct Answers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-wrong" id="statWrong">0</div>
                <div class="stat-label">Incorrect Answers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-acc" id="statAcc">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>

        <div class="review-list" id="reviewList">
            <!-- Review cards injected here via JS -->
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <button class="nav-btn primary-btn" onclick="location.reload()" style="padding: 16px 40px; font-size: 1.1rem;">Restart Practice</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "I would have waited for you at the station if I <u>knew</u> that you would come.",
            options: { a: "had known", b: "have known", c: "was knowing", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) had known:</strong> This is a Type 3 Conditional sentence, which describes an unreal situation in the past. The correct structure is: 'If + subject + past perfect (had known), subject + would have + past participle (would have waited)'."
        },
        {
            q: "I will not go <u>till he arrives</u>.",
            options: { a: "till he has arrived", b: "until he arrives", c: "unless he has arrived", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) until he arrives:</strong> While 'till' is often used informally, 'until' is the standard conjunction used to indicate time up to a certain point in formal contexts and competitive exams."
        },
        {
            q: "You <u>ought not behave</u> like that.",
            options: { a: "ought to not behave", b: "ought not to behave", c: "ought not to have behaved", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) ought not to behave:</strong> The modal verb 'ought' must always be followed by the full infinitive ('to + verb'). The correct negative formation is 'ought not to'."
        },
        {
            q: "He is not <u>in the good books of</u> his master.",
            options: { a: "in the good book", b: "into the good books", c: "in the better books", d: "in the best book", e: "No correction required" },
            ans: "e",
            expl: "<strong>(e) No correction required:</strong> To be 'in the good books of' someone is a standard, correct idiom meaning to be in someone's favor."
        },
        {
            q: "I have <u>done good</u> at the examination.",
            options: { a: "attempted well at", b: "gone well over", c: "fared well in", d: "No correction required" },
            ans: "c",
            expl: "<strong>(c) fared well in:</strong> 'Good' is an adjective and cannot modify a verb. 'Do well' would be correct, but among the given options, 'fared well in' is the most appropriate replacement to express performing successfully."
        },
        {
            q: "I need not offer any explanation regarding this incident <u>my behaviour is speaking itself</u>.",
            options: { a: "speaks about itself", b: "speaks for itself", c: "has been speaking", d: "will speak to itself" },
            ans: "b",
            expl: "<strong>(b) speaks for itself:</strong> The idiom 'speaks for itself' means that something is so clear or obvious that it requires no further explanation."
        },
        {
            q: "As soon <u>did the Manager came</u>, the clerks started typing.",
            options: { a: "was", b: "had", c: "as", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) as:</strong> The correct conjunction phrase is 'As soon as', meaning immediately after. The sentence should correctly read: 'As soon as the Manager came...'"
        },
        {
            q: "There is an endless <u>running</u> of traffic on the Delhi-Ghaziabad road.",
            options: { a: "heaviness", b: "river", c: "stream", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) stream:</strong> The standard English collocation used to describe continuous, flowing movement of vehicles is an 'endless stream of traffic'."
        },
        {
            q: "The Chinese are said <u>to have invented</u> ice-cream almost three thousand years ago.",
            options: { a: "are said that they", b: "are saying to have", c: "have been said to have", d: "had said to have", e: "No correction required" },
            ans: "e",
            expl: "<strong>(e) No correction required:</strong> The perfect infinitive ('to have invented') is correctly used here to indicate that the action of inventing happened before the present state of being 'said'."
        },
        {
            q: "This work is worse <u>by all that</u> you did.",
            options: { a: "all of you did", b: "to what you did before", c: "than what you did before", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) than what you did before:</strong> The comparative adjective 'worse' must be followed by the conjunction 'than' to form a proper comparison."
        },
        {
            q: "He may <u>have aged</u> when I last saw him.",
            options: { a: "since I saw him", b: "since I last saw him", c: "before I last saw him", d: "No correction required" },
            ans: "b",
            expl: "<strong>(b) since I last saw him:</strong> To indicate a change that has occurred between a specific point in the past and the present, the preposition 'since' is required."
        },
        {
            q: "<u>I think in my opinion</u> that all those who claim to be honest are not really so.",
            options: { a: "In my opinion, I believe", b: "It seems to me", c: "It is my believing", d: "My believing is", e: "No correction required" },
            ans: "b",
            expl: "<strong>(b) It seems to me:</strong> The phrase 'I think in my opinion' is redundant because both express a personal belief. 'It seems to me' is grammatically sound and concise."
        },
        {
            q: "It <u>was a week</u> since he came home to his mother.",
            options: { a: "is a week", b: "shall be a week", c: "has been a week", d: "had been a week", e: "No improvement" },
            ans: "c",
            expl: "<strong>(c) has been a week:</strong> When referring to a duration of time from a past event to the present using 'since + simple past', the main clause takes the present perfect tense ('has been')."
        },
        {
            q: "This project would encourage development and enable every villager <u>to govern their</u> own destiny.",
            options: { a: "to govern his", b: "to governing his", c: "may govern their", d: "have governed their", e: "No correction required" },
            ans: "a",
            expl: "<strong>(a) to govern his:</strong> The phrase 'every villager' is singular. Therefore, the possessive pronoun referring back to it must also be singular ('his' or 'her')."
        },
        {
            q: "<u>All along the journey</u> she remained silent.",
            options: { a: "All along in the journey", b: "All during the journey", c: "All through the journey", d: "Throughout all journey", e: "No correction required" },
            ans: "c",
            expl: "<strong>(c) All through the journey:</strong> 'All through' correctly means from the beginning to the end of a time or event. 'All along' is typically used for physical lines or paths, not durations like a journey."
        },
        {
            q: "He is ill <u>from</u> typhoid.",
            options: { a: "with", b: "of", c: "off", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) with:</strong> The correct preposition to use after the adjective 'ill' to specify the illness is 'with' (e.g., ill with typhoid, ill with a fever)."
        },
        {
            q: "The officer <u>whom I went</u> reported that my case was pending.",
            options: { a: "whom I went to", b: "who I went", c: "that I went to", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) whom I went to:</strong> You physically go 'to' a person. Therefore, the preposition 'to' is required to logically connect the verb 'went' with the relative pronoun 'whom'."
        },
        {
            q: "He killed the enemy by <u>his sword</u>.",
            options: { a: "by sword", b: "by a sword", c: "through his sword", d: "with his sword", e: "No improvement" },
            ans: "d",
            expl: "<strong>(d) with his sword:</strong> In English grammar, the preposition 'with' is used to indicate the tool or instrument used to perform an action, whereas 'by' indicates the doer of the action."
        },
        {
            q: "She hadn't difficulty <u>to settle down</u> to her new life in the city.",
            options: { a: "in settling down", b: "for settling down", c: "to settling down", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) in settling down:</strong> The noun 'difficulty' is correctly followed by the preposition 'in' and a gerund ('settling') when expressing trouble doing an action."
        },
        {
            q: "If I were a millionaire, I <u>would have helped</u> the poor.",
            options: { a: "can help", b: "could have helped", c: "would help", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) would help:</strong> This is a Type 2 Conditional sentence (present unreal). The structure requires 'If + past subjunctive (were), subject + would + base verb (help)'."
        },
        {
            q: "Right there she decided that she too <u>would become</u> part of that world.",
            options: { a: "also will become", b: "too will become", c: "too might become", d: "too could become", e: "No correction required" },
            ans: "e",
            expl: "<strong>(e) No correction required:</strong> The main clause 'she decided' is in the past tense. When shifting 'will become' (future intent) into the past, 'would become' is the grammatically correct future-in-the-past tense."
        },
        {
            q: "They continued to work in the field <u>despite of the</u> heavy rains.",
            options: { a: "inspite the heavy rains", b: "although heavily rains", c: "even though it rained heavily", d: "even though there is heavy rain" },
            ans: "c",
            expl: "<strong>(c) even though it rained heavily:</strong> 'Despite of' is always grammatically incorrect; it must be either 'despite' or 'in spite of'. Option (c) is the only structurally sound replacement provided."
        },
        {
            q: "They watched the sea lions <u>being fed</u> with fish.",
            options: { a: "had been fed", b: "are being fed", c: "have been fed", d: "No improvement" },
            ans: "d",
            expl: "<strong>(d) No improvement:</strong> The participial phrase 'being fed' functions correctly here as an object complement describing the action happening to the sea lions as they were watched."
        },
        {
            q: "Nelson Mandela struggled hard to get equality <u>from</u> the whites in South Africa.",
            options: { a: "for", b: "with", c: "at", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) for:</strong> The preposition 'for' is used to indicate the goal or purpose of a struggle (e.g., struggle for freedom, struggle for equality)."
        },
        {
            q: "Despite his old age, his movements were as spirited as <u>a young man</u>.",
            options: { a: "a young man's", b: "if a young man", c: "those of a young man", d: "of a young man", e: "No correction required." },
            ans: "c",
            expl: "<strong>(c) those of a young man:</strong> To ensure a parallel comparison, you must compare his 'movements' to a young man's 'movements'. The pronoun 'those' correctly replaces the plural noun 'movements'."
        },
        {
            q: "For me, journey by air is <u>preferable than</u> that by train.",
            options: { a: "much more preferable than", b: "preferable to", c: "more preferable to", d: "No correction required." },
            ans: "b",
            expl: "<strong>(b) preferable to:</strong> The adjective 'preferable' inherently contains the meaning of comparison and must be followed by the preposition 'to', never 'than' or 'more'."
        },
        {
            q: "The floor of the hall was <u>covered by</u> a carpet.",
            options: { a: "covered with", b: "covered upon", c: "covered in", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) covered with:</strong> When describing a surface that has something spread over it, the correct preposition to use after 'covered' is 'with'."
        },
        {
            q: "Taxes are high in this country, <u>aren't they?</u>",
            options: { a: "aren't taxes?", b: "don't they?", c: "do they?", d: "isn't it?", e: "No correction required" },
            ans: "e",
            expl: "<strong>(e) No correction required:</strong> The statement is positive and uses the plural subject 'taxes' and auxiliary 'are'. The correct question tag must be negative and use the matching pronoun: 'aren't they?'."
        },
        {
            q: "Every human advance carries with it... a new responsibility, and we must remain constantly aware <u>for</u> the dangers...",
            options: { a: "aware about", b: "aware of", c: "aware to", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) aware of:</strong> The adjective 'aware' takes the preposition 'of' when referring to having knowledge or perception of a situation or fact."
        },
        {
            q: "After the successful performance of the great actor was over, there was <u>thunder-struck</u> applause for a few minutes.",
            options: { a: "fearful", b: "cheerful", c: "decisive", d: "thunderous", e: "No correction required" },
            ans: "d",
            expl: "<strong>(d) thunderous:</strong> 'Thunderous' describes a very loud noise, which correctly pairs with applause. 'Thunderstruck' means extremely surprised or shocked, describing a person's feeling."
        },
        {
            q: "My brother as well as my sister <u>are staying</u> with me.",
            options: { a: "have stayed", b: "were staying", c: "is staying", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) is staying:</strong> When two subjects are connected by phrases like 'as well as', 'along with', or 'together with', the verb must agree in number with the first subject (brother - singular)."
        },
        {
            q: "She insisted <u>for accompanying</u> her husband on the tour.",
            options: { a: "on accompanying", b: "in accompanying", c: "to accompany", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) on accompanying:</strong> The verb 'insist' is idiomatically followed by the preposition 'on' and a gerund (-ing form)."
        },
        {
            q: "He is <u>so handsome</u> man that people turn round to look at him.",
            options: { a: "very handsome", b: "such a handsome", c: "too handsome", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) such a handsome:</strong> The correct grammatical structure when a noun phrase (handsome man) follows the intensifier is 'such a/an + adjective + noun + that clause'. 'So' is used with adjectives alone without a noun."
        },
        {
            q: "This time she is coming in holidays for an <u>extending</u> stay here.",
            options: { a: "extensive", b: "extension", c: "extended", d: "No improvement" },
            ans: "c",
            expl: "<strong>(c) extended:</strong> 'Extended' acts as an adjective here meaning 'longer than usual or expected', making 'an extended stay' the correct idiomatic phrase."
        },
        {
            q: "Any order which <u>curbs</u> a police officer from doing his duty is itself unlawful...",
            options: { a: "restricts", b: "prevents", c: "stops", d: "obstructs" },
            ans: "b",
            expl: "<strong>(b) prevents:</strong> You 'prevent' someone 'from' doing something. While the other verbs denote stopping, 'prevents' grammatically pairs with the preposition 'from' in this context."
        },
        {
            q: "I shall try to finish reading this novel by the end of <u>this present month</u>.",
            options: { a: "this current month", b: "this month", c: "this very month", d: "No improvement" },
            ans: "b",
            expl: "<strong>(b) this month:</strong> 'This month' inherently means the current or present month, making the addition of 'present' redundant."
        },
        {
            q: "He found it difficult to <u>adapt to the changed circumstances</u>.",
            options: { a: "adapt himself to", b: "adapt with", c: "adapt according to", d: "No improvement" },
            ans: "a",
            expl: "<strong>(a) adapt himself to:</strong> In formal grammar, the verb 'adapt' when meaning 'to adjust to new conditions' should be used reflexively (adapt oneself to something)."
        }
    ];

    let currentQuestionIndex = 0;
    const userAnswers = new Array(quizData.length).fill(null);
    
    // UI Elements
    const qBody = document.getElementById('questionBody');
    const footerNav = document.getElementById('footerNav');
    const resultBody = document.getElementById('resultBody');
    const qText = document.getElementById('questionText');
    const optsContainer = document.getElementById('optionsContainer');
    const explBox = document.getElementById('explanationBox');
    const progBar = document.getElementById('progressBar');
    const qCount = document.getElementById('questionCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function loadQuestion(index) {
        const qData = quizData[index];
        
        qCount.innerText = `Question ${index + 1} of ${quizData.length}`;
        progBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
        
        qText.innerHTML = `${index + 1}. ${qData.q}`;
        optsContainer.innerHTML = '';
        explBox.style.display = 'none';
        
        for (const [key, value] of Object.entries(qData.options)) {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `(${key}) ${value}`;
            
            if (userAnswers[index]) {
                btn.disabled = true;
                if (key === qData.ans) {
                    btn.classList.add('correct');
                } else if (key === userAnswers[index] && key !== qData.ans) {
                    btn.classList.add('wrong');
                }
            } else {
                btn.onclick = () => selectAnswer(key, btn);
            }
            optsContainer.appendChild(btn);
        }

        if (userAnswers[index]) {
            explBox.innerHTML = qData.expl;
            explBox.style.display = 'block';
        }

        prevBtn.disabled = index === 0;
        nextBtn.innerText = index === quizData.length - 1 ? 'Finish & View Results' : 'Next';
    }

    function selectAnswer(selectedKey, btnElement) {
        const qData = quizData[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = selectedKey;
        
        const allBtns = optsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => {
            btn.disabled = true;
            const btnKey = btn.innerText.match(/\((.)\)/)[1];
            if (btnKey === qData.ans) btn.classList.add('correct');
        });

        if (selectedKey !== qData.ans) btnElement.classList.add('wrong');

        explBox.innerHTML = qData.expl;
        explBox.style.display = 'block';
        
        // Auto Scroll Feature
        setTimeout(() => {
            footerNav.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 150);
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion(currentQuestionIndex);
        } else {
            showFinalResults();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion(currentQuestionIndex);
        }
    }

    function showFinalResults() {
        qBody.style.display = 'none';
        footerNav.style.display = 'none';
        resultBody.style.display = 'block';

        let correct = 0;
        let wrong = 0;
        let skipped = 0;
        let reviewHTML = '';

        quizData.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            let isCorrect = false;
            let cardClass = '';
            let userIcon = '';
            
            if (!userAns) {
                skipped++;
                cardClass = 'is-skipped';
                userIcon = '<span class="icon" style="color:#94a3b8;">➖</span>';
            } else if (userAns === q.ans) {
                correct++;
                isCorrect = true;
                cardClass = 'is-correct';
                userIcon = '<span class="icon" style="color:#22c55e;">✅</span>';
            } else {
                wrong++;
                cardClass = 'is-wrong';
                userIcon = '<span class="icon" style="color:#ef4444;">❌</span>';
            }

            reviewHTML += `
                <div class="review-card ${cardClass}">
                    <div class="r-question">Q${idx + 1}. ${q.q}</div>
                    <div class="r-answer-block">
                        <div class="r-row ${isCorrect ? 'text-correct' : (userAns ? 'text-wrong' : 'text-muted')}">
                            ${userIcon} Your Answer: ${userAns ? `(${userAns}) ${q.options[userAns]}` : 'Skipped'}
                        </div>
                        ${!isCorrect ? `
                        <div class="r-row text-correct">
                            <span class="icon">🎯</span> Correct Answer: (${q.ans}) ${q.options[q.ans]}
                        </div>` : ''}
                    </div>
                    <div class="r-explanation">${q.expl}</div>
                </div>
            `;
        });

        const total = quizData.length;
        const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

        document.getElementById('statTotal').innerText = total;
        document.getElementById('statCorrect').innerText = correct;
        document.getElementById('statWrong').innerText = wrong;
        document.getElementById('statAcc').innerText = `${accuracy}%`;
        
        document.getElementById('reviewList').innerHTML = reviewHTML;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize Quiz
    loadQuestion(0);
</script>

</body>
</html>
