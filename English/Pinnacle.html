<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CGL Idioms Quiz</title>
    <style>
        /* Import Google Font for better aesthetics */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif; /* Modern, clean font */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* Changed from flex-end to center */
            align-items: center;     /* Centers vertically */
            min-height: 100vh;
        }

        .quiz-container {
            background-color: #ffffff;
            width: 450px;
            max-width: 90%;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 28px; /* Larger title font */
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            display: inline-block;
        }

        .question-text {
            font-size: 22px; /* Increased size for readability */
            font-weight: 600;
            color: #34495e;
            margin-bottom: 25px;
        }

        .options-list {
            list-style-type: none;
            padding: 0;
            text-align: left;
        }

        .option-btn {
            background-color: #f1f2f6;
            border: 2px solid #dfe4ea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            width: 100%;
            cursor: pointer;
            font-size: 18px; /* Larger option text */
            color: #2f3542;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-btn:hover {
            background-color: #dff9fb;
            border-color: #3498db;
        }

        .option-btn.correct {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        .option-btn.incorrect {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #next-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            display: none; /* Hidden until answer is selected */
        }

        #next-btn:hover {
            background-color: #2980b9;
        }

        .score-board {
            font-size: 18px;
            font-weight: bold;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>English Idioms</h2>
    <div id="quiz">
        <div class="question-text" id="question">Loading...</div>
        <div class="options-list" id="options"></div>
    </div>
    <div class="controls">
        <span class="score-board" id="score">Score: 0</span>
        <button id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>
</div>

<script>
    // Data source: Extracted from provided PDF and standard SSC CGL definitions
    const questions = [
        {
            question: "Idiom: Cooked your goose",
            answer: "To interfere with or ruin someone's plans", 
            options: [
                "To prepare a delicious meal for guests",
                "To interfere with or ruin someone's plans",
                "To get very angry at someone",
                "To complete a task successfully"
            ]
        },
        {
            question: "Idiom: Care a hang",
            answer: "Showing no interest", 
            options: [
                "To hang something very carefully",
                "Showing no interest",
                "To be extremely worried about a situation",
                "To support someone unconditionally"
            ]
        },
        {
            question: "Idiom: Nobody's fool",
            answer: "Not easily deceived", 
            options: [
                "A person who has no friends",
                "Not easily deceived",
                "A very foolish person",
                "Someone who acts funny"
            ]
        },
        {
            question: "Idiom: Easy does it",
            answer: "Do something slowly and carefully", 
            options: [
                "Do something slowly and carefully",
                "A task that requires no effort",
                "To give up easily",
                "To do something very quickly"
            ]
        },
        {
            question: "Idiom: Penelope's web",
            answer: "An endless task", 
            options: [
                "A complicated internet problem",
                "A very delicate fabric",
                "An endless task",
                "A trap set by a spider"
            ]
        },
        {
            question: "Idiom: Creature of habit",
            answer: "One who does the same thing in the same way", 
            options: [
                "Someone who loves animals",
                "One who does the same thing in the same way",
                "A person with many bad habits",
                "Someone who changes their mind often"
            ]
        },
        {
            question: "Idiom: At a low ebb",
            answer: "In a depressed or weak state", 
            options: [
                "To be at the bottom of the ocean",
                "In a depressed or weak state",
                "To have very little money left",
                "Feeling very energetic and happy"
            ]
        },
        {
            question: "Idiom: Turned up their nose at her",
            answer: "Treated her with contempt", 
            options: [
                "Smelled something unpleasant",
                "Treated her with contempt",
                "Looked upwards at the sky",
                "Praised her highly"
            ]
        },
        {
            question: "Idiom: Goes hard with",
            answer: "To prove a serious matter for someone",
            options: [
                "To become solid and rigid",
                "To prove a serious matter for someone",
                "To fight with determination",
                "To accompany a difficult person"
            ]
        },
        {
            question: "Idiom: Rift in the lute",
            answer: "A small flaw that ruins the harmony",
            options: [
                "A broken musical instrument",
                "A small flaw that ruins the harmony",
                "A loud and unpleasant noise",
                "A gap between two mountains"
            ]
        },
        {
            question: "Idiom: Best thing since sliced bread",
            answer: "A very good new idea or invention",
            options: [
                "A delicious bakery item",
                "A very good new idea or invention",
                "Something that is very easy to eat",
                "An old tradition revived"
            ]
        },
        {
            question: "Idiom: Bells and whistles",
            answer: "Extra features or trimmings",
            options: [
                "Loud warning signals",
                "Extra features or trimmings",
                "Musical instruments in a band",
                "Essential parts of a machine"
            ]
        },
        {
            question: "Idiom: Where the shoe pinches",
            answer: "Where the real trouble or stress lies",
            options: [
                "Wearing tight footwear",
                "Where the real trouble or stress lies",
                "A painful foot injury",
                "The bottom of a problem"
            ]
        },
        {
            question: "Idiom: A sting in the tail",
            answer: "An unpleasant ending to something good",
            options: [
                "An insect bite that hurts",
                "An unpleasant ending to something good",
                "A sharp object hidden behind",
                "A story with a happy ending"
            ]
        },
        {
            question: "Idiom: Out of the frying pan into the fire",
            answer: "From a bad situation to a worse one",
            options: [
                "Escaping a fire successfully",
                "From a bad situation to a worse one",
                "Cooking something very quickly",
                "Solving a difficult problem"
            ]
        },
        {
            question: "Idiom: Bury the hatchet",
            answer: "To make peace",
            options: [
                "To hide a weapon",
                "To start a new fight",
                "To dig a deep hole",
                "To make peace"
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    // Shuffle function to randomize options every time
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function loadQuestion() {
        const currentData = questions[currentQuestionIndex];
        document.getElementById("question").innerText = currentData.question;
        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";
        document.getElementById("next-btn").style.display = "none";

        // Clone options to avoid modifying original array and shuffle them
        let currentOptions = [...currentData.options];
        shuffleArray(currentOptions);

        currentOptions.forEach(option => {
            const btn = document.createElement("button");
            btn.classList.add("option-btn");
            btn.innerText = option;
            btn.onclick = () => checkAnswer(btn, currentData.answer);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, correctAnswer) {
        const buttons = document.querySelectorAll(".option-btn");
        
        // Disable all buttons after selection
        buttons.forEach(btn => {
            btn.disabled = true;
            if (btn.innerText === correctAnswer) {
                btn.classList.add("correct");
            }
        });

        if (selectedBtn.innerText === correctAnswer) {
            score++;
            document.getElementById("score").innerText = `Score: ${score}`;
        } else {
            selectedBtn.classList.add("incorrect");
        }

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            // Quiz Finished
            document.getElementById("quiz").innerHTML = `<h3>Quiz Completed!</h3><p>Your final score is ${score} out of ${questions.length}</p>`;
            document.getElementById("next-btn").style.display = "none";
        }
    }

    // Initialize Quiz
    loadQuestion();

</script>

</body>
</html>
